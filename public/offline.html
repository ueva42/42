<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Streets of Logic</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050816;
      color: #f9fafb;
      font-family: Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }

    .card {
      max-width: 480px;
      border: 1px solid #334155;
      background: #0f172a;
      border-radius: 12px;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    p {
      margin: 8px 0;
      line-height: 1.4;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Du bist offline</h1>
    <p>Streets of Logic braucht gerade eine Internetverbindung fuer Live-Daten.</p>
    <p>Bitte Verbindung pruefen und die Seite erneut laden.</p>
  </main>
</body>
</html>
