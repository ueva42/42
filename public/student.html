<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>
  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(168, 85, 247, 0.3), transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59, 130, 246, 0.25), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30, 64, 175, 0.45), transparent 60%),
        #020308;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid #4c1d95;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }

    .logout-btn {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      border: none;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #3f2d7c;
      padding-bottom: 6px;
      color: #c4b5fd;
    }

    .card {
      background: radial-gradient(circle at top left, #1e1b4b 0, #020617 60%);
      border: 1px solid #312e81;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
    }

    /* Charakterbild */
    .char-big {
      width: 240px;
      height: auto;
      max-height: 400px;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      margin: 0 auto 10px;
      border: none;
    }

    /* Levelbalken */
    .level-step-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .level-step {
      width: 60px;
      height: 10px;
      background: #1b1537;
      border-radius: 6px;
      border: 1px solid #4c1d95;
      overflow: hidden;
      position: relative;
    }

    .level-step-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      width: 0%;
      transition: width 0.4s ease;
    }

    .level-step-star {
      font-size: 20px;
      color: gold;
    }

    /* Missionen Karussell */
    .carousel {
      position: relative;
      overflow: hidden;
      margin-top: 15px;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s ease;
    }

    .mission-slide {
      min-width: 100%;
      box-sizing: border-box;
      padding: 10px;
    }

    .mission-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #4c1d95;
      display: block;
      margin: 0 auto 10px;
    }

    /* Carousel Buttons */
    .carousel-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      font-size: 30px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.4);
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      color: white;
      z-index: 5;
    }

    .left-btn {
      left: 10px;
    }

    .right-btn {
      right: 10px;
    }

    /* Pagination Dots */
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #4c1d95;
      border-radius: 50%;
      opacity: 0.4;
      transition: 0.2s;
      cursor: pointer;
    }

    .dot.active {
      opacity: 1;
      transform: scale(1.2);
      background: #a78bfa;
    }

    /* Upload Grid */
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .upload-card {
      background: #111026;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2d2254;
    }

    .upload-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <header>
    <h1>TEMPLE OF LOGIC – Schülerbereich</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="container">

    <!-- USER OVERVIEW -->
    <h2>Dein Status</h2>
    <div class="card">
      <div id="userCard"></div>
      <div id="levelBar"></div>
    </div>

    <!-- CHARAKTER -->
    <h2>Dein Charakter</h2>
    <div class="card" id="characterCard"></div>

    <!-- TRAITS & ITEMS -->
    <h2>Eigenschaften & Items</h2>
    <div class="card" id="traitsItemsCard"></div>

    <!-- MISSIONEN -->
    <h2>Missionen</h2>
    <div class="card">
      <div class="carousel">
        <button class="carousel-btn left-btn" onclick="prevSlide()">❮</button>
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="carousel-btn right-btn" onclick="nextSlide()">❯</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>

    <!-- XP LOG -->
    <h2>Deine XP-History</h2>
    <div id="xpLog"></div>

    <!-- UPLOADS -->
    <h2>Deine Uploads</h2>
    <div class="upload-grid" id="uploadGrid"></div>

  </div>

  <script>
    let missions = [];
    let currentSlide = 0;
    let xpPerMission = {};

    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      location.href = "/login.html";
    }

    async function loadMe() {
      const r = await fetch("/api/student/me");
      const data = await r.json();

      const u = data.user;
      xpPerMission = data.xp_per_mission || {};

      document.getElementById("userCard").innerHTML =
        `<b>Name:</b> ${u.name}<br>
         <b>XP:</b> ${u.xp}<br>
         <b>Level:</b> ${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)`;


      /* Charakterkarte */
      document.getElementById("characterCard").innerHTML =
        data.character
          ? `<img class="char-big" src="${data.character.image_url}">
             <div style="text-align:center;margin-top:5px;">${data.character.name}</div>`
          : "Noch kein Charakter gewählt.";


      /* Traits + Items */
      document.getElementById("traitsItemsCard").innerHTML =
        `<b>Eigenschaften:</b><br>${data.traits.map(t => "• " + t).join("<br>")}<br><br>
         <b>Items:</b><br>${data.items.map(i => "• " + i).join("<br>")}`;

      /* XP LOG */
      const xpDiv = document.getElementById("xpLog");
      xpDiv.innerHTML = "";
      data.xp_log.forEach(e => {
        xpDiv.innerHTML += `
          <div style="padding:8px;border-bottom:1px solid #3c2d69;font-size:14px;">
            <b>${e.amount} XP</b> – ${e.mission_name || e.source}<br>
            <span style="opacity:0.7;">${new Date(e.created_at).toLocaleString("de-DE")}</span>
          </div>`;
      });

      /* Upload Grid */
      const up = document.getElementById("uploadGrid");
      up.innerHTML = "";
      data.uploads.forEach(upl => {
        up.innerHTML += `
          <div class="upload-card">
            <img src="${upl.image_url}">
            <div style="font-size:12px;opacity:0.8;">${upl.mission_name || "—"}</div>
          </div>`;
      });

      renderLevelBar(data.user, data.levels);
    }


    /* NEW LEVEL-BAR */
    function renderLevelBar(user, levels) {
      let html = `<div class="level-step-container">`;

      for (let i = 0; i < levels.length; i++) {

        if (i > 0) html += `<div class="level-step-star">★</div>`;

        const min = levels[i].min_xp;
        const nextMin = levels[i + 1]?.min_xp || min;
        let pct = 0;

        if (user.xp >= min) {
          pct = Math.min(100, ((user.xp - min) / (nextMin - min)) * 100);
          if (!isFinite(pct) || pct < 0) pct = 100;
        }

        html += `
          <div class="level-step">
            <div class="level-step-fill" style="width:${pct}%;"></div>
          </div>
        `;
      }

      html += `</div>`;
      document.getElementById("levelBar").innerHTML = html;
    }


    /* MISSIONEN */
    async function loadMissions() {
      const r = await fetch("/api/student/missions");
      missions = await r.json();

      const track = document.getElementById("carouselTrack");
      const dotsDiv = document.getElementById("dots");

      track.innerHTML = "";
      dotsDiv.innerHTML = "";

      missions.forEach((m, idx) => {

        track.innerHTML += `
          <div class="mission-slide">
            ${m.image_url ? `<img class="mission-img" src="${m.image_url}">` : ""}
            <h3 style="text-align:center;">${m.name}</h3>
            <div style="text-align:center;"><b>${m.xp} XP</b></div>
            <div style="text-align:center;opacity:0.7;margin-top:5px;">
              Bereits erhalten: ${xpPerMission[m.id] || 0} XP
            </div>

            ${m.require_upload ? `
              <div style="margin-top:12px;text-align:center;">
                <input type="file" id="upload_${m.id}">
                <button onclick="uploadMission(${m.id})"
                  style="margin-top:8px;padding:6px 12px;border-radius:6px;
                  background:#3b82f6;border:none;color:#fff;cursor:pointer;">
                  Upload senden
                </button>
              </div>
            ` : ""}
          </div>`;
        
        dotsDiv.innerHTML += `<div class="dot" onclick="goToSlide(${idx})"></div>`;
      });

      updateCarousel();
    }


    function updateCarousel() {
      const track = document.getElementById("carouselTrack");
      const dots = document.querySelectorAll(".dot");

      track.style.transform = `translateX(-${currentSlide * 100}%)`;

      dots.forEach((d, i) =>
        d.classList.toggle("active", i === currentSlide)
      );
    }

    function prevSlide() {
      currentSlide = Math.max(0, currentSlide - 1);
      updateCarousel();
    }

    function nextSlide() {
      currentSlide = Math.min(missions.length - 1, currentSlide + 1);
      updateCarousel();
    }

    function goToSlide(idx) {
      currentSlide = idx;
      updateCarousel();
    }


    async function uploadMission(id) {
      const file = document.getElementById(`upload_${id}`).files[0];
      if (!file) return alert("Bitte ein Bild auswählen!");

      const fd = new FormData();
      fd.append("image", file);
      fd.append("missionId", id);

      const r = await fetch("/api/student/uploadForMission", {
        method: "POST",
        body: fd
      });

      const data = await r.json();
      if (data.success) {
        alert("Upload erfolgreich!");
        loadMe();
      } else {
        alert("Upload fehlgeschlagen.");
      }
    }


    loadMe();
    loadMissions();
  </script>

</body>

</html>
