<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>

  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(168,85,247,0.3) 0, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,0.25) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30,64,175,0.45) 0, transparent 60%),
        #020308;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid #4c1d95;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }

    .logout-btn {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      border: none;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #3f2d7c;
      padding-bottom: 6px;
      color: #c4b5fd;
    }

    .card {
      background: radial-gradient(circle at top left, #1e1b4b 0, #020617 60%);
      border: 1px solid #312e81;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
    }

    /* ================= CHARACTER IMAGE ================ */
    .character-image {
      width: 240px;
      height: 400px;
      object-fit: cover;
      display: block;
      margin: 0 auto 15px auto;
      border-radius: 12px;
    }

    /* ================= LEVEL BAR ===================== */
    .level-bar-container {
      width: 100%;
      height: 26px;
      background: #0d0b1e;
      border: 1px solid #3f2d7c;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .level-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      transition: width 0.7s ease-out;
    }

    .level-star {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 26px;
      color: gold;
      text-shadow: 0 0 12px gold;
    }

    /* ================= MISSIONS KARUSSELL ===================== */
    .carousel-wrapper {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 440px;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s ease-in-out;
      height: 100%;
    }

    .mission-card {
      min-width: 100%;
      padding: 10px;
      box-sizing: border-box;
      text-align: center;
    }

    .mission-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
      margin: 0 auto;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(40, 30, 80, 0.7);
      border: 1px solid #5b4cab;
      padding: 10px 14px;
      color: #eee;
      cursor: pointer;
      border-radius: 8px;
      font-size: 18px;
      z-index: 10;
    }

    .carousel-btn:hover {
      background: rgba(90, 70, 160, 0.8);
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    .dots {
      text-align: center;
      margin-top: 8px;
    }

    .dot {
      height: 10px;
      width: 10px;
      background: #4b4b7a;
      display: inline-block;
      border-radius: 50%;
      margin: 4px;
      transition: 0.2s;
    }

    .dot.active {
      background: #a78bfa;
      width: 18px;
      border-radius: 8px;
    }

    /* UPLOAD GRID */
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .upload-card {
      background: #111026;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2d2254;
    }

    .upload-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }

  </style>
</head>
<body>

<header>
  <h1>TEMPLE OF LOGIC – Schülerbereich</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- CHARACTER IMAGE -->
  <img id="characterImage" class="character-image" src="" alt="Character">

  <!-- LEVEL BAR -->
  <div class="level-bar-container">
    <div id="levelFill" class="level-bar-fill"></div>
    <div class="level-star">★</div>
  </div>

  <!-- USER INFO -->
  <h2>Dein Status</h2>
  <div class="card" id="userCard"></div>

  <!-- TRAITS & ITEMS -->
  <h2>Eigenschaften & Items</h2>
  <div class="card" id="traitsItemsCard"></div>

  <!-- MISSIONS -->
  <h2>Missionen</h2>

  <div class="carousel-wrapper">
    <button class="carousel-btn prev" onclick="prevMission()">❮</button>
    <button class="carousel-btn next" onclick="nextMission()">❯</button>

    <div id="carouselTrack" class="carousel-track"></div>
  </div>

  <div id="dots" class="dots"></div>

  <!-- XP LOG -->
  <h2>Deine XP-History</h2>
  <div id="xpLog"></div>

  <!-- UPLOADS -->
  <h2>Deine Uploads</h2>
  <div class="upload-grid" id="uploadGrid"></div>

</div>

<script>
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

let missions = [];
let currentMission = 0;

async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();
  const u = data.user;

  // CHARACTER IMAGE
  document.getElementById("characterImage").src =
    data.character ? data.character.image_url : "";

  // USER CARD
  document.getElementById("userCard").innerHTML = `
    <b>Name:</b> ${u.name}<br>
    <b>XP:</b> ${u.xp}<br>
    <b>Level:</b> ${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)
  `;

  // LEVEL BAR
  updateLevelBar(u.xp, data.levels);

  // TRAITS + ITEMS
  document.getElementById("traitsItemsCard").innerHTML = `
    <b>Eigenschaften:</b><br>
    ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
    <b>Items:</b><br>
    ${data.items.map(i => "• " + i).join("<br>")}
  `;

  // XP LOG
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div style="padding:8px;border-bottom:1px solid #3c2d69;">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source} <br>
        <span style="opacity:0.7;">${d}</span>
      </div>`;
  });

  // UPLOADS
  const up = document.getElementById("uploadGrid");
  up.innerHTML = "";
  data.uploads.forEach(upl => {
    up.innerHTML += `
      <div class="upload-card">
        <img src="${upl.image_url}">
        <div style="font-size:12px;opacity:0.8;">${upl.mission_name || "—"}</div>
      </div>
    `;
  });
}

function updateLevelBar(xp, levels) {
  if (!levels.length) return;

  let current = levels[0];
  let next = levels[levels.length - 1];

  for (let i = 0; i < levels.length; i++) {
    if (xp >= levels[i].min_xp) {
      current = levels[i];
      next = levels[i + 1] || null;
    }
  }

  let progress = 1;
  if (next) {
    const span = next.min_xp - current.min_xp;
    const gained = xp - current.min_xp;
    progress = gained / span;
  }

  document.getElementById("levelFill").style.width =
    Math.max(5, Math.min(100, progress * 100)) + "%";
}

async function loadMissions() {
  const r = await fetch("/api/student/missions");
  missions = await r.json();

  const track = document.getElementById("carouselTrack");
  const dots = document.getElementById("dots");

  track.innerHTML = "";
  dots.innerHTML = "";

  missions.forEach((m, i) => {
    track.innerHTML += `
      <div class="mission-card">
        ${m.image_url ? `<img class="mission-img" src="${m.image_url}">` : ""}
        <h3>${m.name}</h3>
        <div><b>${m.xp} XP</b></div>
        ${m.require_upload ? `<p style="color:#fca5a5;">📎 Upload erforderlich</p>` : ""}
        ${m.require_upload ? `
          <input type="file" id="upload_${m.id}">
          <button onclick="uploadMission(${m.id})">Upload senden</button>
        ` : ""}
      </div>
    `;

    dots.innerHTML += `<span class="dot ${i === 0 ? "active" : ""}"></span>`;
  });

  updateCarousel();
}

function updateCarousel() {
  const track = document.getElementById("carouselTrack");
  track.style.transform = `translateX(-${currentMission * 100}%)`;

  const dots = document.querySelectorAll(".dot");
  dots.forEach((d, i) => {
    d.classList.toggle("active", i === currentMission);
  });
}

function nextMission() {
  currentMission = (currentMission + 1) % missions.length;
  updateCarousel();
}

function prevMission() {
  currentMission = (currentMission - 1 + missions.length) % missions.length;
  updateCarousel();
}

// SWIPE SUPPORT
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].clientX - startX;
  if (diff > 50) prevMission();
  if (diff < -50) nextMission();
});

async function uploadMission(missionId) {
  const fileInput = document.getElementById(`upload_${missionId}`);
  const file = fileInput.files[0];
  if (!file) return alert("Bitte ein Bild auswählen!");

  const form = new FormData();
  form.append("image", file);
  form.append("missionId", missionId);

  const r = await fetch("/api/student/uploadForMission", {
    method: "POST",
    body: form
  });

  const data = await r.json();
  if (data.success) {
    alert("Upload erfolgreich!");
    loadMe();
  } else {
    alert("Upload fehlgeschlagen.");
  }
}

loadMe();
loadMissions();
</script>

</body>
</html>
