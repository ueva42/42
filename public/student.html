<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temple of Logic – Student</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0d0f18, #111423);
      color: #d1d5db;
      text-align: center;
    }

    .container {
      max-width: 720px;
      margin: 40px auto;
      padding-bottom: 120px;
    }

    h1 {
      color: #8ab4ff;
      margin-bottom: 0;
    }

    .section-title {
      font-size: 22px;
      color: #77c8ff;
      margin-top: 32px;
    }

    /* Charakter-Karte */
    .character-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,150,255,0.15);
    }

    .character-img {
      width: 260px;
      height: 260px;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(0,150,255,0.4);
      margin-top: 12px;
      background: #050814;
    }

    /* XP-Anzeige */
    .xp-box {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #90eeff;
    }

    .xp-bar-container {
      width: 90%;
      margin: 12px auto;
      height: 24px;
      background: #1c2234;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2f3958;
    }

    .xp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00b7ff, #4bd6ff);
      box-shadow: 0 0 12px rgba(0,180,255,0.6);
      transition: width 1s ease;
    }

    /* Traits */
    #traitsBox {
      margin-top: 8px;
    }

    .trait-badge {
      display: inline-block;
      margin: 4px;
      padding: 6px 10px;
      font-size: 15px;
      background: rgba(0,140,255,0.2);
      border: 1px solid rgba(0,180,255,0.4);
      border-radius: 10px;
    }

    /* Items */
    .items-grid {
      width: 90%;
      margin: 10px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: #161b28;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2c344a;
      font-size: 15px;
      text-align: left;
    }

    /* Erhaltene Missionen */
    .mission-list {
      width: 90%;
      margin: 14px auto;
      text-align: left;
    }

    .mission-entry {
      margin: 4px 0;
      font-size: 16px;
      color: #d5e8ff;
    }

    /* Logout Button (blau wie Admin) */
    .logout-button {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(0,122,255,0.2);
      color: #7ab6ff;
      padding: 10px 18px;
      border: 1px solid rgba(80,150,255,0.6);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      backdrop-filter: blur(6px);
      transition: 0.2s;
      z-index: 2000;
    }

    .logout-button:hover {
      background: rgba(80,150,255,0.35);
      transform: translateY(-2px);
    }

    /* Goodbye Overlay */
    #goodbyeOverlay {
      position: fixed;
      inset: 0;
      background: #000000cc;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(8px);
      z-index: 999;
    }
  </style>
</head>

<body>

  <button id="logoutBtn" class="logout-button">Logout</button>
  <div id="goodbyeOverlay">Auf Wiedersehen!</div>

  <div class="container">
    <div class="character-card">
      <h1>Dein Charakter</h1>
      <img id="characterImg" class="character-img" src="" alt="Charakter">

      <div class="xp-box">
        XP: <span id="xpValue">0</span>
      </div>

      <div class="xp-bar-container">
        <div id="xpBar" class="xp-bar"></div>
      </div>
    </div>

    <h2 class="section-title">Eigenschaften</h2>
    <div id="traitsBox"></div>

    <h2 class="section-title">Ausrüstung</h2>
    <div id="itemsGrid" class="items-grid"></div>

    <h2 class="section-title">Erhaltene Missionen</h2>
    <div id="missionList" class="mission-list"></div>
  </div>

  <script>
    async function ensureFirstLogin() {
      // Weist einmalig Charakter + Traits + Items zu
      const res = await fetch("/api/student/firstLogin", {
        method: "POST",
        headers: { "Content-Type": "application/json" }
      });
      // Antwort ist egal – wichtig ist nur, dass es einmal ausgeführt wird
    }

    async function loadStudent() {
      const res = await fetch("/api/student/me");
      if (!res.ok) {
        console.error("Fehler bei /api/student/me:", res.status);
        return;
      }
      const data = await res.json();

      const user = data.user || {};
      const character = data.character || null;
      const xpLog = data.xp_log || [];

      // Charakterbild
      if (character && character.image_url) {
        document.getElementById("characterImg").src = character.image_url;
      } else {
        // Falls kein Bild vorhanden ist – neutral lassen
        document.getElementById("characterImg").src = "";
      }

      // XP
      const xp = user.xp ?? 0;
      document.getElementById("xpValue").textContent = xp;

      // XP-Balken
      const xpBar = document.getElementById("xpBar");
      const minXP = user.level_min_xp ?? 0;
      const nextXP = minXP + 100;
      const progress = Math.min(100, ((xp - minXP) / (nextXP - minXP)) * 100);
      xpBar.style.width = (isFinite(progress) ? progress : 0) + "%";

      // Traits
      const traitsBox = document.getElementById("traitsBox");
      traitsBox.innerHTML = "";
      const traits = user.traits || [];
      traits.forEach(t => {
        const d = document.createElement("div");
        d.className = "trait-badge";
        d.textContent = t;
        traitsBox.appendChild(d);
      });

      // Items
      const itemsGrid = document.getElementById("itemsGrid");
      itemsGrid.innerHTML = "";
      const items = user.items || [];
      items.forEach(i => {
        const c = document.createElement("div");
        c.className = "item-card";
        c.textContent = i;
        itemsGrid.appendChild(c);
      });

      // Missionen
      const missionBox = document.getElementById("missionList");
      missionBox.innerHTML = "";

      xpLog
        .filter(entry => entry.source === "mission")
        .forEach(entry => {
          const row = document.createElement("div");
          row.className = "mission-entry";
          row.textContent = `${entry.mission_name} – +${entry.amount} XP`;
          missionBox.appendChild(row);
        });
    }

    // Logout mit kleinem Fade-Out
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      const overlay = document.getElementById("goodbyeOverlay");
      overlay.style.opacity = "1";
      overlay.style.pointerEvents = "auto";

      await new Promise(res => setTimeout(res, 700));

      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    (async () => {
      await ensureFirstLogin();
      await loadStudent();
    })();
  </script>

</body>
</html>
