<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Student</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>

    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(168,85,247,0.25), transparent 60%),
        radial-gradient(circle at 90% 60%, rgba(59,130,246,0.25), transparent 70%),
        #050312;
      font-family: Arial, sans-serif;
      color: #eee;
      padding: 20px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .orb {
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #facc15, #f97316 20%, #4c1d95 60%, #020617 100%);
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.75);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.07em;
    }

    /* CHARACTER */
    .character-card {
      background: rgba(20, 16, 36, 0.8);
      border: 1px solid rgba(120, 90, 200, 0.6);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 0 20px rgba(80, 50, 180, 0.4);
      backdrop-filter: blur(8px);
    }

    .character-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 12px;
      border: 3px solid #6d28d9;
      box-shadow: 0 0 12px rgba(139,92,246,0.7);
    }

    .xp-box {
      margin-top: 10px;
      font-size: 18px;
      color: #c4b5fd;
    }

    /* SECTION */
    .section-title {
      font-size: 20px;
      margin: 20px 0 10px;
      color: #ddd6fe;
      text-align: center;
    }

    /* TRAITS + ITEMS */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .small-card {
      background: rgba(30, 24, 54, 0.75);
      border: 1px solid rgba(140,100,240,0.5);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 14px rgba(140,100,240,0.4);
      line-height: 1.3;
      font-size: 14px;
    }

  </style>
</head>
<body>

<div class="header">
  <div class="orb"></div>
  <h1>Temple of Logic</h1>
</div>

<!-- CHARACTER -->
<div class="character-card" id="characterBox">
  <img id="characterImg" class="character-img" src="" alt="Charakter">
  <div id="characterName">Charakter...</div>
  <div class="xp-box" id="xpBox">XP: ...</div>
</div>

<!-- TRAITS -->
<div class="section-title">Eigenschaften</div>
<div class="card-grid" id="traitsGrid"></div>

<!-- ITEMS -->
<div class="section-title">Ausrüstung</div>
<div class="card-grid" id="itemsGrid"></div>

<script>
async function loadStudent() {
  // 1. Server fragen, ob erster Login → dann Traits/Items/Char werden generiert
  const res = await fetch("/api/student/firstLogin", {
    method: "POST",
    headers: { "Content-Type": "application/json" }
  });

  const data = await res.json();
  console.log("Student Data:", data);

  const character = data.character;
  const traits = data.traits;
  const items = data.items;

  // ==== CHARACTER ====
  document.getElementById("characterImg").src = character.image_url;
  document.getElementById("characterName").innerText = character.name;
  document.getElementById("xpBox").innerText = "XP: " + data.xp;

  // ==== TRAITS ====
  const traitsGrid = document.getElementById("traitsGrid");
  traitsGrid.innerHTML = "";
  traits.forEach(t => {
    let div = document.createElement("div");
    div.className = "small-card";
    div.innerText = t;
    traitsGrid.appendChild(div);
  });

  // ==== ITEMS ====
  const itemsGrid = document.getElementById("itemsGrid");
  itemsGrid.innerHTML = "";
  items.forEach(it => {
    let div = document.createElement("div");
    div.className = "small-card";
    div.innerText = it;
    itemsGrid.appendChild(div);
  });
}

loadStudent();
</script>

</body>
</html>
