<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temple of Logic – Schüler</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0d0f18, #111423);
      color: #d1d5db;
      text-align: center;
    }

    .container {
      max-width: 720px;
      margin: 40px auto 80px auto;
      padding-bottom: 40px;
    }

    h1 {
      color: #8ab4ff;
      margin-bottom: 0;
    }

    .section-title {
      font-size: 22px;
      color: #77c8ff;
      margin-top: 32px;
      margin-bottom: 10px;
    }

    /* Logout oben rechts */
    .logout-button {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(0,122,255,0.2);
      color: #7ab6ff;
      padding: 10px 18px;
      border: 1px solid rgba(80,150,255,0.6);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      backdrop-filter: blur(6px);
      transition: 0.2s;
      z-index: 2000;
    }
    .logout-button:hover {
      background: rgba(80,150,255,0.35);
      transform: translateY(-2px);
    }

    /* Goodbye Overlay */
    #goodbyeOverlay {
      position: fixed;
      inset: 0;
      background: #000000cc;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(8px);
      z-index: 1500;
    }

    /* Charakter-Karte */
    .character-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,150,255,0.15);
    }

    .character-img {
      width: 260px;
      height: 260px;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(0,150,255,0.4);
      margin-top: 12px;
      background: #050814;
    }

    .xp-box {
      margin-top: 20px;
      font-size: 26px;
      font-weight: bold;
      color: #90eeff;
    }

    .xp-bar-container {
      width: 90%;
      margin: 12px auto 0 auto;
      height: 24px;
      background: #1c2234;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2f3958;
    }

    .xp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00b7ff, #4bd6ff);
      box-shadow: 0 0 12px rgba(0,180,255,0.6);
      transition: width 1s ease;
    }

    #levelText {
      margin-top: 8px;
      font-size: 16px;
      color: #9fb7ff;
    }

    /* Traits */
    #traitsBox {
      margin-top: 8px;
    }

    .trait-badge {
      display: inline-block;
      margin: 4px;
      padding: 6px 10px;
      font-size: 15px;
      background: rgba(0,140,255,0.2);
      border: 1px solid rgba(0,180,255,0.4);
      border-radius: 10px;
    }

    /* Items */
    .items-grid {
      width: 90%;
      margin: 8px auto 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .item-card {
      background: #161b28;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2c344a;
      font-size: 15px;
      text-align: left;
    }

    /* Erhaltene Missionen (Liste) */
    .mission-list {
      width: 90%;
      margin: 8px auto 0 auto;
      text-align: left;
      background: #141927;
      border-radius: 12px;
      border: 1px solid #283040;
      padding: 12px 16px;
      font-size: 16px;
    }

    .mission-entry {
      margin: 4px 0;
      color: #d5e8ff;
    }

    /* Missions-Karussell */
    .carousel {
      position: relative;
      width: 90%;
      margin: 20px auto 0 auto;
      background: #141927;
      border: 1px solid #283040;
      padding: 20px 10px;
      border-radius: 14px;
      min-height: 150px;
      overflow: hidden;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(120,150,255,0.2);
      color: #a9c7ff;
      border: 1px solid rgba(120,150,255,0.4);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
      z-index: 10;
    }

    .carousel-btn:hover {
      background: rgba(120,150,255,0.4);
    }

    #prevMission {
      left: 6px;
    }

    #nextMission {
      right: 6px;
    }

    .mission-slide-wrapper {
      display: flex;
      width: 100%;
      transition: transform 0.45s ease;
    }

    .mission-card {
      min-width: 100%;
      box-sizing: border-box;
      padding: 10px 30px;
      font-size: 18px;
      color: #d0e4ff;
      text-align: center;
    }

    .mission-card-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .mission-card-xp {
      color: #8ab4ff;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .upload-btn {
      margin-top: 8px;
      padding: 8px 14px;
      background: rgba(0,170,255,0.2);
      border: 1px solid rgba(0,170,255,0.5);
      font-size: 14px;
      color: #a8e0ff;
      border-radius: 8px;
      cursor: pointer;
    }

    .upload-btn:hover {
      background: rgba(0,170,255,0.35);
    }

    @media (max-width: 600px) {
      .character-img {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>
<body>

<button id="logoutBtn" class="logout-button">Logout</button>
<div id="goodbyeOverlay">Auf Wiedersehen!</div>

<div class="container">
  <!-- Charakter / XP -->
  <div class="character-card">
    <h1>Dein Charakter</h1>
    <img id="characterImg" class="character-img" src="" alt="Charakter">

    <div class="xp-box">
      XP: <span id="xpValue">0</span>
    </div>

    <div class="xp-bar-container">
      <div id="xpBar" class="xp-bar"></div>
    </div>

    <div id="levelText"></div>
  </div>

  <!-- Traits -->
  <h2 class="section-title">Eigenschaften</h2>
  <div id="traitsBox"></div>

  <!-- Items -->
  <h2 class="section-title">Ausrüstung</h2>
  <div id="itemsGrid" class="items-grid"></div>

  <!-- Erhaltene Missionen -->
  <h2 class="section-title">Erhaltene Missionen</h2>
  <div id="missionList" class="mission-list"></div>

  <!-- Missions-Karussell (alle Missionen, mit Upload falls erlaubt) -->
  <h2 class="section-title">Missionen (Übersicht & Upload)</h2>
  <div class="carousel">
    <button id="prevMission" class="carousel-btn">&#10094;</button>

    <div id="missionSlides" class="mission-slide-wrapper">
      <!-- wird per JS gefüllt -->
    </div>

    <button id="nextMission" class="carousel-btn">&#10095;</button>
  </div>

  <!-- verstecktes File-Input für Upload -->
  <input type="file" id="missionUploadInput" accept="image/*" style="display:none" />
</div>

<script>
  let missions = [];
  let currentMissionIndex = 0;

  async function ensureFirstLogin() {
    // weist ggf. Charakter, Traits und Items zu
    await fetch("/api/student/firstLogin", { method: "POST" }).catch(() => {});
  }

  async function loadStudent() {
    const res = await fetch("/api/student/me");
    if (!res.ok) {
      console.error("Fehler /api/student/me:", res.status);
      return;
    }
    const data = await res.json();
    const user = data.user || {};
    const character = data.character || null;
    const xpLog = data.xp_log || [];

    // Charakterbild
    const imgEl = document.getElementById("characterImg");
    if (character && character.image_url) {
      imgEl.src = character.image_url;
    } else {
      imgEl.src = "https://via.placeholder.com/260x260?text=Charakter";
    }

    // XP + Level
    const xp = user.xp ?? 0;
    document.getElementById("xpValue").textContent = xp;

    const xpBar = document.getElementById("xpBar");
    const minXP = user.level_min_xp ?? 0;
    const xpSince = Math.max(0, xp - minXP);
    const progress = Math.max(5, Math.min(100, (xpSince / 100) * 100));
    xpBar.style.width = progress + "%";

    const levelName = user.level_name ? user.level_name : "Kein Level";
    document.getElementById("levelText").textContent = `Level: ${levelName}`;

    // Traits
    const traitsBox = document.getElementById("traitsBox");
    traitsBox.innerHTML = "";
    (user.traits || []).forEach(t => {
      const span = document.createElement("div");
      span.className = "trait-badge";
      span.textContent = t;
      traitsBox.appendChild(span);
    });

    // Items
    const itemsGrid = document.getElementById("itemsGrid");
    itemsGrid.innerHTML = "";
    (user.items || []).forEach(i => {
      const div = document.createElement("div");
      div.className = "item-card";
      div.textContent = i;
      itemsGrid.appendChild(div);
    });

    // Erhaltene Missionen (aus xp_log, nur source="mission")
    const missionList = document.getElementById("missionList");
    missionList.innerHTML = "";
    const missionEntries = xpLog.filter(entry => entry.source === "mission");
    if (missionEntries.length === 0) {
      missionList.innerHTML = "<i>Noch keine Missionen erhalten.</i>";
    } else {
      missionEntries.forEach(entry => {
        const row = document.createElement("div");
        row.className = "mission-entry";
        row.textContent = `${entry.mission_name} – +${entry.amount} XP`;
        missionList.appendChild(row);
      });
    }

    // Missionskarussell – alle Missionen laden
    await loadAllMissions();
  }

  async function loadAllMissions() {
    const r = await fetch("/api/missions");
    if (!r.ok) {
      console.error("Fehler /api/missions:", r.status);
      return;
    }
    missions = await r.json();
    buildMissionSlides();
  }

  function buildMissionSlides() {
    const wrapper = document.getElementById("missionSlides");
    wrapper.innerHTML = "";

    if (!missions || missions.length === 0) {
      wrapper.innerHTML = `
        <div class="mission-card">
          <div class="mission-card-title"><i>Keine Missionen angelegt.</i></div>
        </div>
      `;
      return;
    }

    missions.forEach(m => {
      const div = document.createElement("div");
      div.className = "mission-card";
      div.innerHTML = `
        <div class="mission-card-title">${m.name}</div>
        <div class="mission-card-xp">+${m.xp} XP</div>
        ${
          m.require_upload
            ? `<button class="upload-btn" onclick="uploadForMission(${m.id})">
                 Bild für diese Mission hochladen
               </button>`
            : `<div style="font-size:14px; color:#9ca3af;">Kein Upload erforderlich.</div>`
        }
      `;
      wrapper.appendChild(div);
    });

    currentMissionIndex = 0;
    updateCarouselPosition();
  }

  function updateCarouselPosition() {
    const wrapper = document.getElementById("missionSlides");
    if (!missions || missions.length === 0) {
      wrapper.style.transform = "translateX(0%)";
      return;
    }
    wrapper.style.transform = `translateX(-${currentMissionIndex * 100}%)`;
  }

  document.getElementById("prevMission").addEventListener("click", () => {
    if (!missions || missions.length === 0) return;
    currentMissionIndex =
      (currentMissionIndex - 1 + missions.length) % missions.length;
    updateCarouselPosition();
  });

  document.getElementById("nextMission").addEventListener("click", () => {
    if (!missions || missions.length === 0) return;
    currentMissionIndex = (currentMissionIndex + 1) % missions.length;
    updateCarouselPosition();
  });

  // Upload-Flow: verstecktes File-Input benutzen
  async function handleUpload(file) {
    if (!file) return;
    const form = new FormData();
    form.append("image", file);

    try {
      const res = await fetch("/api/student/upload", {
        method: "POST",
        body: form,
      });
      const data = await res.json();
      if (data.success) {
        alert("Bild erfolgreich hochgeladen.");
      } else {
        alert("Upload fehlgeschlagen.");
      }
    } catch (err) {
      console.error(err);
      alert("Fehler beim Upload.");
    }
  }

  // wird im Button im Karussell aufgerufen
  window.uploadForMission = function (missionId) {
    const input = document.getElementById("missionUploadInput");
    input.onchange = async () => {
      const file = input.files[0];
      input.value = "";
      await handleUpload(file);
    };
    input.click();
  };

  // Logout mit Fade-Out
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    const overlay = document.getElementById("goodbyeOverlay");
    overlay.style.opacity = "1";
    overlay.style.pointerEvents = "auto";

    await new Promise(res => setTimeout(res, 700));

    await fetch("/api/logout", { method: "POST" });
    location.href = "/login.html";
  });

  // Init
  (async () => {
    await ensureFirstLogin();
    await loadStudent();
  })();
</script>
</body>
</html>
