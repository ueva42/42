<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streets of Logic – XP Edition</title>

  <!-- GTA-ähnliche Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       GLOBAL – Dark GTA Comic City Background
    ============================================ */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background:
        linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.9)),
        url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=1600&q=80")
        center/cover no-repeat fixed;
      color: #f9fafb;
      font-family: Arial, sans-serif;
      display: flex;
      overflow: hidden;
      transition: margin-left 0.3s ease;
    }

    a { color: inherit; }

    /* ============================================
       SIDEBAR – GTA Comic Style
    ============================================ */
    .sidebar {
      width: 270px;
      background: linear-gradient(180deg, #050816 0%, #050816 35%, #030712 100%);
      border-right: 2px solid rgba(148,163,184,0.45);
      box-shadow: 0 0 35px rgba(0,0,0,0.95);
      padding: 18px 18px 20px 18px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 15;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .sidebar-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #facc15;
      box-shadow: 0 0 16px rgba(250,204,21,0.9);
      background: radial-gradient(circle at 30% 20%, #0ea5e9, #4f46e5 60%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      text-transform: uppercase;
    }

    .sidebar-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sidebar-title-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .sidebar-title {
      margin: 0;
      font-family: "Bangers", system-ui;
      font-size: 20px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f9fafb;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000,
        0 0 14px rgba(251,191,36,0.9);
    }

    .sidebar-subtitle {
      margin-top: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #a5b4fc;
      opacity: 0.85;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      margin-top: 8px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: radial-gradient(circle at left, #111827 0, #020617 60%);
      border: 1px solid rgba(148,163,184,0.4);
      box-shadow: 0 6px 14px rgba(0,0,0,0.85);
      transition: 0.18s ease;
    }

    .menu-item:hover {
      transform: translateX(4px);
      border-color: #f97316;
      box-shadow: 0 8px 20px rgba(248,250,252,0.22);
    }

    .menu-item.active {
      background: linear-gradient(90deg, #f97316, #a855f7);
      border-color: #fbbf24;
      box-shadow: 0 0 22px rgba(251,191,36,0.9);
      color: #0f172a;
    }

    .menu-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(15,23,42,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .menu-label {
      white-space: nowrap;
    }

    .logout-btn {
      margin-top: auto;
      margin-bottom: 4px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(248,113,113,0.65);
      background: linear-gradient(135deg, #111827, #b91c1c);
      color: #fee2e2;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 6px 20px rgba(0,0,0,0.9);
      transition: 0.18s ease;
    }

    .logout-btn:hover {
      background: linear-gradient(135deg, #7f1d1d, #ef4444);
      box-shadow: 0 0 18px rgba(248,113,113,0.9);
      transform: translateY(-1px);
    }

    /* ============================================
       MOBILE HEADER
    ============================================ */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: linear-gradient(90deg, #020617, #0b1120);
      border-bottom: 1px solid rgba(148,163,184,0.45);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
    }

    .mobile-title {
      font-family: "Bangers", system-ui;
      font-size: 18px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f9fafb;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000;
    }

    .burger {
      width: 26px;
      height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .burger span {
      height: 3px;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .mobile-logout-btn {
      border: 1px solid rgba(148,163,184,0.7);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      background: #020617;
      color: #e5e7eb;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ============================================
       MAIN AREA
    ============================================ */
    .main-area {
      flex: 1;
      padding: 28px 40px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    h1 {
      font-family: "Bangers", system-ui;
      font-size: 30px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 0;
      margin-bottom: 22px;
      color: #f9fafb;
      text-shadow:
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        3px 3px 0 #000,
        0 0 22px rgba(249,115,22,0.9);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-family: "Bebas Neue", system-ui;
      font-size: 22px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e5e7eb;
      border-bottom: 1px solid rgba(148,163,184,0.55);
      padding-bottom: 4px;
    }

    .card {
      background: linear-gradient(145deg, rgba(15,23,42,0.93), rgba(15,23,42,0.95));
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 26px;
      border: 1px solid rgba(148,163,184,0.55);
      box-shadow: 0 14px 40px rgba(15,23,42,0.95);
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(251,191,36,0.1), transparent 60%);
      opacity: 0.8;
      pointer-events: none;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .section {
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================
       CHARACTER IMAGE & TRAITS
    ============================================ */
    .character-wrapper {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .char-img-wrapper {
      position: relative;
      width: 220px;
    }

    .char-img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow:
        0 0 0 4px #020617,
        0 0 0 6px #f97316,
        0 0 22px rgba(249,115,22,0.9);
    }

    .char-name {
      margin-top: 10px;
      font-family: "Bebas Neue", system-ui;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 18px;
    }

    .char-traits {
      flex: 1;
      min-width: 220px;
      font-size: 14px;
      line-height: 1.5;
    }

    .char-traits b {
      font-family: "Bebas Neue", system-ui;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 15px;
    }

    /* ============================================
       LEVEL BAR – MULTI-STEP
    ============================================ */
    .level-step-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .level-step {
      width: 62px;
      height: 11px;
      background: #020617;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      overflow: hidden;
      box-shadow: inset 0 0 6px rgba(15,23,42,0.9);
    }

    .level-step-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15);
      width: 0%;
      transition: width 0.35s ease;
    }

    .level-step-star {
      font-size: 18px;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250,204,21,0.95);
    }

    /* ============================================
       CAROUSEL
    ============================================ */
    .carousel-wrapper {
      position: relative;
      width: 320px;
      margin: 0 auto;
      text-align: center;
    }

    .carousel-item {
      display: none;
    }

    .carousel-item.active {
      display: block;
    }

    .mission-img {
      width: 230px;
      height: 230px;
      border-radius: 30px;
      object-fit: cover;
      margin-bottom: 10px;
      box-shadow:
        0 0 0 4px #020617,
        0 0 0 5px #a855f7,
        0 0 24px rgba(168,85,247,0.9);
    }

    .carousel-arrow {
      font-size: 30px;
      cursor: pointer;
      user-select: none;
      padding: 6px 12px;
      color: #e5e7eb;
      transition: 0.2s;
    }

    .carousel-arrow:hover {
      color: #f97316;
      text-shadow: 0 0 14px rgba(249,115,22,0.9);
    }

    .dot-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4b5563;
      cursor: pointer;
      transition: 0.2s;
    }

    .dot.active {
      background: #f97316;
      box-shadow: 0 0 8px rgba(249,115,22,0.9);
    }

    /* ============================================
       FILE UPLOAD – CUSTOM STYLE (GTA Tag)
    ============================================ */
    .file-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .file-input {
      display: none;
    }

    .file-label {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #f97316;
      background: #020617;
      color: #f9fafb;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: 0.18s ease;
      box-shadow: 0 6px 14px rgba(0,0,0,0.85);
    }

    .file-label:hover {
      background: #111827;
      box-shadow: 0 0 16px rgba(249,115,22,0.9);
      transform: translateY(-1px);
    }

    .file-name {
      font-size: 11px;
      opacity: 0.8;
    }

    .btn-primary {
      border: none;
      margin-top: 4px;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #22c55e, #a855f7);
      color: #0f172a;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(8,47,73,0.95);
      transition: 0.18s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4ade80, #f97316);
      box-shadow: 0 0 18px rgba(45,212,191,0.9);
      transform: translateY(-1px);
    }

    /* ============================================
       XP LOG
    ============================================ */
    .xp-entry {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(148,163,184,0.4);
      font-size: 13px;
    }

    .xp-entry b {
      color: #facc15;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: -290px;
        bottom: 0;
        height: 100%;
        transition: left 0.3s ease;
      }

      body.menu-open .sidebar {
        left: 0;
      }

      .mobile-header {
        display: flex;
      }

      .main-area {
        padding: 72px 16px 20px 16px;
      }

      h1 {
        display: none;
      }

      .character-wrapper {
        flex-direction: column;
        align-items: center;
      }

      .carousel-wrapper {
        width: 100%;
      }
    }

  </style>
</head>

<body>

  <!-- MOBILE HEADER -->
  <div class="mobile-header">
    <div class="burger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="mobile-title">STREETS OF LOGIC</div>
    <button class="mobile-logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar">
        <img id="sidebarAvatar" src="" alt="" style="display:none;">
        <span id="sidebarInitials" style="display:none;">SL</span>
      </div>
      <div class="sidebar-title-wrap">
        <h2 class="sidebar-title">STREETS OF LOGIC</h2>
        <span class="sidebar-subtitle">XP EDITION</span>
      </div>
    </div>

    <div class="menu-item active" onclick="showSection(event,'status')">
      <div class="menu-icon">S</div>
      <span class="menu-label">Status</span>
    </div>
    <div class="menu-item" onclick="showSection(event,'charakter')">
      <div class="menu-icon">C</div>
      <span class="menu-label">Charakter</span>
    </div>
    <div class="menu-item" onclick="showSection(event,'missionen')">
      <div class="menu-icon">M</div>
      <span class="menu-label">Missionen</span>
    </div>
    <div class="menu-item" onclick="showSection(event,'belohnungen')">
      <div class="menu-icon">B</div>
      <span class="menu-label">Belohnungen</span>
    </div>
    <div class="menu-item" onclick="showSection(event,'xp')">
      <div class="menu-icon">XP</div>
      <span class="menu-label">XP-Historie</span>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- MAIN AREA -->
  <div class="main-area">
    <h1>STREETS OF LOGIC – XP EDITION</h1>

    <!-- STATUS -->
    <div id="status-section" class="card section">
      <h2>Status</h2>
      <div id="userCard"></div>
      <div id="levelBar" style="margin-top:10px;"></div>
    </div>

    <!-- CHARAKTER -->
    <div id="charakter-section" class="card section" style="display:none;">
      <h2>Charakter</h2>
      <div class="character-wrapper">
        <div class="char-img-wrapper">
          <div id="characterInfo"></div>
        </div>
        <div id="traitsItemsCard" class="char-traits"></div>
      </div>
    </div>

    <!-- MISSIONEN -->
    <div id="missionen-section" class="card section" style="display:none;">
      <h2>Missionen</h2>
      <div id="missionCarousel"></div>
    </div>

    <!-- BELOHNUNGEN -->
    <div id="belohnungen-section" class="card section" style="display:none;">
      <h2>Belohnungen</h2>
      <div id="rewardCarousel"></div>
    </div>

    <!-- XP LOG -->
    <div id="xp-section" class="card section" style="display:none;">
      <h2>XP-Historie</h2>
      <div id="xpLog"></div>
    </div>
  </div>

<script>
/* ============================================
   MENU + SECTIONS
============================================ */
function toggleMenu() {
  document.body.classList.toggle("menu-open");
}

function showSection(ev, name) {
  document.querySelectorAll(".section").forEach(s => s.style.display = "none");
  const section = document.getElementById(name + "-section");
  if (section) section.style.display = "block";

  document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
  if (ev && ev.target) {
    const item = ev.target.closest(".menu-item");
    if (item) item.classList.add("active");
  }

  if (window.innerWidth <= 900) {
    document.body.classList.remove("menu-open");
  }
}

/* ============================================
   LOGOUT
============================================ */
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

/* ============================================
   LOAD STUDENT DATA
============================================ */
let xpPerMission = {};

async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();

  const u = data.user;

  // STATUS
  document.getElementById("userCard").innerHTML = `
    <div style="font-size:14px;line-height:1.6;">
      <b>Name:</b> ${u.name}<br>
      <b>XP:</b> ${u.xp}<br>
      <b>Level:</b> ${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)
    </div>
  `;

  // SIDEBAR AVATAR
  const avatarImg = document.getElementById("sidebarAvatar");
  const avatarInitials = document.getElementById("sidebarInitials");

  if (data.character && data.character.image_url) {
    avatarImg.src = data.character.image_url;
    avatarImg.style.display = "block";
    avatarInitials.style.display = "none";
  } else {
    avatarImg.style.display = "none";
    avatarInitials.style.display = "block";
    avatarInitials.textContent = (u.name || "SL")
      .split(" ")
      .map(p => p[0])
      .join("")
      .toUpperCase()
      .slice(0, 2);
  }

  // CHARAKTER
  const charDiv = document.getElementById("characterInfo");
  if (data.character) {
    charDiv.innerHTML = `
      <img class="char-img" src="${data.character.image_url}" alt="Charakter">
      <div class="char-name">${data.character.name}</div>
    `;
  } else {
    charDiv.innerHTML = `
      <div style="width:220px;height:220px;border-radius:50%;
                  display:flex;align-items:center;justify-content:center;
                  background:radial-gradient(circle at 30% 20%,#0ea5e9,#4f46e5 60%,#020617 100%);
                  box-shadow:0 0 0 4px #020617,0 0 0 6px #a855f7,0 0 24px rgba(168,85,247,0.9);">
        <span style="font-family:'Bebas Neue',system-ui;letter-spacing:0.18em;font-size:18px;text-transform:uppercase;">
          Kein Charakter
        </span>
      </div>
    `;
  }

  // TRAITS + ITEMS
  document.getElementById("traitsItemsCard").innerHTML = `
    <b>Eigenschaften:</b><br>
    ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
    <b>Items:</b><br>
    ${data.items.map(i => "• " + i).join("<br>")}
  `;

  // XP PER MISSION (Objekt {mission_id: xpSum})
  xpPerMission = data.xp_per_mission || {};

  // XP LOG
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div class="xp-entry">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source}<br>
        <span style="opacity:0.7;">${d}</span>
      </div>
    `;
  });

  // LEVEL BAR
  renderLevelBar(data.levels || [], u.xp);
}

function renderLevelBar(levels, xp) {
  if (!levels || !levels.length) {
    document.getElementById("levelBar").innerHTML = "<i>Noch keine Level definiert.</i>";
    return;
  }

  let html = `<div class="level-step-container">`;

  for (let i = 0; i < levels.length; i++) {
    if (i > 0) html += `<div class="level-step-star">★</div>`;

    const min = levels[i].min_xp;
    const next = levels[i + 1]?.min_xp ?? (min || 1);
    let pct = 0;

    if (xp >= min) {
      if (next > min) {
        pct = Math.min(100, ((xp - min) / (next - min)) * 100);
      } else {
        pct = 100;
      }
    }

    html += `
      <div class="level-step">
        <div class="level-step-fill" style="width:${pct}%"></div>
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById("levelBar").innerHTML = html;
}

/* ============================================
   MISSIONS & REWARDS
============================================ */
async function loadMissions() {
  const r = await fetch("/api/student/missions");
  const missions = await r.json();
  renderCarousel("missionCarousel", missions, "mission");
}

async function loadRewards() {
  const r = await fetch("/api/student/rewards");
  const rewards = await r.json();
  renderCarousel("rewardCarousel", rewards, "reward");
}

/* ============================================
   GENERIC CAROUSEL
============================================ */
function renderCarousel(containerId, items, type) {
  const container = document.getElementById(containerId);

  if (!items || !items.length) {
    container.innerHTML = "<i>Keine Einträge vorhanden.</i>";
    return;
  }

  let slides = "";
  items.forEach((item, idx) => {
    slides += `
      <div class="carousel-item ${idx === 0 ? "active" : ""}">
        ${item.image_url ? `<img class="mission-img" src="${item.image_url}" alt="${item.name}">` : ""}
        <h3 style="margin:8px 0 2px 0;font-family:'Bebas Neue',system-ui;letter-spacing:0.14em;text-transform:uppercase;">
          ${item.name}
        </h3>
        <div style="font-size:13px;"><b>${item.xp} XP</b></div>
        ${type === "mission" ? `
          <div style="margin-top:4px;font-size:12px;">
            Bereits erhalten: <b>${xpPerMission[item.id] || 0} XP</b>
          </div>
        ` : ""}
        ${type === "mission" && item.require_upload ? `
          <div class="file-upload">
            <input type="file" id="upload_${item.id}" class="file-input" onchange="updateFileLabel(${item.id})">
            <label for="upload_${item.id}" class="file-label">Beweis hochladen</label>
            <span id="file-name-${item.id}" class="file-name">Keine Datei ausgewählt</span>
            <button class="btn-primary" onclick="uploadMission(${item.id})">Upload senden</button>
          </div>
        ` : ""}
        ${type === "reward" ? `
          <button class="btn-primary" onclick="redeemReward(${item.id})" style="margin-top:10px;">Belohnung einlösen</button>
        ` : ""}
      </div>
    `;
  });

  let dots = "";
  items.forEach((_, idx) => {
    dots += `<div class="dot ${idx === 0 ? "active" : ""}" onclick="jumpSlide('${containerId}', ${idx})"></div>`;
  });

  container.innerHTML = `
    <div class="carousel-wrapper">
      <span class="carousel-arrow" onclick="prevSlide('${containerId}')">&#10094;</span>
      ${slides}
      <span class="carousel-arrow" onclick="nextSlide('${containerId}')">&#10095;</span>
    </div>
    <div class="dot-container">${dots}</div>
  `;
}

/* ============================================
   CAROUSEL CONTROLS
============================================ */
function nextSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let index = items.findIndex(i => i.classList.contains("active"));
  items[index].classList.remove("active");
  index = (index + 1) % items.length;
  items[index].classList.add("active");
  updateDots(id, index);
}

function prevSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let index = items.findIndex(i => i.classList.contains("active"));
  items[index].classList.remove("active");
  index = (index - 1 + items.length) % items.length;
  items[index].classList.add("active");
  updateDots(id, index);
}

function jumpSlide(id, idx) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  items.forEach(i => i.classList.remove("active"));
  items[idx].classList.add("active");
  updateDots(id, idx);
}

function updateDots(id, idx) {
  const dots = [...document.querySelectorAll(`#${id} .dot`)];
  dots.forEach(d => d.classList.remove("active"));
  if (dots[idx]) dots[idx].classList.add("active");
}

/* ============================================
   FILE LABEL UPDATE
============================================ */
function updateFileLabel(missionId) {
  const input = document.getElementById(`upload_${missionId}`);
  const span = document.getElementById(`file-name-${missionId}`);
  if (!input || !span) return;
  span.textContent = input.files.length ? input.files[0].name : "Keine Datei ausgewählt";
}

/* ============================================
   UPLOAD MISSION
============================================ */
async function uploadMission(missionId) {
  const input = document.getElementById(`upload_${missionId}`);
  if (!input || !input.files.length) {
    alert("Bitte eine Datei auswählen.");
    return;
  }

  const form = new FormData();
  form.append("image", input.files[0]);
  form.append("missionId", missionId);

  const r = await fetch("/api/student/uploadForMission", {
    method: "POST",
    body: form
  });

  const data = await r.json();
  if (data.success) {
    alert("Upload erfolgreich!");
    loadMe();
  } else {
    alert("Upload fehlgeschlagen.");
  }
}

/* ============================================
   REWARD REDEEM
============================================ */
async function redeemReward(id) {
  const r = await fetch("/api/student/redeemReward", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ rewardId: id })
  });

  const data = await r.json();
  if (data.success) {
    alert("Belohnung eingelöst!");
    loadMe();
    loadRewards();
  } else {
    alert(data.message || "Nicht genug XP oder Fehler beim Einlösen.");
  }
}

/* ============================================
   INIT
============================================ */
loadMe();
loadMissions();
loadRewards();
</script>
