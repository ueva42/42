<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Temple of Logic – Schüler</title>
<style>
  body {
    margin: 0;
    background: #0b0b0f;
    color: #eee;
    font-family: Arial, sans-serif;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }

  h1, h2 {
    text-align: center;
    margin-bottom: 10px;
  }

  .section {
    background: #111;
    border: 1px solid #333;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 25px;
  }

  .char-box {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .char-box img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border: 2px solid #444;
    border-radius: 8px;
  }

  /* Level Bar */
  .level-bar {
    background: #333;
    border-radius: 8px;
    height: 28px;
    margin: 10px 0;
    overflow: hidden;
  }
  .level-fill {
    background: #009933;
    height: 100%;
    width: 0%;
    transition: width 0.4s;
  }

  .carousel {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 10px 0;
  }

  .card {
    background: #181818;
    border: 1px solid #333;
    min-width: 160px;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
  }
  .card img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 6px;
  }

  .bonus-btn {
    margin-top: 5px;
    padding: 6px 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: #444;
    color: white;
  }
  .bonus-btn:hover {
    background: #666;
  }

  input {
    padding: 6px;
    background: #222;
    border: 1px solid #444;
    color: #eee;
  }

  button {
    background: #009933;
    border: none;
    padding: 8px 14px;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 5px;
  }
  button:hover {
    background: #00bb44;
  }

  .logout {
    text-align: center;
    margin-top: 25px;
  }
</style>
</head>
<body>

<div class="container">

  <h1>Temple of Logic</h1>
  <h2>Schülerbereich</h2>

  <!-- Charakter -->
  <div class="section" id="characterSection">
    <h2>Dein Charakter</h2>
    <div id="characterContent"></div>
  </div>

  <!-- Level -->
  <div class="section">
    <h2>Level</h2>
    <div id="levelInfo"></div>
    <div class="level-bar">
      <div class="level-fill" id="levelFill"></div>
    </div>
  </div>

  <!-- Missionen -->
  <div class="section">
    <h2>Missionen</h2>
    <div class="carousel" id="missionCarousel"></div>
  </div>

  <!-- Bonuskarten -->
  <div class="section">
    <h2>Bonuskarten</h2>
    <div class="carousel" id="bonusCarousel"></div>
  </div>

  <!-- Upload -->
  <div class="section">
    <h2>Bild hochladen</h2>
    <input type="file" id="uploadFile" />
    <button onclick="uploadImage()">Hochladen</button>
    <p id="uploadMsg"></p>
  </div>

  <div class="logout">
    <button onclick="logout()">Logout</button>
  </div>

</div><!-- container -->

<script>
// ----------------------------------------------------------
// RANDOM SETUP (Traits + Items)
// ----------------------------------------------------------

const TRAITS = [
  "Neugierig","Ausdauernd","Kreativ","Hilfsbereit","Strukturiert",
  "Risikofreudig","Ruhig","Zielstrebig","Analytisch","Teamorientiert",
  "Selbstkritisch","Optimistisch","Aufmerksam","Pragmatisch","Mutig",
  "Sorgfältig","Logisch denkend","Erfinderisch","Geduldig","Inspirierend"
];

const ITEMS = [
  "Zirkel der Präzision","Rechenamulett","Logikstein","Notizrolle der Klarheit",
  "Schutzbrille der Konzentration","Zauberstift des Beweises","Kompass der Richtung",
  "Rucksack der Ideen","Lineal des Gleichgewichts","Lampe des Einfalls",
  "Formelbuch des Wissens","Tasche der Zufälle","Würfel der Wahrscheinlichkeit",
  "Chronometer der Geduld","Mantel der Logik","Rechenbrett des Ausgleichs",
  "Trank der Übersicht","Kristall des Beweises","Talisman der Motivation",
  "Zauberstab des Verständnisses"
];

function pickThree(arr) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 3);
}

// ----------------------------------------------------------
// LOAD STUDENT STATE
// ----------------------------------------------------------

let studentXP = 0;
let levels = [];

async function init() {
  const stateRes = await fetch("/api/student/state");
  const data = await stateRes.json();

  const missions = await (await fetch("/api/student/missions")).json();
  const bonus = await (await fetch("/api/student/bonus")).json();
  levels = await (await fetch("/api/student/levels")).json();

  // Missions anzeigen
  renderMissions(missions);

  // Bonuskarten anzeigen
  renderBonuscards(bonus);

  if (!data.exists) {
    // Noch kein Charakter → neuen erzeugen
    await initNewCharacter();
  } else {
    renderCharacter(data);
  }

  updateLevelBar();
}

async function initNewCharacter() {
  const chars = await (await fetch("/api/student/characters")).json();

  if (chars.length === 0) {
    document.getElementById("characterContent").innerHTML =
      "<p>Keine Charaktere vorhanden.</p>";
    return;
  }

  const char = chars[Math.floor(Math.random() * chars.length)];

  const traits = pickThree(TRAITS);
  const items = pickThree(ITEMS);

  // speichern
  await fetch("/api/student/state/init", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      characterId: char.id,
      traits,
      items
    })
  });

  const updated = await (await fetch("/api/student/state")).json();
  renderCharacter(updated);
}

function renderCharacter(data) {
  const c = data.state;
  studentXP = data.user.xp;

  document.getElementById("characterContent").innerHTML = `
    <div class="char-box">
      <img src="${c.character_image_url}" />
      <div>
        <h3>${c.character_name}</h3>
        <p><b>Eigenschaften:</b><br>${c.traits.join(", ")}</p>
        <p><b>Ausrüstung:</b><br>${c.items.join(", ")}</p>
        <p><b>XP:</b> ${studentXP}</p>
      </div>
    </div>
  `;
}

// ----------------------------------------------------------
// LEVEL SYSTEM
// ----------------------------------------------------------
function updateLevelBar() {
  const xp = studentXP;

  let currentLevel = levels[0];
  let nextLevel = null;

  for (let i = 0; i < levels.length; i++) {
    if (xp >= levels[i].required_xp) {
      currentLevel = levels[i];
      nextLevel = levels[i+1] || null;
    }
  }

  // Levelinfo
  let text = `Level: ${currentLevel.name}`;
  if (nextLevel) {
    const need = nextLevel.required_xp - xp;
    text += ` – ${need} XP bis Level ${nextLevel.name}`;
  } else {
    text += " – Höchstes Level erreicht";
  }
  document.getElementById("levelInfo").innerText = text;

  // Balken
  let fill = 100;
  if (nextLevel) {
    const dist = nextLevel.required_xp - currentLevel.required_xp;
    const prog = xp - currentLevel.required_xp;
    fill = Math.max(0, Math.min(100, (prog / dist) * 100));
  }
  document.getElementById("levelFill").style.width = fill + "%";
}

// ----------------------------------------------------------
// MISSIONEN
// ----------------------------------------------------------
function renderMissions(missions) {
  const box = document.getElementById("missionCarousel");
  box.innerHTML = "";

  missions.forEach(m => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      ${m.image_url ? `<img src="${m.image_url}">` : ""}
      <b>${m.name}</b><br>
      ${m.xp} XP<br>
      ${m.require_upload ? "<i>Upload nötig</i>" : ""}
    `;
    box.appendChild(div);
  });
}

// ----------------------------------------------------------
// BONUSKARTEN
// ----------------------------------------------------------
function renderBonuscards(list) {
  const box = document.getElementById("bonusCarousel");
  box.innerHTML = "";

  list.forEach(b => {
    const unlocked = studentXP >= b.xp;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      ${b.image_url ? `<img src="${b.image_url}">` : ""}
      <b>${b.name}</b><br>
      <small>${b.xp} XP nötig</small><br>
      ${unlocked ? `<button class="bonus-btn" onclick="redeemBonus(${b.id}, ${b.xp})">Einlösen</button>` : `<i>Gesperrt</i>`}
    `;
    box.appendChild(div);
  });
}

async function redeemBonus(id, cost) {
  // XP abziehen → aber Level bleibt erhalten (Server-Logik: direct XP)
  await fetch("/api/xp", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ studentId: null, xp: -cost }) // server ignoriert studentId für Schüler
  });

  // Reload state
  const st = await (await fetch("/api/student/state")).json();
  studentXP = st.user.xp;
  updateLevelBar();

  const bonus = await (await fetch("/api/student/bonus")).json();
  renderBonuscards(bonus);
}

// ----------------------------------------------------------
// UPLOAD
// ----------------------------------------------------------
async function uploadImage() {
  const file = document.getElementById("uploadFile").files[0];
  if (!file) {
    document.getElementById("uploadMsg").innerText = "Bitte eine Datei auswählen.";
    return;
  }

  const form = new FormData();
  form.append("image", file);

  const r = await fetch("/api/student/upload", {
    method: "POST",
    body: form
  });

  const data = await r.json();
  if (data.success) {
    document.getElementById("uploadMsg").innerText = "Bild hochgeladen!";
  } else {
    document.getElementById("uploadMsg").innerText = "Fehler beim Upload.";
  }
}

// ----------------------------------------------------------
// LOGOUT
// ----------------------------------------------------------
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

init();
</script>

</body>
</html>
