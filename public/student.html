<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>Streets of Logic – Student</title>

  <!-- GTA Comic Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>
    /* ========================================================
       GLOBAL – GTA Neon Comic Style
    ======================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: Arial, sans-serif;
      color: #f8fafc;
    }

    /* ========================================================
       SWIPER CONTAINER
    ======================================================== */
    .swiper-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      transition: transform 0.35s ease;
    }

    .slide {
      min-width: 100vw;
      height: 100vh;
      padding: 40px;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background:
        linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.94)),
        url("https://images.unsplash.com/photo-1508097332050-4ffcbf3a7a82?auto=format&fit=crop&w=1600&q=80")
        center/cover no-repeat;
    }

    /* ========================================================
       HEADERS
    ======================================================== */
    h1 {
      font-family: "Bangers";
      font-size: 34px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      color: #fefce8;
      text-shadow:
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        3px 3px 0 #000,
        0 0 20px rgba(255, 203, 55, 0.95);
    }

    h2 {
      font-family: "Bebas Neue";
      font-size: 26px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 4px;
      margin-bottom: 14px;
    }

    /* ========================================================
       NAV DOTS (Swipe Navigation)
    ======================================================== */
    .nav-dots {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }

    .nav-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4b5563;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
    }

    .nav-dot.active {
      background: #f97316;
      box-shadow: 0 0 8px rgba(249,115,22,0.9);
    }

    /* ========================================================
       CARDS
    ======================================================== */
    .card {
      background: rgba(15,23,42,0.88);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left,
          rgba(251,191,36,0.18),
          transparent 60%);
      pointer-events: none;
    }

    /* ========================================================
       CHARACTER
    ======================================================== */
    .char-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px auto;
      box-shadow:
        0 0 0 4px #020617,
        0 0 0 6px #f97316,
        0 0 20px rgba(249,115,22,0.9);
    }

    .char-name {
      text-align: center;
      font-family: "Bebas Neue";
      font-size: 22px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ========================================================
       LEVEL BAR
    ======================================================== */
    .level-bar-container {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .level-step {
      width: 60px;
      height: 10px;
      border-radius: 999px;
      background: #0f172a;
      border: 1px solid #475569;
      overflow: hidden;
    }

    .level-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ========================================================
       CAROUSEL
    ======================================================== */
    .carousel-item {
      text-align: center;
      display: none;
    }

    .carousel-item.active {
      display: block;
    }

    .carousel-img {
      width: 230px;
      height: 230px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow:
        0 0 0 4px #020617,
        0 0 0 6px #a855f7,
        0 0 22px rgba(168,85,247,0.9);
    }

    .carousel-arrow {
      cursor: pointer;
      font-size: 30px;
      user-select: none;
      color: #e5e7eb;
      transition: 0.2s;
    }

    .carousel-arrow:hover {
      color: #f97316;
      text-shadow: 0 0 12px rgba(249,115,22,0.9);
    }

    .dot-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4b5563;
      cursor: pointer;
    }

    .dot.active {
      background: #f97316;
      box-shadow: 0 0 8px rgba(249,115,22,0.9);
    }

    /* ========================================================
       BUTTONS
    ======================================================== */
    .btn {
      margin-top: 10px;
      padding: 10px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #22c55e, #f97316);
      border: none;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.85);
      transition: 0.18s;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    /* ========================================================
       FILE UPLOAD
    ======================================================== */
    .file-label {
      padding: 8px 16px;
      border-radius: 999px;
      background: #111827;
      border: 1px solid #f97316;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      box-shadow: 0 4px 14px rgba(0,0,0,0.8);
    }

    .file-name {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .hidden {
      display: none;
    }

    /* ========================================================
       MOBILE
    ======================================================== */
    @media (max-width: 900px) {
      .slide {
        padding: 20px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- DOT NAVIGATION -->
  <div class="nav-dots">
    <div class="nav-dot active" onclick="goToSlide(0)"></div>
    <div class="nav-dot" onclick="goToSlide(1)"></div>
    <div class="nav-dot" onclick="goToSlide(2)"></div>
    <div class="nav-dot" onclick="goToSlide(3)"></div>
    <div class="nav-dot" onclick="goToSlide(4)"></div>
  </div>

  <!-- SWIPER -->
  <div id="swiper" class="swiper-container">

    <!-- SLIDE 1: STATUS -->
    <div class="slide">
      <h1>Status</h1>
      <div class="card">
        <div id="userCard"></div>
        <div id="levelBar" class="level-bar-container"></div>
      </div>
    </div>

    <!-- SLIDE 2: CHARAKTER -->
    <div class="slide">
      <h1>Charakter</h1>
      <div class="card">
        <div id="characterSection"></div>
        <div id="traitsItems"></div>
      </div>
    </div>

    <!-- SLIDE 3: MISSIONEN -->
    <div class="slide">
      <h1>Missionen</h1>
      <div id="missionCarousel"></div>
    </div>

    <!-- SLIDE 4: BELOHNUNGEN -->
    <div class="slide">
      <h1>Belohnungen</h1>
      <div id="rewardCarousel"></div>
    </div>

    <!-- SLIDE 5: XP-LOG -->
    <div class="slide">
      <h1>XP Historie</h1>
      <div class="card">
        <div id="xpLog"></div>
      </div>
    </div>

  </div>

  <script>
    /* ============================================================
       SWIPER NAVIGATION
    ============================================================ */
    let currentSlide = 0;

    function goToSlide(i) {
      currentSlide = i;
      document.getElementById("swiper").style.transform = `translateX(-${i * 100}vw)`;

      document.querySelectorAll(".nav-dot").forEach((d, idx) => {
        d.classList.toggle("active", idx === i);
      });
    }

    /* ============================================================
       LOGOUT
    ============================================================ */
    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      location.href = "/login.html";
    }

    /* ============================================================
       LOAD STUDENT DATA
    ============================================================ */
    let xpPerMission = {};

    async function loadMe() {
      const r = await fetch("/api/student/me");
      const data = await r.json();

      const u = data.user;

      // STATUS CARD
      document.getElementById("userCard").innerHTML = `
        <div style="font-size:16px;line-height:1.6;">
          <b>Name:</b> ${u.name}<br>
          <b>XP:</b> ${u.xp}<br>
          <b>Level:</b> ${u.level_name || "-"}<br>
        </div>
      `;

      // LEVEL BAR
      renderLevelBar(data.levels, u.xp);

      // CHARACTER
      if (data.character) {
        document.getElementById("characterSection").innerHTML = `
          <img src="${data.character.image_url}" class="char-img">
          <div class="char-name">${data.character.name}</div>
        `;
      }

      // TRAITS + ITEMS
      document.getElementById("traitsItems").innerHTML = `
        <b>Eigenschaften:</b><br>
        ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
        <b>Items:</b><br>
        ${data.items.map(i => "• " + i).join("<br>")}
      `;

      // XP LOG
      const xpDiv = document.getElementById("xpLog");
      data.xp_log.forEach(entry => {
        const d = new Date(entry.created_at).toLocaleString("de-DE");
        xpDiv.innerHTML += `
          <div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1);">
            <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source}<br>
            <span style="opacity:0.6;">${d}</span>
          </div>
        `;
      });

      xpPerMission = data.xp_per_mission || {};
    }

    function renderLevelBar(levels, xp) {
      let html = "";

      for (let i = 0; i < levels.length; i++) {
        const min = levels[i].min_xp;
        const next = levels[i + 1]?.min_xp ?? (min || 1);
        let pct = 0;

        if (xp >= min) {
          pct = Math.min(100, ((xp - min) / (next - min)) * 100);
        }

        html += `
          <div class="level-step">
            <div class="level-fill" style="width:${pct}%"></div>
          </div>
        `;
      }

      document.getElementById("levelBar").innerHTML = html;
    }

    /* ============================================================
       CAROUSELS (MISSION + REWARD)
    ============================================================ */
    function renderCarousel(containerId, items, type) {
      const container = document.getElementById(containerId);

      if (!items.length) {
        container.innerHTML = "<i>Keine Einträge vorhanden.</i>";
        return;
      }

      let idx = 0;

      function update() {
        container.innerHTML = `
          <div class="card" style="text-align:center;">
            <div class="carousel-item active">
              ${items[idx].image_url
                ? `<img src="${items[idx].image_url}" class="carousel-img"/>`
                : ""}
              <h2>${items[idx].name}</h2>
              <div><b>${items[idx].xp} XP</b></div>
              ${type === "mission" && items[idx].require_upload
                ? renderUpload(items[idx].id)
                : ""}
              ${type === "reward"
                ? `<button class="btn" onclick="redeemReward(${items[idx].id})">Einlösen</button>`
                : ""}
            </div>

            <div style="margin-top:10px;">
              <span class="carousel-arrow" onclick="prev()">&#10094;</span>
              <span class="carousel-arrow" onclick="next()">&#10095;</span>
            </div>
          </div>

          <div class="dot-container">
            ${items.map((_, i) =>
              `<div class="dot ${i === idx ? "active" : ""}" onclick="jump(${i})"></div>`
            ).join("")}
          </div>
        `;
      }

      function next() { idx = (idx + 1) % items.length; update(); }
      function prev() { idx = (idx - 1 + items.length) % items.length; update(); }
      function jump(i) { idx = i; update(); }

      window[containerId + "_next"] = next;
      window[containerId + "_prev"] = prev;
      window[containerId + "_jump"] = jump;

      update();
    }

    function renderUpload(id) {
      return `
        <div style="margin-top:10px;">
          <input type="file" id="upload_${id}" class="hidden" onchange="updateFileName(${id})">
          <label for="upload_${id}" class="file-label">Beweis hochladen</label>
          <div id="file-name-${id}" class="file-name">Keine Datei ausgewählt</div>
          <button class="btn" onclick="uploadMission(${id})">Senden</button>
        </div>
      `;
    }

    function updateFileName(id) {
      const input = document.getElementById(`upload_${id}`);
      const label = document.getElementById(`file-name-${id}`);
      label.textContent = input.files.length ? input.files[0].name : "Keine Datei ausgewählt";
    }

    async function uploadMission(id) {
      const input = document.getElementById(`upload_${id}`);
      if (!input.files.length) return alert("Bitte Datei auswählen");

      const form = new FormData();
      form.append("image", input.files[0]);
      form.append("missionId", id);

      const r = await fetch("/api/student/uploadForMission", {
        method: "POST",
        body: form
      });

      const d = await r.json();
      if (d.success) {
        alert("Upload erfolgreich!");
        loadMe();
      } else {
        alert("Fehler beim Upload");
      }
    }

    async function redeemReward(id) {
      const r = await fetch("/api/student/redeemReward", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rewardId: id })
      });

      const d = await r.json();
      if (!d.success) return alert(d.message || "Fehler");
      alert("Belohnung eingelöst!");
      loadMe();
      loadRewards();
    }

    async function loadMissions() {
      const r = await fetch("/api/student/missions");
      const missions = await r.json();
      renderCarousel("missionCarousel", missions, "mission");
    }

    async function loadRewards() {
      const r = await fetch("/api/student/rewards");
      const rewards = await r.json();
      renderCarousel("rewardCarousel", rewards, "reward");
    }

    /* INITIAL LOAD */
    loadMe();
    loadMissions();
    loadRewards();
  </script>
</body>
</html>
