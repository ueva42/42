<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Student</title>
  <style>
    body {
      background:#111; 
      color:#fff; 
      font-family:Arial; 
      padding:20px;
    }
    h1, h2, h3 { margin-top:30px; }
    .mission-box {
      border:1px solid #444;
      padding:15px;
      margin-top:20px;
    }
    button {
      padding:6px 12px;
      background:#116611;
      color:#fff;
      border:none;
      cursor:pointer;
      margin-top:10px;
    }
    button.red { background:#661111; }
    img.mission-img {
      width:120px;
      height:120px;
      object-fit:cover;
      border:1px solid #555;
      margin-right:15px;
    }
    img.thumb {
      width:80px;
      height:80px;
      object-fit:cover;
      border:1px solid #333;
      margin-right:10px;
    }
    .row { margin-top:10px; }
  </style>
</head>
<body>

<h1>Mein Abenteuer</h1>
<button onclick="logout()">Logout</button>

<h2>Mein Fortschritt</h2>
<div id="xpStatus">XP laden…</div>

<h2>Missionen</h2>
<div id="missionContainer"></div>

<h2>Meine Uploads</h2>
<div id="myUploads"></div>


<script>
// =========================================================
// Hilfsfunktionen
// =========================================================

async function api(url, method="GET", data=null) {
  let opt = { method, headers:{} };
  if(data){
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(data);
  }
  const res = await fetch(url, opt);
  return res.json();
}

function $(id){ return document.getElementById(id); }


// =========================================================
// LOGOUT
// =========================================================

async function logout(){
  await api("/api/logout","POST");
  window.location.href = "/login.html";
}


// =========================================================
// MEINE XP LADEN
// =========================================================

async function loadXP(){
  const r = await api("/api/me");
  if(!r.success){
    window.location.href = "/login.html";
    return;
  }

  $("xpStatus").innerHTML =
    `<b>${r.name}</b><br>
     XP: <b>${r.xp}</b><br>
     Höchste XP: <b>${r.highest_xp}</b>`;
}


// =========================================================
// MISSIONEN LADEN
// =========================================================

async function loadMissions(){
  const list = await api("/api/missions");
  const box = $("missionContainer");
  box.innerHTML = "";

  list.forEach(m => {

    box.innerHTML += `
      <div class="mission-box">
        
        <div style="display:flex; align-items:center;">
          <img src="${m.image_url}" class="mission-img">
          <div>
            <h3>${m.name}</h3>
            <div>${m.xp} XP</div>
            <div>Upload erforderlich: <b>${m.require_upload ? "Ja" : "Nein"}</b></div>
          </div>
        </div>

        ${m.require_upload ? `
          <div class="row">
            <input type="file" id="file_${m.id}">
            <button onclick="uploadMission(${m.id})">Upload senden</button>
          </div>
        ` : `
          <div style="margin-top:10px; color:#bbb;">Keine Abgabe nötig</div>
        `}
      </div>
    `;
  });
}


// =========================================================
// MISSION-UPLOAD ABSCHICKEN
// =========================================================

async function uploadMission(missionId){
  const fileInput = $("file_"+missionId);
  const file = fileInput.files[0];

  if(!file) return alert("Bitte Datei auswählen.");

  const fd = new FormData();
  fd.append("image", file);
  fd.append("missionId", missionId);

  const res = await fetch("/api/student/upload", {
    method: "POST",
    body: fd
  });

  const json = await res.json();
  if(!json.success){
    alert("Upload fehlgeschlagen.");
    return;
  }

  alert("Upload gespeichert.");
  loadMyUploads();
}


// =========================================================
// MEINE UPLOADS LADEN
// =========================================================

async function loadMyUploads(){
  const list = await api("/api/student/uploads");
  const box = $("myUploads");
  box.innerHTML = "";

  if(list.length === 0){
    box.innerHTML = "<i>Keine Uploads vorhanden</i>";
    return;
  }

  list.forEach(u => {
    box.innerHTML += `
      <div style="margin-bottom:15px;">
        <img src="${u.image_url}" class="thumb">
        <b>${u.mission_name}</b><br>
        <span style="color:#aaa;">${u.created_at}</span>
      </div>
    `;
  });
}


// =========================================================
// INIT
// =========================================================

loadXP();
loadMissions();
loadMyUploads();

</script>

</body>
</html>
