<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Streets of Logic – Schüler</title>

<style>
/* ======================================================
   GLOBAL VICE-CITY-NEON GTA COMIC STYLE
====================================================== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background:
    linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.85)),
    url("https://images.unsplash.com/photo-1520697830682-d71a7a6a67cf?auto=format&fit=crop&w=1600&q=80")
    center/cover fixed no-repeat;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow: hidden;
}

/* ======================================================
   SIDEBAR – VICE CITY NEON
====================================================== */
.sidebar {
  width: 260px;
  height: 100vh;
  background: rgba(10,0,25,0.92);
  border-right: 3px solid #ff2ec6;
  box-shadow:
    0 0 20px #ff2ec6,
    0 0 40px rgba(0,255,255,0.6);
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  box-sizing: border-box;
  position: relative;
}

.sidebar-title {
  font-family: Impact, sans-serif;
  font-size: 22px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: #f4f0ff;
  text-shadow:
    0 0 10px #ff2ec6,
    0 0 20px #00eaff,
    3px 3px #000;
  text-align: center;
  margin-bottom: 25px;
}

.menu-item {
  padding: 12px 15px;
  margin: 8px 0;
  border-radius: 14px;
  cursor: pointer;
  border: 2px solid #00eaff;
  box-shadow:
    0 0 10px #00eaff,
    0 0 20px rgba(255,46,198,0.5);
  background: rgba(0,0,30,0.6);
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: 0.2s;
}

.menu-item:hover,
.menu-item.active {
  background: linear-gradient(135deg, #ff2ec6, #00eaff);
  color: #1b0033;
  box-shadow:
    0 0 20px #ff2ec6,
    0 0 40px #00eaff;
  transform: translateX(5px) scale(1.02);
}

.logout-btn {
  margin-top: auto;
  padding: 12px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #00eaff, #ff2ec6);
  box-shadow:
    0 0 15px #00eaff,
    0 0 35px #ff2ec6;
  color: #1b0033;
  transition: 0.2s;
}

.logout-btn:hover {
  transform: scale(1.05);
}

/* ======================================================
   MOBILE HEADER
====================================================== */
.mobile-header {
  display: none;
  position: fixed;
  top: 0;
  height: 60px;
  left: 0; right: 0;
  background: rgba(10,0,25,0.92);
  border-bottom: 3px solid #ff2ec6;
  box-shadow: 0 0 20px #ff2ec6;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 50;
}

.burger {
  width: 28px;
  height: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}

.burger span {
  width: 100%;
  height: 3px;
  background: #fff;
  border-radius: 999px;
}

/* ======================================================
   MAIN CONTENT
====================================================== */
.main-area {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  padding: 25px 40px;
}

/* GTA NEON TITLE */
h1 {
  font-family: Impact, sans-serif;
  font-size: 32px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #f4f0ff;
  text-shadow:
    0 0 10px #ff2ec6,
    0 0 20px #00eaff,
    3px 3px #000;
}

/* CARD */
.card {
  background: rgba(0,0,20,0.75);
  border: 3px solid #00eaff;
  border-radius: 20px;
  margin-bottom: 30px;
  padding: 20px;
  box-shadow:
    0 0 20px #00eaff,
    0 0 40px #ff2ec6;
}

/* ======================================================
   CHARACTER IMAGE
====================================================== */
.char-img {
  width: 240px;
  height: 400px;
  border-radius: 16px;
  object-fit: cover;
  box-shadow:
    0 0 20px #ff2ec6,
    0 0 40px #00eaff;
  border: 3px solid #fff;
}

/* ======================================================
   CHARACTER SELECTION MODAL
====================================================== */
#characterSelectModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 999;
  padding-top: 50px;
  overflow-y: auto;
}

.character-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 25px;
  padding: 20px;
}

.character-choice {
  background: rgba(0,0,30,0.8);
  border: 3px solid #ff2ec6;
  border-radius: 16px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  box-shadow:
    0 0 15px #ff2ec6,
    0 0 30px #00eaff;
  transition: 0.2s;
}

.character-choice:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #ff2ec6, #00eaff);
}

.character-choice img {
  width: 180px;
  height: 280px;
  border-radius: 12px;
  object-fit: cover;
  border: 2px solid #fff;
}

/* ======================================================
   LEVEL BAR (Vice City Neon)
====================================================== */
.level-step-container {
  display: flex;
  align-items: center;
  gap: 8px;
}

.level-step {
  width: 65px;
  height: 12px;
  border-radius: 6px;
  background: #111;
  border: 2px solid #ff2ec6;
  overflow: hidden;
}

.level-step-fill {
  height: 100%;
  background: linear-gradient(90deg, #00eaff, #ff2ec6);
  width: 0%;
  box-shadow: 0 0 12px #00eaff;
}

.level-step-star {
  font-size: 24px;
  color: gold;
  text-shadow:
    0 0 10px gold,
    0 0 30px orange;
}

/* ======================================================
   CAROUSEL – Vice City Look
====================================================== */
.carousel-wrapper {
  position: relative;
  text-align: center;
}

.carousel-item {
  display: none;
}

.carousel-item.active {
  display: block;
}

.mission-img {
  width: 240px;
  height: 400px;
  object-fit: cover;
  border-radius: 16px;
  border: 3px solid #fff;
  box-shadow:
    0 0 25px #00eaff,
    0 0 45px #ff2ec6;
}

.carousel-arrow {
  font-size: 42px;
  cursor: pointer;
  padding: 8px 12px;
  color: #00eaff;
  text-shadow:
    0 0 10px #ff2ec6,
    0 0 30px #00eaff;
  transition: 0.2s;
}

.carousel-arrow:hover {
  color: #ff2ec6;
  transform: scale(1.2);
}

.dot-container {
  display: flex;
  justify-content: center;
  margin-top: 10px;
  gap: 8px;
}

.dot {
  width: 12px;
  height: 12px;
  background: #00eaff;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 10px #00eaff;
}

.dot.active {
  background: #ff2ec6;
  box-shadow: 0 0 15px #ff2ec6;
}

/* ======================================================
   FILE UPLOAD BUTTONS – Vice City Style
====================================================== */
.file-label {
  padding: 10px 16px;
  border-radius: 12px;
  border: 2px solid #00eaff;
  background: rgba(0,0,30,0.8);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: 0.2s;
}

.file-label:hover {
  background: linear-gradient(135deg, #ff2ec6, #00eaff);
  transform: scale(1.05);
}

.btn-primary {
  padding: 10px 16px;
  border-radius: 12px;
  border: none;
  margin-top: 8px;
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #ff2ec6, #00eaff);
  box-shadow:
    0 0 15px #00eaff,
    0 0 30px #ff2ec6;
  cursor: pointer;
  transition: 0.2s;
}

.btn-primary:hover {
  transform: scale(1.05);
}

/* ======================================================
   RESPONSIVE
====================================================== */
@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    transition: 0.3s;
  }
  body.menu-open .sidebar {
    left: 0;
  }
  .mobile-header {
    display: flex;
  }
  .main-area {
    padding: 80px 15px;
  }
  h1 {
    text-align: center;
    font-size: 26px;
  }
}
</style>
</head>

<body>

<!-- MOBILE HEADER -->
<div class="mobile-header">
  <div class="burger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
  <div style="font-size:18px;font-weight:bold;">Streets of Logic</div>
  <button class="logout-btn" style="padding:6px 10px;font-size:12px;" onclick="logout()">Logout</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-title">Streets of Logic</div>

  <div class="menu-item active" onclick="showSection(event,'status')">Status</div>
  <div class="menu-item" onclick="showSection(event,'charakter')">Charakter</div>
  <div class="menu-item" onclick="showSection(event,'missionen')">Missionen</div>
  <div class="menu-item" onclick="showSection(event,'belohnungen')">Belohnungen</div>
  <div class="menu-item" onclick="showSection(event,'xp')">XP Log</div>

  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- MAIN CONTENT -->
<div class="main-area">
  <h1>Streets of Logic</h1>

  <!-- STATUS -->
  <div id="status-section" class="card section">
    <h2>Status</h2>
    <div id="userCard"></div>
    <div id="levelBar" style="margin-top:15px;"></div>
  </div>

  <!-- CHARAKTER -->
  <div id="charakter-section" class="card section" style="display:none;">
    <h2>Charakter</h2>
    <div id="characterInfo"></div>
    <div id="traitsItemsCard" style="margin-top:15px;"></div>
  </div>

  <!-- MISSIONEN -->
  <div id="missionen-section" class="card section" style="display:none;">
    <h2>Missionen</h2>
    <div id="missionCarousel"></div>
  </div>

  <!-- BELOHNUNGEN -->
  <div id="belohnungen-section" class="card section" style="display:none;">
    <h2>Belohnungen</h2>
    <div id="rewardCarousel"></div>
  </div>

  <!-- XP LOG -->
  <div id="xp-section" class="card section" style="display:none;">
    <h2>XP</h2>
    <div id="xpLog"></div>
  </div>
</div>

<!-- CHARACTER SELECTION MODAL -->
<div id="characterSelectModal">
  <h1 style="text-align:center;margin-bottom:20px;">Wähle deinen Charakter</h1>
  <div id="characterSelectGrid" class="character-grid"></div>
</div>

<script>
/* ==============================================
   MENU
============================================== */
function toggleMenu() {
  document.body.classList.toggle("menu-open");
}

function showSection(e,name) {
  document.querySelectorAll(".section").forEach(s => s.style.display="none");
  document.getElementById(name+"-section").style.display = "block";

  document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
  if (e) e.target.classList.add("active");

  if (window.innerWidth <= 900) document.body.classList.remove("menu-open");
}

/* ==============================================
   LOGOUT
============================================== */
async function logout() {
  await fetch("/api/logout", { method:"POST" });
  location.href = "/login.html";
}

/* ==============================================
   LOAD DATA
============================================== */
let xpPerMission = {};

async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();
  const u = data.user;

  /* ========== CHARACTER SELECTION ON FIRST LOGIN ========== */
  if (!u.character_id) {
    showCharacterSelection(data.characters);
    return;
  }

  /* ========== STATUS ========== */
  document.getElementById("userCard").innerHTML = `
    <b>Name:</b> ${u.name}<br>
    <b>XP:</b> ${u.xp}<br>
    <b>Level:</b> ${u.level_name}
  `;

  /* ========== CHARACTER ========== */
  if (data.character) {
    document.getElementById("characterInfo").innerHTML = `
      <img src="${data.character.image_url}" class="char-img">
      <div style="margin-top:10px;font-size:20px;font-weight:bold;">${data.character.name}</div>
    `;
  } else {
    document.getElementById("characterInfo").innerHTML = "Kein Charakter.";
  }

  /* ========== TRAITS / ITEMS ========== */
  document.getElementById("traitsItemsCard").innerHTML = `
    <div style="font-size:18px;margin-bottom:10px;"><b>Eigenschaften</b></div>
    ${data.traits.map(t => "• "+t).join("<br>")}
    <br><br>
    <div style="font-size:18px;margin-bottom:10px;"><b>Items</b></div>
    ${data.items.map(i => "• "+i).join("<br>")}
  `;

  xpPerMission = data.xp_per_mission || {};

  /* ========== XP LOG ========== */
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = data.xp_log.map(e => {
    const d = new Date(e.created_at).toLocaleString("de-DE");
    return `
      <div style="padding:10px;font-size:14px;border-bottom:1px solid #ff2ec6;">
        <b>${e.amount} XP</b> – ${e.mission_name || e.source}<br>
        <span style="opacity:0.8">${d}</span>
      </div>
    `;
  }).join("");

  renderLevelBar(data.levels, u.xp);
}

/* ==============================================
   CHARACTER FIRST LOGIN SELECTION
============================================== */
function showCharacterSelection(characters) {
  const modal = document.getElementById("characterSelectModal");
  modal.style.display = "block";

  const grid = document.getElementById("characterSelectGrid");
  grid.innerHTML = characters.map(c => `
    <div class="character-choice" onclick="selectCharacter(${c.id})">
      <img src="${c.image_url}">
      <div style="margin-top:8px;font-weight:bold;">${c.name}</div>
    </div>
  `).join("");
}

async function selectCharacter(id) {
  await fetch("/api/student/selectCharacter", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ characterId:id })
  });

  document.getElementById("characterSelectModal").style.display = "none";
  loadMe();
}

/* ==============================================
   LEVEL BAR
============================================== */
function renderLevelBar(levels, xp) {
  let html = `<div class="level-step-container">`;

  for (let i = 0; i < levels.length; i++) {
    if (i > 0) html += `<div class="level-step-star">★</div>`;

    const min = levels[i].min_xp;
    const next = levels[i+1]?.min_xp || (min+1);
    const pct = xp >= min ? Math.min(100, ((xp-min)/(next-min))*100) : 0;

    html += `
      <div class="level-step">
        <div class="level-step-fill" style="width:${pct}%"></div>
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById("levelBar").innerHTML = html;
}

/* ==============================================
   MISSIONS + REWARDS CAROUSEL
============================================== */
async function loadMissions() {
  const r = await fetch("/api/student/missions");
  const data = await r.json();
  renderCarousel("missionCarousel", data, "mission");
}
async function loadRewards() {
  const r = await fetch("/api/student/rewards");
  const data = await r.json();
  renderCarousel("rewardCarousel", data, "reward");
}

function renderCarousel(containerId, items, type) {
  const container = document.getElementById(containerId);

  if (!items || !items.length) {
    container.innerHTML = "<i>Keine Einträge.</i>";
    return;
  }

  let slides = "";
  let dots = "";

  items.forEach((item, idx) => {
    slides += `
      <div class="carousel-item ${idx===0?"active":""}">
        <img src="${item.image_url}" class="mission-img">
        <h3 style="margin:10px 0;">${item.name}</h3>
        <div><b>${item.xp} XP</b></div>
        ${type==="mission" ? `
          <div style="margin:8px 0;">Bereits erhalten: <b>${xpPerMission[item.id]||0}</b></div>
        ` : ""}
        ${type==="mission" && item.require_upload ? `
          <div style="margin-top:10px;">
            <input type="file" id="upload_${item.id}" style="display:none;" onchange="updateFileLabel(${item.id})">
            <label for="upload_${item.id}" class="file-label">Datei auswählen</label>
            <div id="file-name-${item.id}" style="font-size:12px;margin-top:4px;">Keine Datei</div>
            <button class="btn-primary" onclick="uploadMission(${item.id})">Upload senden</button>
          </div>
        ` : ""}
        ${type==="reward" ? `
          <button class="btn-primary" onclick="redeemReward(${item.id})">Einlösen</button>
        ` : ""}
      </div>
    `;
    dots += `<div class="dot ${idx===0?"active":""}" onclick="jumpSlide('${containerId}',${idx})"></div>`;
  });

  container.innerHTML = `
    <div class="carousel-wrapper">
      <span class="carousel-arrow" onclick="prevSlide('${containerId}')">&#10094;</span>
      ${slides}
      <span class="carousel-arrow" onclick="nextSlide('${containerId}')">&#10095;</span>
    </div>
    <div class="dot-container">${dots}</div>
  `;
}

function nextSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let idx = items.findIndex(i => i.classList.contains("active"));

  items[idx].classList.remove("active");
  idx = (idx+1) % items.length;
  items[idx].classList.add("active");
  updateDots(id, idx);
}

function prevSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let idx = items.findIndex(i => i.classList.contains("active"));

  items[idx].classList.remove("active");
  idx = (idx-1+items.length) % items.length;
  items[idx].classList.add("active");
  updateDots(id, idx);
}

function jumpSlide(id,idx) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  items.forEach(i => i.classList.remove("active"));
  items[idx].classList.add("active");
  updateDots(id, idx);
}

function updateDots(id, idx) {
  const dots = [...document.querySelectorAll(`#${id} .dot`)];
  dots.forEach(d => d.classList.remove("active"));
  dots[idx].classList.add("active");
}

/* ==============================================
   UPLOAD MISSION
============================================== */
function updateFileLabel(id) {
  const input = document.getElementById(`upload_${id}`);
  const name = document.getElementById(`file-name-${id}`);
  if (!input || !name) return;
  name.textContent = input.files.length ? input.files[0].name : "Keine Datei";
}

async function uploadMission(id) {
  const input = document.getElementById(`upload_${id}`);
  if (!input.files.length) return alert("Bitte Datei auswählen.");

  const fd = new FormData();
  fd.append("image", input.files[0]);
  fd.append("missionId", id);

  const r = await fetch("/api/student/uploadForMission", {
    method:"POST",
    body: fd
  });

  const data = await r.json();
  if (data.success) {
    alert("Upload erfolgreich!");
    loadMe();
  }
}

/* ==============================================
   REWARD
============================================== */
async function redeemReward(id) {
  const r = await fetch("/api/student/redeemReward", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({rewardId:id})
  });

  const data = await r.json();
  if (data.success) {
    alert("Belohnung eingelöst!");
    loadMe();
    loadRewards();
  }
}

/* ==============================================
   INIT
============================================== */
loadMe();
loadMissions();
loadRewards();
</script>

</body>
</html>
