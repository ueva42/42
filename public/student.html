<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Student</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* -------------------------- GLOBAL LAYOUT -------------------------- */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #f0f0f0;
      background: url("https://images.unsplash.com/photo-1600634306608-10f2147c2a01?q=80&w=1920") no-repeat center center fixed;
      background-size: cover;
      backdrop-filter: blur(3px);
    }

    /* -------------------------- MOBILE MENU -------------------------- */
    .mobile-toggle {
      display: none;
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 26px;
      cursor: pointer;
    }

    @media (max-width: 850px) {
      .sidebar {
        position: fixed;
        left: -240px;
        transition: 0.3s;
        z-index: 20;
      }
      .sidebar.open {
        left: 0;
      }
      .mobile-toggle {
        display: block;
      }
    }

    /* -------------------------- SIDEBAR MENU -------------------------- */
    .sidebar {
      width: 230px;
      height: 100vh;
      background: rgba(10, 8, 22, 0.92);
      border-right: 1px solid rgba(120,80,200,0.4);
      position: fixed;
      top: 0;
      left: 0;
      padding: 20px;
    }
    .sidebar h2 {
      text-align: center;
      margin: 0;
      color: #ddd6fe;
      font-size: 20px;
      letter-spacing: 0.12em;
    }
    .menu-item {
      padding: 12px;
      margin-top: 14px;
      background: rgba(28, 20, 55, 0.7);
      border-radius: 8px;
      border: 1px solid #3b2a6d;
      cursor: pointer;
      transition: 0.2s;
    }
    .menu-item:hover {
      background: rgba(60, 40, 120, 0.8);
    }

    /* -------------------------- CONTENT AREA -------------------------- */
    .content {
      margin-left: 250px;
      padding: 25px;
    }
    @media (max-width: 850px) {
      .content { margin-left: 0; padding-top: 70px; }
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-top: 0;
      color: #e3d5ff;
      letter-spacing: 0.25em;
      text-shadow: 0 0 18px rgba(255,200,80,0.6);
    }

    /* -------------------------- CARDS -------------------------- */
    .card {
      background: rgba(10, 8, 22, 0.75);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid rgba(80, 60, 150, 0.4);
      margin-bottom: 25px;
    }

    /* -------------------------- CHARACTER -------------------------- */
    .character-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
    }

    .level-bar {
      display: flex;
      gap: 6px;
      margin-top: 15px;
      justify-content: center;
    }
    .level-segment {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4b3b70;
      border: 1px solid #7b5cd6;
    }
    .level-active {
      background: gold !important;
      border-color: #fff08a !important;
      box-shadow: 0 0 10px gold;
    }

    /* -------------------------- MISSION CAROUSEL -------------------------- */
    .carousel-container {
      position: relative;
      max-width: 260px;
      margin: 0 auto;
    }
    .carousel-slide {
      display: none;
      text-align: center;
    }
    .carousel-slide.active {
      display: block;
    }

    .mission-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #5b48a0;
      margin-bottom: 8px;
    }

    .arrow {
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      font-size: 32px;
      cursor: pointer;
      color: #ddd6fe;
      text-shadow: 0 0 10px #000;
    }
    .arrow-left { left: -40px; }
    .arrow-right { right: -40px; }

    /* -------------------------- UPLOAD BUTTONS -------------------------- */
    input[type="file"] {
      background: rgba(20, 16, 36, 0.7);
      border: 1px solid #3a2d6b;
      padding: 10px;
      color: #d4ccff;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
    }

    .upload-btn {
      margin-top: 8px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      width: 100%;
      font-size: 14px;
      transition: 0.2s;
    }
    .upload-btn:hover {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
    }

    /* -------------------------- LOGOUT */
    .logout-btn {
      background: #331a4f;
      border: 1px solid #553388;
      padding: 8px 16px;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      text-align: center;
    }
    .logout-btn:hover {
      background: #4c2973;
    }

    /* -------------------------- UPLOAD GRID -------------------------- */
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .upload-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="mobile-toggle" onclick="toggleMenu()">☰</div>

<!-- -------------------------- SIDEBAR -------------------------- -->
<div class="sidebar" id="sidebar">
  <h2>TEMPLE OF LOGIC</h2>

  <div class="menu-item" onclick="scrollToSection('status')">Status</div>
  <div class="menu-item" onclick="scrollToSection('character')">Charakter</div>
  <div class="menu-item" onclick="scrollToSection('missions')">Missionen</div>
  <div class="menu-item" onclick="scrollToSection('rewards')">Belohnungen</div>
  <div class="menu-item" onclick="scrollToSection('history')">XP-Historie</div>

  <div class="logout-btn" onclick="logout()">Logout</div>
</div>

<!-- -------------------------- CONTENT -------------------------- -->
<div class="content">

  <h1>TEMPLE OF LOGIC</h1>

  <!-- STATUS -->
  <div class="card" id="status"></div>

  <!-- CHARACTER -->
  <div class="card" id="character"></div>

  <!-- MISSIONS -->
  <div class="card" id="missions"></div>

  <!-- REWARDS -->
  <div class="card" id="rewards"></div>

  <!-- XP HISTORY -->
  <div class="card" id="history"></div>

</div>

<script>
/* -------------------------- MOBILE MENU -------------------------- */
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("open");
}
function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({ behavior: "smooth" });
  toggleMenu();
}

/* -------------------------- LOGOUT -------------------------- */
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

/* -------------------------- LOAD STUDENT DATA -------------------------- */
let missionIndex = 0;
let missions = [];

async function loadStudent() {
  const r = await fetch("/api/student/me");
  const data = await r.json();

  /* STATUS */
  document.getElementById("status").innerHTML = `
    <h3>Status</h3>
    Name: <b>${data.user.name}</b><br>
    XP: <b>${data.user.xp}</b><br>
    Level: <b>${data.user.level_name || "-"}</b>
  `;

  /* CHARACTER */
  const char = data.character;
  const levelBar = createLevelBar(data);
  document.getElementById("character").innerHTML = `
    <h3>Charakter</h3>
    ${char ? `<img class="character-img" src="${char.image_url}">` : "Kein Charakter gewählt"}
    ${levelBar}
  `;

  /* MISSIONS */
  missions = await loadMissions();
  renderMissionCarousel(missions);

  /* REWARDS */
  renderRewards(data);

  /* XP HISTORY */
  let hist = "";
  data.xp_log.forEach(e => {
    hist += `<div>${e.amount} XP – ${e.mission_name || e.source}</div>`;
  });
  document.getElementById("history").innerHTML = `<h3>XP-Historie</h3>${hist}`;

  /* UPLOADS SECTION REMAINS SAME */
}

/* -------------------------- LEVEL BAR -------------------------- */
function createLevelBar(data) {
  const levels = data.levels;
  const xp = data.user.xp;

  return `
    <div class="level-bar">
      ${levels.map(l =>
        `<div class="level-segment ${xp >= l.min_xp ? "level-active" : ""}"></div>`
      ).join("")}
    </div>
  `;
}

/* -------------------------- MISSIONS -------------------------- */
async function loadMissions() {
  const r = await fetch("/api/student/missions");
  return await r.json();
}

function renderMissionCarousel(mList) {
  if (!mList.length) {
    document.getElementById("missions").innerHTML = "<h3>Missionen</h3>Keine Missionen vorhanden.";
    return;
  }

  document.getElementById("missions").innerHTML = `
    <h3>Missionen</h3>
    <div class="carousel-container">
      <div class="arrow arrow-left" onclick="prevMission()">❮</div>
      <div class="arrow arrow-right" onclick="nextMission()">❯</div>

      ${mList.map((m, i) => `
        <div class="carousel-slide ${i === 0 ? "active" : ""}">
          <img class="mission-img" src="${m.image_url}">
          <h4>${m.name}</h4>
          <div>${m.xp} XP</div>
          ${m.require_upload ? `
            <input type="file" id="upload_${m.id}">
            <button class="upload-btn" onclick="sendUpload(${m.id})">Upload senden</button>
          ` : ""}
        </div>
      `).join("")}
    </div>
  `;
}

function nextMission() {
  const slides = document.querySelectorAll(".carousel-slide");
  slides[missionIndex].classList.remove("active");
  missionIndex = (missionIndex + 1) % slides.length;
  slides[missionIndex].classList.add("active");
}

function prevMission() {
  const slides = document.querySelectorAll(".carousel-slide");
  slides[missionIndex].classList.remove("active");
  missionIndex = (missionIndex - 1 + slides.length) % slides.length;
  slides[missionIndex].classList.add("active");
}

/* -------------------------- UPLOAD -------------------------- */
async function sendUpload(id) {
  const fileInput = document.getElementById(`upload_${id}`);
  if (!fileInput.files[0]) return alert("Bitte eine Datei wählen.");

  const fd = new FormData();
  fd.append("image", fileInput.files[0]);
  fd.append("missionId", id);

  const r = await fetch("/api/student/uploadForMission", {
    method: "POST",
    body: fd
  });

  const data = await r.json();
  alert(data.success ? "Upload erfolgreich!" : "Fehler beim Upload.");
}

/* -------------------------- REWARDS -------------------------- */
async function renderRewards(data) {
  document.getElementById("rewards").innerHTML = `
    <h3>Belohnungen</h3>
    <div>Kommt bald…</div>
  `;
}

/* -------------------------- START -------------------------- */
loadStudent();
</script>

</body>
</html>
