<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple of Logic – Schüler</title>

<style>
body {
    margin:0;
    background:#0d1117;
    color:#d0e4ff;
    font-family:Arial, sans-serif;
    text-align:center;
}

/* HEADER */
.topbar {
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:20px;
}

.logout-btn {
    padding:8px 18px;
    background:rgba(120,150,255,0.15);
    border:1px solid rgba(120,150,255,0.4);
    color:#c7d9ff;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
.logout-btn:hover {
    background:rgba(120,150,255,0.35);
}

/* Goodbye Fade */
.goodbye {
    opacity:1;
    transition: opacity 0.8s ease;
}
.goodbye.fade {
    opacity:0;
}

/* Charakter-Karte */
.card {
    background:#141927;
    margin:20px auto;
    padding:20px;
    width:90%;
    max-width:500px;
    border:1px solid #283040;
    border-radius:14px;
}

#characterImage {
    width:170px;
    height:170px;
    border-radius:50%;
    border:2px solid #3c5280;
    object-fit:cover;
    margin-bottom:10px;
}

/* XP-Balken */
.xp-container {
    margin-top:15px;
    background:#1c2538;
    border-radius:10px;
    overflow:hidden;
    height:22px;
    border:1px solid #31405a;
}
.xp-bar {
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #4cc3ff, #009dff);
    transition:width 1.3s ease;
}

/* Titel */
.section-title {
    margin-top:25px;
    font-size:22px;
    color:#9db8ff;
}

/* LISTEN */
.listbox {
    background:#141927;
    border:1px solid #283040;
    margin:10px auto;
    padding:15px;
    width:90%;
    max-width:480px;
    border-radius:12px;
    font-size:18px;
}
.listbox div {
    margin:5px 0;
}

/* Missions-Karussell */
.carousel {
    position:relative;
    width:90%;
    margin:25px auto;
    background:#141927;
    border:1px solid #283040;
    padding:20px;
    border-radius:14px;
    min-height:150px;
    overflow:hidden;
}

.carousel-btn {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(120,150,255,0.2);
    color:#a9c7ff;
    border:1px solid rgba(120,150,255,0.4);
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:22px;
    z-index:10;
}
.carousel-btn:hover {
    background:rgba(120,150,255,0.4);
}

#prevMission { left:6px; }
#nextMission { right:6px; }

/* Animations-Container */
.mission-slide-wrapper {
    display:flex;
    width:100%;
    transition:transform 0.45s ease;
}

.mission-card {
    min-width:100%;
    box-sizing:border-box;
    padding:15px;
    font-size:18px;
    color:#d0e4ff;
}

.upload-btn {
    margin-top:15px;
    padding:8px 14px;
    background:rgba(0,170,255,0.2);
    border:1px solid rgba(0,170,255,0.5);
    font-size:14px;
    color:#a8e0ff;
    border-radius:8px;
    cursor:pointer;
}
.upload-btn:hover {
    background:rgba(0,170,255,0.35);
}

</style>
</head>
<body>

<div class="topbar">
    <button id="logoutBtn" class="logout-btn">Logout</button>
</div>

<div id="content" class="goodbye">

    <div class="card">
        <img id="characterImage" src="" alt="Charakter">
        <div id="characterName" style="font-size:22px; margin-top:8px;"></div>
        <div style="margin-top:10px; font-size:18px;">
            XP: <span id="xpValue">0</span>
        </div>

        <div class="xp-container">
            <div id="xpBar" class="xp-bar"></div>
        </div>

        <div id="levelDisplay" style="margin-top:10px; font-size:16px;"></div>
    </div>

    <h2 class="section-title">Eigenschaften</h2>
    <div class="listbox" id="traitsBox"></div>

    <h2 class="section-title">Ausrüstung</h2>
    <div class="listbox" id="itemsBox"></div>

    <h2 class="section-title">Missionen</h2>
    <div class="carousel">
        <button id="prevMission" class="carousel-btn">&#10094;</button>

        <div class="mission-slide-wrapper" id="missionSlides">
            <!-- Dynamisch gefüllt -->
        </div>

        <button id="nextMission" class="carousel-btn">&#10095;</button>
    </div>
</div>

<script>
// ==============================
// Global Vars
// ==============================
let missions = [];
let slideIndex = 0;

// ==============================
// INITIAL LOAD
// ==============================
window.onload = async () => {
    await fetchFirstLogin();
    await loadStudentData();
};

// ==============================
// First Login: Traits + Items + Charakter
// ==============================
async function fetchFirstLogin() {
    await fetch("/api/student/firstLogin", {
        method: "POST"
    });
}

// ==============================
// Load Student Info
// ==============================
async function loadStudentData() {
    const r = await fetch("/api/student/me");
    const data = await r.json();
    const u = data.user;
    const c = data.character;

    // Charakterbild
    document.getElementById("characterImage").src =
        c && c.image_url ? c.image_url : "https://via.placeholder.com/170?text=?";

    document.getElementById("characterName").textContent =
        c ? c.name : "Unbekannt";

    // XP + Balken
    document.getElementById("xpValue").textContent = u.xp;
    animateXPBar(u.xp, u.level_min_xp);

    // Traits
    const traitsBox = document.getElementById("traitsBox");
    traitsBox.innerHTML = "";
    (u.traits || []).forEach(t => {
        traitsBox.innerHTML += `<div>• ${t}</div>`;
    });

    // Items
    const itemsBox = document.getElementById("itemsBox");
    itemsBox.innerHTML = "";
    (u.items || []).forEach(i => {
        itemsBox.innerHTML += `<div>• ${i}</div>`;
    });

    // Missionen
    const mRes = await fetch("/api/missions");
    missions = await mRes.json();

    buildMissionCarousel();
}

// ==============================
// XP-Balken animiert
// ==============================
function animateXPBar(xp, minXp) {
    let percent = 0;

    // Wenn minXP 0 ist → 100%
    if (minXp <= xp) {
        percent = 100;
    }

    document.getElementById("xpBar").style.width = percent + "%";
}

// ==============================
// Missionen-Karussell bauen
// ==============================
function buildMissionCarousel() {
    const wrap = document.getElementById("missionSlides");
    wrap.innerHTML = "";

    missions.forEach(m => {
        let card = `
            <div class="mission-card">
                <div><strong>${m.name}</strong></div>
                <div style="margin-top:6px; font-size:16px; color:#8ab4ff;">+${m.xp} XP</div>
                ${m.require_upload ? `<button class="upload-btn" onclick="uploadForMission(${m.id})">Bild hochladen</button>` : ``}
            </div>
        `;
        wrap.innerHTML += card;
    });

    slideIndex = 0;
    updateCarouselPosition();
}

// ==============================
// Karussell Animation
// ==============================
document.getElementById("prevMission").onclick = () => {
    if (missions.length === 0) return;
    slideIndex = (slideIndex - 1 + missions.length) % missions.length;
    updateCarouselPosition();
};

document.getElementById("nextMission").onclick = () => {
    if (missions.length === 0) return;
    slideIndex = (slideIndex + 1) % missions.length;
    updateCarouselPosition();
};

function updateCarouselPosition() {
    const wrap = document.getElementById("missionSlides");
    wrap.style.transform = `translateX(-${slideIndex * 100}%)`;
}

// ==============================
// Mission Upload
// ==============================
function uploadForMission(id) {
    alert("Upload folgt – brauchst du mit R2? Sag Bescheid.");
}

// ==============================
// Logout
// ==============================
document.getElementById("logoutBtn").onclick = async () => {
    const cont = document.getElementById("content");
    cont.classList.add("fade");

    setTimeout(async () => {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/login.html";
    }, 700);
};

</script>
</body>
</html>
