<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>

  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(168,85,247,0.3) 0, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,0.28) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30,64,175,0.45) 0, transparent 60%),
        #020308;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid #4c1d95;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }

    .logout-btn {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      border: none;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #3f2d7c;
      padding-bottom: 6px;
      color: #c4b5fd;
    }

    .card {
      background: radial-gradient(circle at top left, #1e1b4b 0, #020617 60%);
      border: 1px solid #312e81;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
      text-align: center;
    }

    /* Charakterbild */
    .char-big {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #6d28d9;
      margin-bottom: 10px;
    }

    /* Level-Balken */
    #levelBarContainer {
      position: relative;
      height: 22px;
      background: #1a1033;
      border-radius: 12px;
      border: 1px solid #5b21b6;
      overflow: hidden;
      max-width: 320px;
      margin: 0 auto;
    }

    #levelBarFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#7c3aed,#a78bfa);
      transition: 0.4s;
    }

    #levelStar {
      position: absolute;
      right: -12px;
      top: -6px;
      font-size: 26px;
      color: #facc15;
      text-shadow: 0 0 4px #fbbf24;
    }

    /* KARUSSELL */
    #carouselContainer {
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    #carousel {
      display: flex;
      transition: 0.45s ease;
      width: 100%;
    }

    .mission-slide {
      min-width: 100%;
      box-sizing: border-box;
      padding: 10px;
    }

    .mission-slide img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #4c1d95;
      margin-bottom: 10px;
    }

    button.action {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      padding: 8px 14px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    #prevBtn, #nextBtn {
      position: absolute;
      top: 45%;
      z-index: 5;
    }
    #prevBtn { left: 10px; }
    #nextBtn { right: 10px; }

    /* Pagination */
    .dot {
      height: 10px;
      width: 10px;
      margin: 3px;
      background-color: #4c1d95;
      border-radius: 50%;
      display: inline-block;
      transition: 0.2s;
      cursor: pointer;
    }

    .dot.active {
      background-color: #c084fc;
      transform: scale(1.3);
    }

  </style>
</head>

<body>

<header>
  <h1>TEMPLE OF LOGIC – Schülerbereich</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <h2>Dein Charakter & Status</h2>
  <div class="card">
    <img id="charBig" class="char-big" src="">
    <div id="charName" style="font-size:18px;margin-bottom:10px;color:#ddd6fe;font-weight:bold;"></div>

    <div id="xpBlock" style="margin-top:15px;">
      <div><b>XP:</b> <span id="xpValue"></span></div>
      <div><b>Level:</b> <span id="levelValue"></span></div>

      <div style="margin-top:12px;">
        <div id="levelBarContainer">
          <div id="levelBarFill"></div>
          <div id="levelStar">★</div>
        </div>
      </div>
    </div>
  </div>

  <h2>Eigenschaften & Items</h2>
  <div class="card" id="traitsItemsCard"></div>

  <h2>Missionen</h2>
  <div class="card">
    <div id="carouselContainer">
      <div id="carousel"></div>

      <button id="prevBtn" class="action">⟨</button>
      <button id="nextBtn" class="action">⟩</button>
    </div>

    <div id="pagination" style="margin-top:10px;"></div>
  </div>

  <h2>Deine XP-History</h2>
  <div id="xpLog"></div>

  <h2>Deine Uploads</h2>
  <div class="upload-grid" id="uploadGrid"></div>

</div>

<script>
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

let currentSlide = 0;
let missionsGlobal = [];

/* ================================
   STUDENT DATA
   ================================ */
async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();

  const u = data.user;

  document.getElementById("charBig").src =
    data.character ? data.character.image_url : "";

  document.getElementById("charName").innerText =
    data.character ? data.character.name : "Noch kein Charakter";

  document.getElementById("xpValue").innerText = u.xp;
  document.getElementById("levelValue").innerText =
    `${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)`;

  // Traits + Items
  document.getElementById("traitsItemsCard").innerHTML = `
    <b>Eigenschaften:</b><br>
    ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
    <b>Items:</b><br>
    ${data.items.map(i => "• " + i).join("<br>")}
  `;

  // XP History
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div style="padding:8px;border-bottom:1px solid #3c2d69;">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source}<br>
        <span style="opacity:0.7;">${d}</span>
      </div>`;
  });

  // Upload Grid
  const up = document.getElementById("uploadGrid");
  up.innerHTML = "";
  data.uploads.forEach(upl => {
    up.innerHTML += `
      <div class="upload-card">
        <img src="${upl.image_url}">
        <div style="font-size:12px;opacity:0.8;">${upl.mission_name || "—"}</div>
      </div>
    `;
  });

  // LEVELBAR
  const levels = data.levels || [];
  let currentLevel = levels.find(l => l.id === u.level_id);
  let nextLevel = null;

  if (currentLevel) {
    const sorted = [...levels].sort((a, b) => a.min_xp - b.min_xp);
    const idx = sorted.findIndex(l => l.id === currentLevel.id);
    nextLevel = sorted[idx + 1] || null;
  }

  let progress = 1;
  if (currentLevel && nextLevel) {
    const span = nextLevel.min_xp - currentLevel.min_xp;
    const done = u.xp - currentLevel.min_xp;
    progress = Math.max(0, Math.min(1, done / span));
  }

  document.getElementById("levelBarFill").style.width = (progress * 100) + "%";

  const star = document.getElementById("levelStar");
  if (!nextLevel) {
    star.style.opacity = 0.3;
  } else {
    star.style.opacity = 1;
  }
}

/* ================================
   MISSIONS LADEN
   ================================ */
async function loadMissions() {
  const r = await fetch("/api/student/missions");
  const missions = await r.json();
  missionsGlobal = missions;

  const c = document.getElementById("carousel");
  c.innerHTML = "";

  missions.forEach(m => {
    const slide = document.createElement("div");
    slide.className = "mission-slide";

    slide.innerHTML = `
      ${m.image_url ? `<img src="${m.image_url}">` : ""}
      <h3>${m.name}</h3>
      <div><b>${m.xp} XP</b></div>
      ${m.require_upload ? `<div style="color:#fca5a5;">📎 Upload erforderlich</div>` : ""}
      <br>
      ${m.require_upload ? `
        <input type="file" id="upload_${m.id}">
        <button class="action" onclick="uploadMission(${m.id})">Upload senden</button>`
      : ""}
    `;

    c.appendChild(slide);
  });

  updateCarousel();
  updatePagination();
}

/* ================================
   KARUSSELL FUNKTIONEN
   ================================ */
function updateCarousel() {
  const c = document.getElementById("carousel");
  c.style.transform = `translateX(-${currentSlide * 100}%)`;
  updatePagination();
}

function updatePagination() {
  const p = document.getElementById("pagination");
  p.innerHTML = "";

  missionsGlobal.forEach((_, i) => {
    const d = document.createElement("span");
    d.className = "dot" + (i === currentSlide ? " active" : "");
    d.onclick = () => {
      currentSlide = i;
      updateCarousel();
    };
    p.appendChild(d);
  });
}

document.getElementById("prevBtn").onclick = () => {
  if (currentSlide > 0) currentSlide--;
  updateCarousel();
};

document.getElementById("nextBtn").onclick = () => {
  if (currentSlide < missionsGlobal.length - 1) currentSlide++;
  updateCarousel();
};

/* SWIPE */
let startX = 0;
document.getElementById("carouselContainer").addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});
document.getElementById("carouselContainer").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (dx > 40 && currentSlide > 0) currentSlide--;
  if (dx < -40 && currentSlide < missionsGlobal.length - 1) currentSlide++;
  updateCarousel();
});

/* UPLOAD */
async function uploadMission(id) {
  const file = document.getElementById(`upload_${id}`).files[0];
  if (!file) return alert("Bitte ein Bild auswählen!");

  const form = new FormData();
  form.append("image", file);
  form.append("missionId", id);

  const r = await fetch("/api/student/uploadForMission", {
    method: "POST",
    body: form
  });

  const data = await r.json();
  if (data.success) {
    alert("Upload erfolgreich!");
    loadMe();
  } else {
    alert("Upload fehlgeschlagen");
  }
}

/* INIT */
loadMe();
loadMissions();

</script>

</body>
</html>
