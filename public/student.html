<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>
  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(168,85,247,0.3), transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,0.25), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30,64,175,0.45), transparent 60%),
        #020308;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid #4c1d95;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }

    .logout-btn {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      border: none;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #3f2d7c;
      padding-bottom: 6px;
      color: #c4b5fd;
    }

    .card {
      background: radial-gradient(circle at top left, #1e1b4b 0, #020617 60%);
      border: 1px solid #312e81;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
    }

    .char-big {
      width: 240px;
      height: 400px;
      object-fit: cover;
      display: block;
      margin: 0 auto 10px;
      border-radius: 12px;
      border: none;
    }

    .level-step-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .level-step {
      width: 60px;
      height: 10px;
      background: #1b1537;
      border-radius: 6px;
      border: 1px solid #4c1d95;
      overflow: hidden;
      position: relative;
    }

    .level-step-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      width: 0%;
      transition: width 0.4s ease;
    }

    .level-step-star {
      font-size: 20px;
      color: gold;
    }

    .carousel {
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s ease;
    }

    .slide {
      min-width: 100%;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
    }

    .mission-img,
    .bonus-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #4c1d95;
      margin: 0 auto 10px;
    }

    .carousel-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.45);
      border: 1px solid #6d28d9;
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      z-index: 5;
    }

    .carousel-btn.left { left: 10px; }
    .carousel-btn.right { right: 10px; }

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #4c1d95;
      border-radius: 50%;
      opacity: 0.4;
      transition: 0.2s;
      cursor: pointer;
    }

    .dot.active {
      opacity: 1;
      transform: scale(1.2);
      background: #a78bfa;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .upload-card {
      background: #111026;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2d2254;
    }

    .upload-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }

    .primary-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <h1>TEMPLE OF LOGIC – Schülerbereich</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <h2>Dein Status</h2>
  <div class="card">
    <div id="userCard"></div>
    <div id="levelBar"></div>
  </div>

  <h2>Dein Charakter</h2>
  <div class="card" id="characterCard"></div>

  <h2>Eigenschaften & Items</h2>
  <div class="card" id="traitsItemsCard"></div>

  <h2>Missionen</h2>
  <div class="card">
    <div class="carousel">
      <button class="carousel-btn left" onclick="prevMission()">❮</button>
      <div class="carousel-track" id="missionTrack"></div>
      <button class="carousel-btn right" onclick="nextMission()">❯</button>
    </div>
    <div class="dots" id="missionDots"></div>
  </div>

  <h2>Belohnungen</h2>
  <div class="card">
    <div class="carousel">
      <button class="carousel-btn left" onclick="prevBonus()">❮</button>
      <div class="carousel-track" id="bonusTrack"></div>
      <button class="carousel-btn right" onclick="nextBonus()">❯</button>
    </div>
    <div class="dots" id="bonusDots"></div>
  </div>

  <h2>Deine XP-History</h2>
  <div id="xpLog"></div>

  <h2>Deine Uploads</h2>
  <div class="upload-grid" id="uploadGrid"></div>

</div>

<script>
  let missions = [];
  let currentMission = 0;
  let bonuses = [];
  let currentBonus = 0;
  let xpPerMission = {};

  async function logout() {
    await fetch("/api/logout", { method: "POST" });
    location.href = "/login.html";
  }

  async function loadMe() {
    const r = await fetch("/api/student/me");
    const data = await r.json();

    const u = data.user;
    xpPerMission = data.xp_per_mission || {};

    document.getElementById("userCard").innerHTML =
      `<b>Name:</b> ${u.name}<br>
       <b>XP:</b> ${u.xp}<br>
       <b>Level:</b> ${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)`;

    document.getElementById("characterCard").innerHTML = data.character
      ? `<img class="char-big" src="${data.character.image_url}">
         <div style="text-align:center;margin-top:5px;">${data.character.name}</div>`
      : "Noch kein Charakter gewählt.";

    document.getElementById("traitsItemsCard").innerHTML =
      `<b>Eigenschaften:</b><br>${data.traits.map(t => "• " + t).join("<br>")}<br><br>
       <b>Items:</b><br>${data.items.map(i => "• " + i).join("<br>")}`;

    const xpDiv = document.getElementById("xpLog");
    xpDiv.innerHTML = "";
    data.xp_log.forEach(e => {
      xpDiv.innerHTML += `
        <div style="padding:8px;border-bottom:1px solid #3c2d69;font-size:14px;">
          <b>${e.amount} XP</b> – ${e.mission_name || e.source}<br>
          <span style="opacity:0.7;">${new Date(e.created_at).toLocaleString("de-DE")}</span>
        </div>`;
    });

    const up = document.getElementById("uploadGrid");
    up.innerHTML = "";
    data.uploads.forEach(upl => {
      up.innerHTML += `
        <div class="upload-card">
          <img src="${upl.image_url}">
          <div style="font-size:12px;opacity:0.8;">${upl.mission_name || "—"}</div>
        </div>`;
    });

    renderLevelBar(u, data.levels);
  }

  function renderLevelBar(user, levels) {
    if (!levels || !levels.length) {
      document.getElementById("levelBar").innerHTML = "";
      return;
    }

    let html = `<div class="level-step-container">`;

    for (let i = 0; i < levels.length; i++) {
      if (i > 0) html += `<div class="level-step-star">★</div>`;

      const min = levels[i].min_xp;
      const nextMin = levels[i + 1]?.min_xp || min;
      let pct = 0;

      if (user.xp >= min) {
        pct = Math.min(100, ((user.xp - min) / (nextMin - min)) * 100);
        if (!isFinite(pct) || pct < 0) pct = 100;
      }

      html += `
        <div class="level-step">
          <div class="level-step-fill" style="width:${pct}%;"></div>
        </div>
      `;
    }

    html += `</div>`;
    document.getElementById("levelBar").innerHTML = html;
  }

  async function loadMissions() {
    const r = await fetch("/api/student/missions");
    missions = await r.json();

    const track = document.getElementById("missionTrack");
    const dots = document.getElementById("missionDots");
    track.innerHTML = "";
    dots.innerHTML = "";

    if (!missions.length) {
      track.innerHTML = `<div class="slide">Noch keine Missionen.</div>`;
      return;
    }

    missions.forEach((m, idx) => {
      const earned = xpPerMission[m.id] || 0;
      track.innerHTML += `
        <div class="slide">
          ${m.image_url ? `<img class="mission-img" src="${m.image_url}">` : ""}
          <h3>${m.name}</h3>
          <div><b>${m.xp} XP</b></div>
          <div style="opacity:0.8;font-size:13px;margin-top:3px;">
            Bereits erhalten: ${earned} XP
          </div>
          ${m.require_upload ? `
            <div style="margin-top:10px;">
              <input type="file" id="upload_${m.id}">
              <button class="primary-btn" onclick="uploadMission(${m.id})">Upload senden</button>
            </div>
          ` : ""}
        </div>`;
      dots.innerHTML += `<div class="dot" onclick="goMission(${idx})"></div>`;
    });

    currentMission = 0;
    updateMissionCarousel();
  }

  function updateMissionCarousel() {
    const track = document.getElementById("missionTrack");
    const dots = document.querySelectorAll("#missionDots .dot");
    track.style.transform = `translateX(-${currentMission * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle("active", i === currentMission));
  }

  function prevMission() {
    if (!missions.length) return;
    currentMission = Math.max(0, currentMission - 1);
    updateMissionCarousel();
  }

  function nextMission() {
    if (!missions.length) return;
    currentMission = Math.min(missions.length - 1, currentMission + 1);
    updateMissionCarousel();
  }

  function goMission(i) {
    currentMission = i;
    updateMissionCarousel();
  }

  async function uploadMission(id) {
    const file = document.getElementById(`upload_${id}`).files[0];
    if (!file) return alert("Bitte ein Bild auswählen!");

    const fd = new FormData();
    fd.append("image", file);
    fd.append("missionId", id);

    const r = await fetch("/api/student/uploadForMission", {
      method: "POST",
      body: fd
    });

    const data = await r.json();
    if (data.success) {
      alert("Upload erfolgreich!");
      loadMe();
    } else {
      alert("Upload fehlgeschlagen.");
    }
  }

  async function loadBonuses() {
    const r = await fetch("/api/student/bonuscards");
    bonuses = await r.json();

    const track = document.getElementById("bonusTrack");
    const dots = document.getElementById("bonusDots");
    track.innerHTML = "";
    dots.innerHTML = "";

    if (!bonuses.length) {
      track.innerHTML = `<div class="slide">Noch keine Belohnungen freigeschaltet.</div>`;
      return;
    }

    bonuses.forEach((b, idx) => {
      track.innerHTML += `
        <div class="slide">
          ${b.image_url ? `<img class="bonus-img" src="${b.image_url}">` : ""}
          <h3>${b.name}</h3>
          <div><b>Kosten: ${b.xp} XP</b></div>
          <div style="opacity:0.8;font-size:13px;margin-top:4px;">
            Du kannst diese Belohnung einlösen.
          </div>
          <button class="primary-btn" onclick="redeemBonus(${b.id})">Belohnung einlösen</button>
        </div>`;
      dots.innerHTML += `<div class="dot" onclick="goBonus(${idx})"></div>`;
    });

    currentBonus = 0;
    updateBonusCarousel();
  }

  function updateBonusCarousel() {
    const track = document.getElementById("bonusTrack");
    const dots = document.querySelectorAll("#bonusDots .dot");
    track.style.transform = `translateX(-${currentBonus * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle("active", i === currentBonus));
  }

  function prevBonus() {
    if (!bonuses.length) return;
    currentBonus = Math.max(0, currentBonus - 1);
    updateBonusCarousel();
  }

  function nextBonus() {
    if (!bonuses.length) return;
    currentBonus = Math.min(bonuses.length - 1, currentBonus + 1);
    updateBonusCarousel();
  }

  function goBonus(i) {
    currentBonus = i;
    updateBonusCarousel();
  }

  async function redeemBonus(id) {
    const res = await fetch("/api/student/redeemBonus", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bonusId: id })
    });
    const data = await res.json();
    if (!data.success) {
      alert("Belohnung konnte nicht eingelöst werden (zu wenig XP?).");
      return;
    }
    alert("Belohnung eingelöst! XP wurden abgezogen, dein Level bleibt erhalten.");
    await loadMe();
    await loadBonuses();
  }

  // INIT
  loadMe();
  loadMissions();
  loadBonuses();
</script>

</body>
</html>
