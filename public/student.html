<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schülerbereich</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0c;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .card {
      background: #161616;
      border: 1px solid #333;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .char-img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #444;
    }

    .mission-img, .bonus-img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #444;
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 20px;
      padding-bottom: 10px;
    }

    .carousel::-webkit-scrollbar {
      height: 8px;
    }
    .carousel::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .bonus-card {
      position: relative;
    }

    .bonus-btn {
      margin-top: 5px;
      background: #009933;
      border: none;
      color: white;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    .bonus-btn:hover {
      background: #00bb44;
    }

    input[type=file] {
      margin-top: 8px;
    }

    .level-bar {
      background: #222;
      height: 25px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #555;
      margin-top: 8px;
    }

    .level-fill {
      height: 100%;
      background: linear-gradient(90deg, #0080ff, #00ffaa);
      width: 0%;
      transition: width 0.5s;
    }

    .logout {
      background: #aa2222;
      padding: 8px 12px;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      float: right;
    }
    .logout:hover {
      background: #dd0000;
    }
  </style>
</head>
<body>

<button class="logout" onclick="logout()">Logout</button>
<h1>Temple of Logic</h1>

<div id="content"></div>

<script>
// ======================================================
// Daten laden + darstellen
// ======================================================

async function initStudentSession() {
  // Charakter/Traits/Items anlegen, falls neu
  await fetch("/api/student/state/init", { method: "POST" });
}

async function loadData() {
  const r = await fetch("/api/student/me");
  const data = await r.json();
  render(data);
}

function render(data) {
  const { user, state, missions, levels, bonuscards } = data;

  const c = document.getElementById("content");
  c.innerHTML = "";

  // --------------------------------------------------
  // Charakterkarte
  // --------------------------------------------------

  const charCard = document.createElement("div");
  charCard.className = "card";

  charCard.innerHTML = `
    <h2>Dein Charakter</h2>
    <div class="row">
      <div>
        <img class="char-img" src="${state?.image_url || ""}">
      </div>
      <div>
        <b>Name:</b> ${state?.character_name || "—"}<br><br>
        <b>Eigenschaften:</b><br>
        ${state?.traits?.join(", ") || "—"}<br><br>
        <b>Ausrüstung:</b><br>
        ${state?.items?.join(", ") || "—"}
      </div>
    </div>
  `;

  c.appendChild(charCard);

  // --------------------------------------------------
  // XP + Level
  // --------------------------------------------------

  const levelCard = document.createElement("div");
  levelCard.className = "card";

  // Level bestimmen
  const lvl = determineLevel(user.xp, levels);

  const fillPercent = calcLevelFill(user.xp, levels);

  levelCard.innerHTML = `
    <h2>Dein Fortschritt</h2>
    <b>XP:</b> ${user.xp}<br>
    <b>Level:</b> ${lvl.name}<br><br>
    <div class="level-bar">
      <div class="level-fill" style="width:${fillPercent}%"></div>
    </div>
  `;

  c.appendChild(levelCard);

  // --------------------------------------------------
  // Missionen
  // --------------------------------------------------

  const missionCard = document.createElement("div");
  missionCard.className = "card";

  missionCard.innerHTML = `<h2>Missionen</h2>`;

  const carousel = document.createElement("div");
  carousel.className = "carousel";

  missions.forEach(m => {
    const div = document.createElement("div");
    div.innerHTML = `
      <img class="mission-img" src="${m.image_url || ""}">
      <br>
      <b>${m.name}</b><br>
      XP: ${m.xp}<br>
      ${m.require_upload ? `<input type="file" onchange="uploadMissionImage(${m.id}, this.files[0])">` : ""}
    `;
    carousel.appendChild(div);
  });

  missionCard.appendChild(carousel);
  c.appendChild(missionCard);

  // --------------------------------------------------
  // Bonuskarten
  // --------------------------------------------------

  const bonusCard = document.createElement("div");
  bonusCard.className = "card";
  bonusCard.innerHTML = `<h2>Bonuskarten</h2>`;

  const bCarousel = document.createElement("div");
  bCarousel.className = "carousel";

  bonuscards.forEach(b => {
    if (user.xp >= b.xp) {
      const d = document.createElement("div");
      d.className = "bonus-card";
      d.innerHTML = `
        <img class="bonus-img" src="${b.image_url || ""}">
        <div><b>${b.name}</b><br>XP-Kosten: ${b.xp}</div>
        <button class="bonus-btn" onclick="redeemBonus(${b.id}, ${b.xp})">Einlösen</button>
      `;
      bCarousel.appendChild(d);
    }
  });

  bonusCard.appendChild(bCarousel);
  c.appendChild(bonusCard);
}

// ======================================================
// Level Helper
// ======================================================

function determineLevel(xp, levels) {
  if (levels.length === 0) return { name: "—", required_xp: 0 };

  let last = levels[0];

  for (let lvl of levels) {
    if (xp >= lvl.required_xp) last = lvl;
    else break;
  }

  return last;
}

function calcLevelFill(xp, levels) {
  if (levels.length < 2) return 100;

  let current = determineLevel(xp, levels);
  let next = levels.find(l => l.required_xp > current.required_xp);

  if (!next) return 100;

  const dist = next.required_xp - current.required_xp;
  const progress = xp - current.required_xp;

  return Math.max(0, Math.min(100, (progress / dist) * 100));
}

// ======================================================
// Upload
// ======================================================

async function uploadMissionImage(missionId, file) {
  if (!file) return;

  const form = new FormData();
  form.append("image", file);
  form.append("missionId", missionId);

  const r = await fetch("/api/student/upload", {
    method: "POST",
    body: form,
  });

  const data = await r.json();
  if (data.success) {
    alert("Bild hochgeladen!");
    loadData();
  }
}

// ======================================================
// Bonus einlösen
// ======================================================

async function redeemBonus(bonusId, xpCost) {
  if (!confirm("Bonuskarte einlösen?")) return;

  await fetch("/api/xp", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ studentId: null, xp: -xpCost })
  });

  alert("Bonus eingelöst!");
  location.reload();
}

// ======================================================
// Logout
// ======================================================

async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

// ======================================================
// Start
// ======================================================

(async () => {
  await initStudentSession();
  await loadData();
})();
</script>

</body>
</html>
