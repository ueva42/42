<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Streets of Logic – Student Dashboard</title>

<!-- GTA Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================
   GLOBAL – GTA Background
============================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  overflow: hidden;
  font-family: "Roboto", sans-serif;
  color: #f9fafb;
  background:
    radial-gradient(circle at 10% 0%, rgba(255,184,108,0.18) 0, transparent 50%),
    radial-gradient(circle at 90% 20%, rgba(255,46,99,0.26) 0, transparent 55%),
    radial-gradient(circle at 50% 100%, rgba(56,189,248,0.25) 0, transparent 60%),
    #050816;
}

/* ============================================
   SIDEBAR
============================================ */
.sidebar {
  width: 250px;
  padding: 20px 16px;
  background:
    radial-gradient(circle at top left, #111827 0, #020617 55%, #02010a 100%);
  border-right: 2px solid rgba(248,250,252,0.06);
  box-shadow: 0 0 25px rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-orb {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 20%, #ffe066 0, #ff9800 25%, #f97316 40%, #7c2d12 70%, #020617 100%);
  box-shadow:
    0 0 12px rgba(255,224,102,1),
    0 0 24px rgba(249,115,22,0.9);
}

.sidebar-title {
  font-family: "Bangers";
  font-size: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin: 0;
}

.sidebar-sub {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: #9ca3af;
}

/* Navigation items */
.nav-item {
  padding: 9px 12px;
  border-radius: 999px;
  background: rgba(15,23,42,0.92);
  border: 1px solid rgba(148,163,184,0.28);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: 0.15s;
}

.nav-item svg {
  width: 20px;
  height: 20px;
  fill: #f97316;
}

.nav-item:hover {
  transform: translateX(4px);
  background: linear-gradient(120deg, rgba(248,250,252,0.08), rgba(15,23,42,0.97));
  border-color: #f97316;
  box-shadow:
    0 5px 12px rgba(0,0,0,0.95),
    0 0 12px rgba(249,115,22,0.7);
}

.nav-item.active {
  background: linear-gradient(120deg, #f97316, #ec4899);
  border-color: #facc15;
}

.nav-item.active svg {
  fill: #0b1120;
}

/* ============================================
   CONTENT AREA
============================================ */
.content {
  flex-grow: 1;
  overflow-y: auto;
  padding: 20px 22px;
}

.content-inner {
  max-width: 1080px;
  margin: 0 auto;
}

h1 {
  font-family: "Bangers";
  letter-spacing: 0.18em;
  font-size: 30px;
  text-transform: uppercase;
  color: #fffbeb;
  text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 0 18px rgba(255,212,128,0.9);
  margin-bottom: 10px;
}

.page-subtitle {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #9ca3af;
  margin-bottom: 20px;
}

/* ============================================
   PANELS (GTA HUD)
============================================ */
.panel {
  background: rgba(15,23,42,0.94);
  border-radius: 18px;
  padding: 16px 18px;
  margin-bottom: 18px;
  border: 2px solid rgba(15,23,42,1);
  outline: 2px solid rgba(15,23,42,0.6);
  position: relative;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.95),
    0 0 18px rgba(15,23,42,0.7);
}

.panel::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  border: 1px solid rgba(248,250,252,0.03);
  pointer-events: none;
}

h2 {
  font-size: 20px;
  margin-top: 0;
}

h3 {
  font-size: 16px;
}

/* ============================================
   LOADER SCREEN
============================================ */
#loadingOverlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(circle at center, #020617 0%, #111827 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 1.8s ease;
}

#loadingOverlay.hide {
  opacity: 0;
  pointer-events: none;
}

/* Content Fade + Zoom */
.loading-content {
  text-align: center;
  max-width: 800px;
  opacity: 0;
  animation: slowFadeZoom 3s ease forwards;
}

@keyframes slowFadeZoom {
  0%   { opacity: 0; transform: translateY(30px) scale(0.92); }
  40%  { opacity: 0.35; transform: translateY(10px) scale(0.96); }
  70%  { opacity: 0.7; }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Image Fade-In + 4s HOLD */
.loading-image {
  max-width: 100%;
  border-radius: 22px;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeInHoldFadeOut 7.2s ease forwards;
}

@keyframes fadeInHoldFadeOut {
  0%   { opacity: 0; }
  25%  { opacity: 1; }
  65%  { opacity: 1; } /* 4 Sekunden Standzeit hier */
  100% { opacity: 0; }
}

/* Progress Bar (slower) */
.loading-bar {
  width: 80%;
  max-width: 540px;
  height: 16px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(8,15,30,0.95);
  overflow: hidden;
  margin: 0 auto;
}

.loading-bar-fill {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg,#22c55e,#facc15,#f97316,#c084fc);
  animation: loadingA 12s ease-in-out forwards;
}

@keyframes loadingA {
  0% { width: 0%; }
  20% { width: 22%; }
  40% { width: 55%; }
  70% { width: 82%; }
  100% { width: 100%; }
}

.hidden { display: none; }

</style>
</head>

<body>

<!-- =============================
     LOADER
============================= -->
<div id="loadingOverlay">
  <div class="loading-content">
    <img src="student_startbild.jpg" class="loading-image">
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>
</div>

<!-- =============================
     SIDEBAR
============================= -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-orb"></div>
    <div>
      <div class="sidebar-title">STREETS OF LOGIC</div>
      <div class="sidebar-sub">XP EDITION</div>
    </div>
  </div>

  <div class="nav-item active" onclick="showTab('missionsTab', event)">
    <svg viewBox="0 0 24 24"><path d="M3 3v18l9-4 9 4V3H3z"/></svg>
    Missionen
  </div>

  <div class="nav-item" onclick="showTab('classRewardTab', event)">
    <svg viewBox="0 0 24 24"><path d="M4 20h3v-7H4v7zm6 0h3V4h-3v16zm6 0h3v-4h-3v4z"/></svg>
    Klassen-Belohnung
  </div>

  <div class="nav-item" onclick="showTab('profileTab', event)">
    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 110 10 5 5 0 010-10zM12 14c-3.3 0-7 1.7-7 4.5V20h14v-1.5C19 15.7 15.3 14 12 14z"/></svg>
    Profil
  </div>

  <div class="nav-item" onclick="logout()">
    <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3h9z"/></svg>
    Logout
  </div>
</div>

<!-- =============================
     CONTENT
============================= -->
<div class="content">
  <div class="content-inner">
    <h1>STREETS OF LOGIC</h1>
    <div class="page-subtitle">Student Dashboard</div>

    <!-- MISSIONEN -->
    <div id="missionsTab" class="tab">
      <div class="panel">
        <h2>Missionen</h2>
        <div id="missionList"></div>
      </div>
    </div>

    <!-- KLASSEN-BELOHNUNG -->
    <div id="classRewardTab" class="tab hidden">
      <div class="panel">
        <h2>Klassen-Belohnung</h2>
        <div id="rewardCarouselContainer"></div>
      </div>
    </div>

    <!-- PROFIL -->
    <div id="profileTab" class="tab hidden">
      <div class="panel">
        <h2>Mein Profil</h2>
        <div id="profileInfo">–</div>
      </div>

      <div class="panel">
        <h3>Dein Level</h3>
        <div id="levelInfo">–</div>
      </div>

      <div class="panel">
        <h3>Deine Klassen-Infos</h3>
        <div id="classInfo">–</div>
      </div>
    </div>

  </div>
</div>

<script>
/* ============================================
   LOADER CONTROL
============================================ */
let loaderHidden = false;

function hideLoader() {
  if (loaderHidden) return;
  loaderHidden = true;
  const overlay = document.getElementById("loadingOverlay");
  if (!overlay) return;
  overlay.classList.add("hide");
  setTimeout(() => overlay.style.display = "none", 2000);
}

window.addEventListener("load", () => {
  setTimeout(hideLoader, 11000); /* robust fallback */
});

    .vote-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      margin-top: 4px;
    }

    .vote-badge-me {
      background: rgba(34,197,94,0.15);
      border: 1px solid #22c55e;
      color: #bbf7d0;
    }

    .vote-badge-active {
      background: rgba(250,204,21,0.15);
      border: 1px solid #facc15;
      color: #fef9c3;
    }

    /* ============================================
       PROFILE / LEVEL
    ============================================ */
    .level-step-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .level-step {
      width: 62px;
      height: 11px;
      background: #020617;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      overflow: hidden;
    }

    .level-step-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15);
      width: 0%;
      transition: width 0.35s ease;
    }

    .level-step-star {
      font-size: 18px;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250,204,21,0.95);
    }

    .xp-log-entry {
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(148,163,184,0.4);
    }

    .xp-log-entry b {
      color: #facc15;
    }
  </style>
</head>

<body>
  <!-- LOADER -->
  <div id="loadingOverlay">
    <div class="loading-content">
      <!-- Passe den Bildnamen an -->
      <img src="student_startbild.jpg" alt="Streets of Logic Loading" class="loading-image">
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-orb"></div>
      <div>
        <h2 class="sidebar-title">STREETS OF LOGIC</h2>
        <div class="sidebar-subtitle">XP EDITION</div>
      </div>
    </div>

    <div class="nav-item active" onclick="showTab('missionsTab', event)">
      <svg viewBox="0 0 24 24"><path d="M3 3v18l9-4 9 4V3H3z"/></svg>
      <span>Missionen</span>
    </div>

    <div class="nav-item" onclick="showTab('classRewardTab', event)">
      <svg viewBox="0 0 24 24"><path d="M4 20h3v-7H4v7zm6 0h3V4h-3v16zm6 0h3v-4h-3v4z"/></svg>
      <span>Klassen-Belohnung</span>
    </div>

    <div class="nav-item" onclick="showTab('profileTab', event)">
      <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 110 10 5 5 0 010-10zM12 14c-3.3 0-7 1.7-7 4.5V20h14v-1.5C19 15.7 15.3 14 12 14z"/></svg>
      <span>Profil & XP</span>
    </div>

    <div class="nav-item logout" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3h9zm3-10H9v2h10v14H9v2h10c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
      <span>Logout</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="content-inner">
      <h1>STREETS OF LOGIC</h1>
      <div class="page-subtitle">XP EDITION – STUDENT DASHBOARD</div>

      <!-- MISSIONEN -->
      <div id="missionsTab" class="tab">
        <div class="panel">
          <h2>Missionen</h2>
          <div class="hint">Wähle eine Mission, lies die Beschreibung und lade deinen „Beweis“ hoch, wenn ein Upload nötig ist.</div>
          <div id="missionList" class="mission-list"></div>
        </div>
      </div>

      <!-- KLASSEN-BELOHNUNG -->
      <div id="classRewardTab" class="tab hidden">
        <div class="panel">
          <h2>Klassen-Belohnung & Fortschritt</h2>
          <div id="classSummary" class="hint">–</div>
          <div id="rewardCarouselContainer" style="margin-top:10px;"></div>
        </div>
      </div>

      <!-- PROFIL & XP -->
      <div id="profileTab" class="tab hidden">
        <div class="panel">
          <h2>Mein Profil</h2>
          <div id="profileInfo">–</div>
        </div>

        <div class="panel">
          <h3>Level-Fortschritt</h3>
          <div id="levelInfo">–</div>
        </div>

        <div class="panel">
          <h3>XP-Historie</h3>
          <div id="xpLog"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ============================================
       LOADER
    ============================================ */
    let loaderHidden = false;
    function hideLoader() {
      if (loaderHidden) return;
      loaderHidden = true;
      const overlay = document.getElementById("loadingOverlay");
      if (!overlay) return;
      overlay.classList.add("hide");
      setTimeout(() => {
        overlay.style.display = "none";
      }, 2000);
    }

    window.addEventListener("load", () => {
      // harter Fallback – falls irgendwas hängt
      setTimeout(hideLoader, 11000);
    });

    /* ============================================
       TAB-STEUERUNG
    ============================================ */
    function showTab(id, ev) {
      document.querySelectorAll(".tab").forEach(t => t.classList.add("hidden"));
      const tab = document.getElementById(id);
      if (tab) tab.classList.remove("hidden");

      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      if (ev && ev.currentTarget && !ev.currentTarget.classList.contains("logout")) {
        ev.currentTarget.classList.add("active");
      }

      if (id === "missionsTab") loadMissions();
      if (id === "classRewardTab") loadClassProgress();
      if (id === "profileTab") loadProfile();
    }

    /* ============================================
       LOGOUT
    ============================================ */
    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      location.href = "/login.html";
    }

    /* ============================================
       STUDENT / PROFIL / XP
    ============================================ */
    let xpPerMission = {};
    let cachedStudentData = null;

    async function loadProfile() {
      if (!cachedStudentData) {
        await loadStudentBase();
      }
      const data = cachedStudentData;
      if (!data) return;

      const u = data.user;

      // Profil-Infos
      const profileDiv = document.getElementById("profileInfo");
      profileDiv.innerHTML = `
        <div style="font-size:14px;line-height:1.6;">
          <b>Name:</b> ${u.name}<br>
          <b>XP gesamt:</b> ${u.xp}<br>
          <b>Level:</b> ${u.level_name || "–"} (ab ${u.level_min_xp ?? 0} XP)
        </div>
      `;

      // XP-Log
      const xpDiv = document.getElementById("xpLog");
      xpDiv.innerHTML = "";
      data.xp_log.forEach(entry => {
        const d = new Date(entry.created_at).toLocaleString("de-DE");
        xpDiv.innerHTML += `
          <div class="xp-log-entry">
            <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source || "XP"}<br>
            <span style="opacity:0.7;">${d}</span>
          </div>
        `;
      });

      // Level-Leiste
      renderLevelBar(data.levels, u.xp);
    }

    async function loadStudentBase() {
      const r = await fetch("/api/student/me");
      const data = await r.json();
      cachedStudentData = data;

      xpPerMission = data.xp_per_mission || {};

      // sobald die Basisdaten da sind, Loader ausblenden
      hideLoader();
    }

    function renderLevelBar(levels, xp) {
      if (!levels || !levels.length) {
        document.getElementById("levelInfo").textContent = "Keine Level angelegt.";
        return;
      }

      let html = `<div style="font-size:13px;">Dein aktuelles XP: <b>${xp}</b></div>`;
      html += `<div class="level-step-container">`;

      for (let i = 0; i < levels.length; i++) {
        if (i > 0) html += `<div class="level-step-star">★</div>`;

        const min = levels[i].min_xp;
        const next = levels[i + 1]?.min_xp || min + 1;
        let pct = 0;
        if (xp >= min) {
          pct = Math.min(100, ((xp - min) / (next - min)) * 100);
        }

        html += `
          <div class="level-step">
            <div class="level-step-fill" style="width:${pct}%;"></div>
          </div>
        `;
      }

      html += `</div>`;
      document.getElementById("levelInfo").innerHTML = html;
    }

    /* ============================================
       MISSIONEN
    ============================================ */
    async function loadMissions() {
      // sicherstellen, dass Basisdaten da sind
      if (!cachedStudentData) {
        await loadStudentBase();
      }

      const r = await fetch("/api/student/missions");
      const missions = await r.json();
      const container = document.getElementById("missionList");
      container.innerHTML = "";

      if (!missions.length) {
        container.innerHTML = "<i>Aktuell sind keine Missionen angelegt.</i>";
        return;
      }

      missions.forEach(m => {
        const already = xpPerMission[m.id] || 0;
        const card = document.createElement("div");
        card.className = "mission-card";

        card.innerHTML = `
          ${m.image_url ? `<img src="${m.image_url}" class="mission-img">` : ""}
          <div class="mission-title">${m.name}</div>
          <div><b>${m.xp} XP</b></div>
          <div style="font-size:11px;opacity:0.8;margin-top:2px;">
            Bisher erhalten: <b>${already} XP</b>
          </div>
          ${m.require_upload ? `<div class="tag-upload">Upload nötig</div>` : ""}
          ${
            m.require_upload
              ? `
              <div class="file-upload">
                <input type="file" id="upload_${m.id}" class="file-input" onchange="updateFileLabel(${m.id})">
                <label for="upload_${m.id}" class="file-label">Beweis hochladen</label>
                <span id="file-name-${m.id}" class="file-name">Keine Datei ausgewählt</span>
                <button class="btn-primary" onclick="uploadMission(${m.id})">Upload senden</button>
              </div>
            `
              : ""
          }
        `;
        container.appendChild(card);
      });
    }

    function updateFileLabel(id) {
      const input = document.getElementById(`upload_${id}`);
      const span = document.getElementById(`file-name-${id}`);
      if (!input || !span) return;
      span.textContent = input.files.length ? input.files[0].name : "Keine Datei ausgewählt";
    }

    async function uploadMission(id) {
      const input = document.getElementById(`upload_${id}`);
      if (!input || !input.files.length) {
        alert("Bitte zuerst eine Datei auswählen.");
        return;
      }

      const form = new FormData();
      form.append("image", input.files[0]);
      form.append("missionId", id);

      const r = await fetch("/api/student/uploadForMission", {
        method: "POST",
        body: form
      });

      const data = await r.json();
      if (data.success) {
        alert("Upload erfolgreich!");
        // XP / Uploads neu ziehen
        cachedStudentData = null;
        await loadStudentBase();
        await loadMissions();
      } else {
        alert("Upload fehlgeschlagen.");
      }
    }

    /* ============================================
       KLASSEN-FORTSCHRITT & BELOHNUNG
       Erwartete API:
       GET  /api/student/class-progress
         -> {
              className, classXp, studentCount,
              rewards: [ {id,name,xp,image_url,votes}, ... ],
              activeRewardId, canVote, myVoteRewardId, totalVotes
            }
       POST /api/student/class-vote { rewardId }
    ============================================ */
    let classProgressCache = null;
    let currentRewardIndex = 0;

    async function loadClassProgress() {
      const r = await fetch("/api/student/class-progress");
      const data = await r.json();
      classProgressCache = data;

      const summary = document.getElementById("classSummary");
      summary.innerHTML = `
        <b>Klasse:</b> ${data.className || "–"}<br>
        <b>Gesamt-XP der Klasse:</b> ${data.classXp ?? 0}<br>
        <b>Anzahl Schüler:innen:</b> ${data.studentCount ?? "–"}
      `;

      renderRewardCarousel();
    }

    function renderRewardCarousel() {
      const container = document.getElementById("rewardCarouselContainer");
      container.innerHTML = "";

      const data = classProgressCache;
      if (!data || !data.rewards || !data.rewards.length) {
        container.innerHTML = "<i>Es sind noch keine Klassen-Belohnungen angelegt.</i>";
        return;
      }

      const rewards = data.rewards;
      if (currentRewardIndex >= rewards.length) currentRewardIndex = 0;

      const r = rewards[currentRewardIndex];

      const pct = r.xp > 0 ? Math.min(100, (data.classXp / r.xp) * 100) : 0;

      let voteText = "";
      if (typeof r.votes === "number") {
        voteText = `${r.votes} Stimmen`;
      }

      let badges = "";
      if (data.activeRewardId === r.id) {
        badges += `<span class="vote-badge vote-badge-active">Aktive Klassenziel-Belohnung</span>`;
      }
      if (data.myVoteRewardId === r.id) {
        badges += `<span class="vote-badge vote-badge-me">Deine Stimme</span>`;
      }

      const canVote = !!data.canVote;
      const isMyVote = data.myVoteRewardId === r.id;

      let voteBtnLabel = "Für diese Belohnung stimmen";
      let voteBtnDisabled = !canVote;
      if (!canVote && data.activeRewardId) {
        voteBtnLabel = "Abstimmung beendet";
      } else if (isMyVote) {
        voteBtnLabel = "Du hast hier schon gestimmt";
        voteBtnDisabled = true;
      }

      const totalVotesInfo = typeof data.totalVotes === "number"
        ? `<div style="font-size:11px;opacity:0.8;margin-top:2px;">Gesamt-Stimmen: ${data.totalVotes}</div>`
        : "";

      container.innerHTML = `
        <div class="carousel-wrapper">
          <span class="carousel-arrow" onclick="prevReward()">&#10094;</span>
          <div class="reward-card">
            ${r.image_url ? `<img src="${r.image_url}" class="reward-img">` : ""}
            <div class="reward-title">${r.name}</div>
            <div style="font-size:13px;margin-top:2px;">
              Benötigte Klassen-XP: <b>${r.xp}</b>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${pct}%;"></div>
            </div>
            <div class="vote-info">
              Fortschritt: <b>${Math.floor(pct)}%</b><br>
              ${voteText}
              ${totalVotesInfo}
            </div>
            <div style="margin-top:6px;">
              <button class="btn-primary" onclick="voteForReward(${r.id})" ${voteBtnDisabled ? "disabled" : ""}>
                ${voteBtnLabel}
              </button>
            </div>
            <div style="margin-top:6px;">
              ${badges}
            </div>
          </div>
          <span class="carousel-arrow" onclick="nextReward()">&#10095;</span>
        </div>
        <div class="dot-container">
          ${rewards.map((_,i)=>`
            <div class="dot ${i===currentRewardIndex ? "active":""}" onclick="jumpReward(${i})"></div>
          `).join("")}
        </div>
      `;
    }

    function nextReward() {
      if (!classProgressCache || !classProgressCache.rewards) return;
      currentRewardIndex = (currentRewardIndex + 1) % classProgressCache.rewards.length;
      renderRewardCarousel();
    }

    function prevReward() {
      if (!classProgressCache || !classProgressCache.rewards) return;
      currentRewardIndex = (currentRewardIndex - 1 + classProgressCache.rewards.length) % classProgressCache.rewards.length;
      renderRewardCarousel();
    }

    function jumpReward(idx) {
      if (!classProgressCache || !classProgressCache.rewards) return;
      currentRewardIndex = idx;
      renderRewardCarousel();
    }

    async function voteForReward(rewardId) {
      try {
        const r = await fetch("/api/student/class-vote", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ rewardId })
        });
        const data = await r.json();
        if (!data.success) {
          alert(data.message || "Fehler bei der Abstimmung.");
          return;
        }
        // Nach Abstimmung neu laden
        await loadClassProgress();
        alert("Deine Stimme wurde gezählt.");
      } catch (err) {
        console.error(err);
        alert("Technischer Fehler bei der Abstimmung.");
      }
    }

    /* ============================================
       INIT
    ============================================ */
    (async function init() {
      // Basisdaten holen (XP, Level, etc.)
      await loadStudentBase();
      // Standard-Tab Missionen füllen
      await loadMissions();
      // Loader ausblenden, falls noch sichtbar
      hideLoader();
    })();
  </script>
</body>
</html>
