<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Temple of Logic – Student Dashboard</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0d0f18 0%, #111423 100%);
        color: #d1d5db;
        overflow-x: hidden;
    }

    /* Container */
    .container {
        width: 100%;
        max-width: 680px;
        margin: 40px auto;
        text-align: center;
        padding-bottom: 80px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #8ab4ff;
        letter-spacing: 1px;
    }

    /* Charakterbild */
    .character-img {
        width: 220px;
        height: 220px;
        object-fit: contain;
        border-radius: 12px;
        margin-top: 10px;
        box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
    }

    /* XP-Anzeige */
    .xp-box {
        margin-top: 25px;
        font-size: 28px;
        font-weight: bold;
        color: #90eeff;
        text-shadow: 0 0 8px #0099ff;
    }

    /* Fortschrittsbalken */
    .xp-bar-container {
        width: 90%;
        height: 22px;
        margin: 15px auto;
        border-radius: 12px;
        background: #1c2234;
        overflow: hidden;
        border: 1px solid #2f3958;
    }

    .xp-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00b7ff, #4bd6ff);
        box-shadow: 0 0 12px rgba(0, 180, 255, 0.6);
        transition: width 1s ease;
    }

    /* Traits & Items */
    .section-title {
        margin-top: 35px;
        font-size: 22px;
        color: #77c8ff;
        text-shadow: 0 0 6px #0077cc;
    }

    .list-box {
        margin-top: 10px;
        background: #161b28;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #2c344a;
        box-shadow: 0 0 10px rgba(0,0,0,0.4);
        text-align: left;
        width: 90%;
        margin-left: auto;
        margin-right: auto;
    }

    .list-item {
        margin: 6px 0;
        font-size: 17px;
        color: #d7eaff;
    }

    /* Logout Button */
    .logout-button {
        position: fixed;
        top: 18px;
        right: 18px;
        background: rgba(255, 50, 50, 0.15);
        color: #ff4a4a;
        padding: 10px 18px;
        border: 1px solid rgba(255, 80, 80, 0.6);
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s ease;
        backdrop-filter: blur(6px);
        z-index: 2000;
    }

    .logout-button:hover {
        background: rgba(255, 80, 80, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    /* Goodbye Overlay */
    #goodbyeOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000cc;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-size: 38px;
        letter-spacing: 2px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
        backdrop-filter: blur(8px);
        z-index: 9999;
    }
</style>
</head>

<body>

<!-- Logout -->
<button id="logoutBtn" class="logout-button">Logout</button>

<!-- Goodbye Overlay -->
<div id="goodbyeOverlay">Auf Wiedersehen!</div>

<div class="container">
    <h1>Dein Charakter</h1>

    <img id="characterImg" class="character-img" src="" alt="Charakter" />

    <div class="xp-box">
        XP: <span id="xpValue">0</span>
    </div>

    <div class="xp-bar-container">
        <div class="xp-bar" id="xpBar"></div>
    </div>

    <h2 class="section-title">Eigenschaften</h2>
    <div class="list-box" id="traitsBox"></div>

    <h2 class="section-title">Ausrüstung</h2>
    <div class="list-box" id="itemsBox"></div>
</div>

<script>
async function loadStudent() {
    const r = await fetch("/api/student/firstLogin", { method: "POST" });
    const data = await r.json();

    console.log("Student-Daten:", data);

    document.getElementById("xpValue").textContent = data.xp;

    /* Charakter anzeigen */
    if (data.character && data.character.image_url) {
        document.getElementById("characterImg").src = data.character.image_url;
    }

    // Traits anzeigen
    const traitsBox = document.getElementById("traitsBox");
    traitsBox.innerHTML = "";
    data.traits.forEach(t => {
        const div = document.createElement("div");
        div.className = "list-item";
        div.textContent = "• " + t;
        traitsBox.appendChild(div);
    });

    // Items anzeigen
    const itemsBox = document.getElementById("itemsBox");
    itemsBox.innerHTML = "";
    data.items.forEach(i => {
        const div = document.createElement("div");
        div.className = "list-item";
        div.textContent = "• " + i;
        itemsBox.appendChild(div);
    });

    // XP-Balken animieren
    const bar = document.getElementById("xpBar");
    const lvl = data.level;

    const currentXP = data.xp;
    const minXP = lvl.min_xp || 0;
    const nextXP = lvl.next_min_xp || (minXP + 100);

    const progress = Math.min(100, ((currentXP - minXP) / (nextXP - minXP)) * 100);
    bar.style.width = progress + "%";
}

loadStudent();


// Logout + Fade-Out
document.getElementById("logoutBtn").addEventListener("click", async () => {
    const overlay = document.getElementById("goodbyeOverlay");
    overlay.style.opacity = "1";
    overlay.style.pointerEvents = "auto";

    await new Promise(res => setTimeout(res, 700));

    await fetch("/api/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" }
    });

    window.location.href = "/login.html";
});
</script>

</body>
</html>
