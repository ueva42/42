<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>
  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(168,85,247,0.3), transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,0.25), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30,64,175,0.45), transparent 60%),
        #020308;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid #4c1d95;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }

    .logout-btn {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      border: none;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #3f2d7c;
      padding-bottom: 6px;
      color: #c4b5fd;
    }

    .card {
      background: radial-gradient(circle at top left, #1e1b4b 0, #020617 60%);
      border: 1px solid #312e81;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
    }

    /* Charakterbild */
    .char-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      display: block;
      margin: 0 auto 10px;
      border-radius: 12px;
    }

    /* Levelbalken */
    .level-bar-wrapper {
      width: 100%;
      height: 18px;
      background: #1b1537;
      border-radius: 10px;
      border: 1px solid #4c1d95;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }
    .level-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .level-star {
      position: absolute;
      right: -14px;
      top: -6px;
      font-size: 24px;
      color: gold;
    }

    /* KARUSSELL */
    .carousel-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin-top: 20px;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s ease;
    }

    .mission-slide {
      min-width: 100%;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
    }

    .mission-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #4c1d95;
      margin: 0 auto 10px;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.4);
      border: 1px solid #6d28d9;
      color: white;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    .carousel-btn-left { left: 10px; }
    .carousel-btn-right { right: 10px; }

    /* PAGINATION DOTS */
    .dots {
      text-align: center;
      margin-top: 10px;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 4px;
      background: #4c1d95;
      border-radius: 50%;
      opacity: 0.4;
      transition: 0.2s;
    }
    .dot.active {
      background: #a78bfa;
      opacity: 1;
      transform: scale(1.3);
    }

    /* Upload */
    .upload-input {
      margin-top: 10px;
      margin-bottom: 10px;
      width: 240px;
    }

  </style>
</head>
<body>

<header>
  <h1>TEMPLE OF LOGIC – Schülerbereich</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- USER OVERVIEW -->
  <h2>Dein Status</h2>
  <div class="card" id="userCard"></div>

  <!-- CHARAKTER -->
  <h2>Dein Charakter</h2>
  <div class="card" id="characterCard"></div>

  <!-- TRAITS & ITEMS -->
  <h2>Eigenschaften & Items</h2>
  <div class="card" id="traitsItemsCard"></div>

  <!-- MISSION-KARUSSELL -->
  <h2>Missionen</h2>
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="carousel-btn carousel-btn-left" onclick="prevSlide()">❮</div>
    <div class="carousel-btn carousel-btn-right" onclick="nextSlide()">❯</div>
  </div>
  <div class="dots" id="dots"></div>

  <!-- XP LOG -->
  <h2>Deine XP-History</h2>
  <div id="xpLog"></div>

  <!-- UPLOADS -->
  <h2>Deine Uploads</h2>
  <div class="upload-grid" id="uploadGrid"></div>

</div>

<script>

let missions = [];
let currentSlide = 0;

async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();

  const u = data.user;

  /* ---------------- CHARACTER ---------------- */
  document.getElementById("characterCard").innerHTML = `
    ${data.character ? `
      <img class="char-img" src="${data.character.image_url}">
      <div style="text-align:center;font-size:18px;margin-top:6px;">
        ${data.character.name}
      </div>
    ` : "Noch kein Charakter gewählt."}

    <!-- Levelbalken -->
    <div class="level-bar-wrapper">
      <div class="level-bar-fill" id="levelFill"></div>
      <div class="level-star">★</div>
    </div>
  `;

  /* -------- LEVEL FILL CALCULATION -------- */
  const levels = data.levels;
  let current = u.level_id;
  let nextIndex = levels.findIndex(l => l.id === current) + 1;
  if (nextIndex >= levels.length) nextIndex = levels.length - 1;

  const currXP = u.xp;
  const minCurr = levels.find(l => l.id === current)?.min_xp || 0;
  const minNext = levels[nextIndex]?.min_xp || minCurr;

  let pct = ((currXP - minCurr) / (minNext - minCurr)) * 100;
  if (pct < 0) pct = 0;
  if (pct > 100) pct = 100;

  document.getElementById("levelFill").style.width = pct + "%";

  /* USER CARD */
  document.getElementById("userCard").innerHTML = `
    <b>Name:</b> ${u.name}<br>
    <b>XP:</b> ${u.xp}<br>
    <b>Level:</b> ${u.level_name} (ab ${u.level_min_xp} XP)
  `;

  /* TRAITS + ITEMS */
  document.getElementById("traitsItemsCard").innerHTML = `
    <b>Eigenschaften:</b><br>
    ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
    <b>Items:</b><br>
    ${data.items.map(i => "• " + i).join("<br>")}
  `;

  /* XP LOG */
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div class="xp-log-entry">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source}
        <br><span style="opacity:0.7;">${d}</span>
      </div>`;
  });

  /* UPLOADS */
  const up = document.getElementById("uploadGrid");
  up.innerHTML = "";
  data.uploads.forEach(upl => {
    up.innerHTML += `
      <div class="upload-card">
        <img src="${upl.image_url}" style="width:100%;height:140px;object-fit:cover;border-radius:8px;">
        <div style="font-size:12px;opacity:0.8;">${upl.mission_name || "—"}</div>
      </div>
    `;
  });

}

async function loadMissions() {
  const r = await fetch("/api/student/missions");
  missions = await r.json();

  const track = document.getElementById("carouselTrack");
  const dots = document.getElementById("dots");

  track.innerHTML = "";
  dots.innerHTML = "";

  missions.forEach((m, index) => {

    track.innerHTML += `
      <div class="mission-slide">
        ${m.image_url && m.image_url !== "null" ? 
          `<img class="mission-img" src="${m.image_url}">`
          :
          `<div style="width:240px;height:400px;background:#1e1b4b;border-radius:12px;display:flex;align-items:center;justify-content:center;opacity:0.6;margin:0 auto;">
             Kein Bild
           </div>`
        }

        <h3 style="margin:10px 0 6px;">${m.name}</h3>
        <div><b>${m.xp} XP</b></div>
        <div id="earned_${m.id}" style="opacity:0.8;font-size:13px;margin-top:3px;"></div>

        ${m.require_upload ? `
          <input class="upload-input" type="file" id="upload_${m.id}">
          <button class="action" onclick="uploadMission(${m.id})">Upload senden</button>
        ` : ""}
      </div>
    `;

    dots.innerHTML += `<span class="dot" onclick="goToSlide(${index})"></span>`;
  });

  updateCarousel();
}

function updateCarousel() {
  const track = document.getElementById("carouselTrack");
  track.style.transform = `translateX(-${currentSlide * 100}%)`;

  document.querySelectorAll(".dot").forEach((d, i) => {
    d.classList.toggle("active", i === currentSlide);
  });
}

function nextSlide() {
  if (currentSlide < missions.length - 1) currentSlide++;
  updateCarousel();
}
function prevSlide() {
  if (currentSlide > 0) currentSlide--;
  updateCarousel();
}
function goToSlide(i) {
  currentSlide = i;
  updateCarousel();
}

async function uploadMission(missionId) {
  const fileInput = document.getElementById(`upload_${missionId}`);
  if (!fileInput.files.length) return alert("Bitte ein Bild auswählen!");

  const form = new FormData();
  form.append("image", fileInput.files[0]);
  form.append("missionId", missionId);

  const r = await fetch("/api/student/uploadForMission", {
    method: "POST",
    body: form
  });

  const data = await r.json();
  if (data.success) {
    alert("Upload erfolgreich!");
    loadMe();
  } else {
    alert("Upload fehlgeschlagen.");
  }
}

/* INIT */
loadMe();
loadMissions();

</script>

</body>
</html>
