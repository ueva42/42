<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Student – Temple of Logic</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(168,85,247,0.25) 0, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,0.25) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30,64,175,0.45) 0, transparent 60%),
        #020308;
      color: #eee;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      padding: 15px;
    }

    #logoutBtn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 8px 16px;
      border: none;
      border-radius: 999px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    #logoutBtn:hover {
      opacity: 0.85;
    }

    #fadeout {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      z-index: 1000;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    #avatar {
      width: 220px;
      height: 220px;
      border-radius: 18px;
      object-fit: cover;
      border: 3px solid #4f46e5;
      box-shadow: 0 0 20px rgba(99,102,241,0.7);
      margin-bottom: 15px;
    }

    .xp-bar-container {
      width: 100%;
      background: #111827;
      border-radius: 20px;
      margin-top: 15px;
      height: 28px;
      overflow: hidden;
      border: 1px solid #374151;
    }

    .xp-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      transition: width 1.2s ease;
    }

    .traits, .items {
      margin-top: 10px;
      background: rgba(15,23,42,0.7);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: left;
    }

    h2 {
      margin: 20px 0 10px 0;
      text-align: left;
    }

    /* ===================== MISSION-LISTE ===================== */
    .mission-list {
      background: rgba(15,23,42,0.7);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: left;
    }

    /* ===================== KARUSSELL ===================== */
    .carousel {
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .carousel-arrow {
      font-size: 28px;
      cursor: pointer;
      padding: 10px;
      user-select: none;
      color: #a78bfa;
    }

    .carousel-item {
      width: 260px;
      background: rgba(15,23,42,0.8);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid #4c1d95;
      text-align: center;
    }

    .carousel-item img {
      width: 240px;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 8px;
      border: 2px solid #4c1d95;
    }

    .upload-gallery {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .upload-thumb {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #6b7280;
    }

    .upload-btn {
      margin-top: 8px;
      padding: 6px 12px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white;
      cursor: pointer;
      font-size: 12px;
    }

  </style>
</head>
<body>

<div id="fadeout"></div>

<div class="topbar">
  <button id="logoutBtn" onclick="logout()">Logout</button>
</div>

<div class="container">

  <img id="avatar" src="" alt="Avatar">

  <h1 id="studentName"></h1>
  <h3 id="studentLevel"></h3>
  <p id="studentXP"></p>

  <div class="xp-bar-container">
    <div class="xp-bar-fill" id="xpFill"></div>
  </div>

  <h2>Eigenschaften</h2>
  <div class="traits" id="traitsBox"></div>

  <h2>Ausrüstung</h2>
  <div class="items" id="itemsBox"></div>

  <h2>Erhaltene Missionen</h2>
  <div class="mission-list" id="missionList"></div>

  <h2>Missionen</h2>
  <div class="carousel">
    <div class="carousel-arrow" onclick="prevMission()">❮</div>
    <div class="carousel-item" id="missionCarousel"></div>
    <div class="carousel-arrow" onclick="nextMission()">❯</div>
  </div>

</div>


<script>
let missions = [];
let uploads = [];
let currentIndex = 0;
let studentId = null;

/* ===================== INIT ===================== */
loadStudent();

async function loadStudent() {
  const r = await fetch("/api/me");
  const me = await r.json();

  studentId = me.id;

  document.getElementById("studentName").textContent = me.name;
  document.getElementById("avatar").src = me.avatar_url || "/default-avatar.png";

  document.getElementById("studentXP").textContent = `${me.xp} XP`;
  document.getElementById("studentLevel").textContent = me.level_name || "Level 1";

  // XP-Balken berechnen
  const r2 = await fetch("/api/levels");
  const levels = await r2.json();

  let next = levels.find(l => l.min_xp > me.xp);
  let current = [...levels].reverse().find(l => me.xp >= l.min_xp);

  let min = current ? current.min_xp : 0;
  let max = next ? next.min_xp : min + 100;

  let pct = ((me.xp - min) / (max - min)) * 100;
  pct = Math.max(3, Math.min(pct, 100));

  document.getElementById("xpFill").style.width = pct + "%";

  // Eigenschaften
  if (me.traits && me.traits.length) {
    document.getElementById("traitsBox").innerHTML =
      me.traits.map(t => "• " + t).join("<br>");
  }

  // Ausrüstung
  if (me.items && me.items.length) {
    document.getElementById("itemsBox").innerHTML =
      me.items.map(i => "• " + i).join("<br>");
  }

  loadReceivedMissions();
  loadMissions();
}


/* ===================== ERHALTENE MISSIONEN ===================== */
async function loadReceivedMissions() {
  const r = await fetch(`/api/student/${studentId}/received`);
  const data = await r.json();

  document.getElementById("missionList").innerHTML =
    data.length
      ? data.map(m => `• ${m.name} – +${m.xp} XP`).join("<br>")
      : "<i>Noch keine Missionen erhalten.</i>";
}


/* ===================== MISSION-KARUSSELL ===================== */
async function loadMissions() {
  const r1 = await fetch("/api/missions");
  missions = await r1.json();

  const r2 = await fetch(`/api/uploads/${studentId}`);
  uploads = await r2.json();

  showMission();
}

function showMission() {
  if (!missions.length) return;

  const m = missions[currentIndex];
  const box = document.getElementById("missionCarousel");

  const missionUploads = uploads.filter(u => u.mission_id === m.id);

  box.innerHTML = `
    <h3>${m.name}</h3>
    ${m.image_url ? `<img src="${m.image_url}">` : "<div style='height:180px;'>—</div>"}
    <p>${m.xp} XP</p>
    ${m.require_upload
      ? `<input type="file" id="fileUp"><br>
         <button class="upload-btn" onclick="uploadForMission(${m.id})">Hochladen</button>`
      : `<p><i>Kein Upload nötig</i></p>`
    }
    <div class="upload-gallery">
      ${missionUploads.map(u =>
        `<img class="upload-thumb" src="${u.image_url}">`
      ).join("")}
    </div>
  `;
}

function nextMission() {
  currentIndex = (currentIndex + 1) % missions.length;
  showMission();
}

function prevMission() {
  currentIndex = (currentIndex - 1 + missions.length) % missions.length;
  showMission();
}


/* ===================== UPLOAD ===================== */
async function uploadForMission(missionId) {
  const file = document.getElementById("fileUp").files[0];
  if (!file) return alert("Bitte Datei auswählen.");

  const form = new FormData();
  form.append("image", file);
  form.append("missionId", missionId);

  await fetch(`/api/upload/${studentId}`, { method: "POST", body: form });

  loadMissions();
}


/* ===================== LOGOUT mit FADEOUT ===================== */
async function logout() {
  document.getElementById("fadeout").style.opacity = 1;
  await new Promise(res => setTimeout(res, 700));

  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

</script>

</body>
</html>
