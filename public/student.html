<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>
  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(168,85,247,0.3) 0, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,0.25) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30,64,175,0.45) 0, transparent 60%),
        #020308;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid #4c1d95;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }

    .logout-btn {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      border: none;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #3f2d7c;
      padding-bottom: 6px;
      color: #c4b5fd;
    }

    .card {
      background: radial-gradient(circle at top left, #1e1b4b 0, #020617 60%);
      border: 1px solid #312e81;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .char-img {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #4c1d95;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }

    .character-option {
      background: #111026;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2d2254;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .character-option:hover {
      border-color: #8b5cf6;
      transform: translateY(-2px);
    }

    textarea, input[type=file], select {
      width: 100%;
      background: #0f1022;
      color: #eee;
      border: 1px solid #2d2450;
      padding: 8px;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    button.action {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      padding: 8px 14px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .mission-card {
      background: radial-gradient(circle at top, #1e1b4b 0, #111827 70%);
      border-radius: 10px;
      border: 1px solid #312e81;
      padding: 12px;
      margin-bottom: 12px;
    }

    .mission-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #4c1d95;
      margin-bottom: 8px;
    }

    .xp-log-entry {
      padding: 8px;
      border-bottom: 1px solid #3c2d69;
      font-size: 14px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .upload-card {
      background: #111026;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2d2254;
    }

    .upload-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }

  </style>
</head>
<body>

<header>
  <h1>TEMPLE OF LOGIC – Schülerbereich</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- USER OVERVIEW -->
  <h2>Dein Status</h2>
  <div class="card" id="userCard"></div>

  <!-- CHARAKTER -->
  <h2>Dein Charakter</h2>
  <div class="card">
    <div id="characterInfo"></div>
    <h3>Charakter wählen / ändern</h3>
    <div class="character-grid" id="characterSelect"></div>
  </div>

  <!-- TRAITS & ITEMS -->
  <h2>Eigenschaften & Items</h2>
  <div class="card" id="traitsItemsCard"></div>

  <!-- MISSIONEN -->
  <h2>Missionen</h2>
  <div id="missionList"></div>

  <!-- XP LOG -->
  <h2>Deine XP-History</h2>
  <div id="xpLog"></div>

  <!-- UPLOADS -->
  <h2>Deine Uploads</h2>
  <div class="upload-grid" id="uploadGrid"></div>

</div>

<script>
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();

  const u = data.user;

  // USER CARD
  document.getElementById("userCard").innerHTML = `
    <b>Name:</b> ${u.name}<br>
    <b>XP:</b> ${u.xp}<br>
    <b>Level:</b> ${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)
  `;

  // CHARACTER
  document.getElementById("characterInfo").innerHTML = data.character
    ? `<img class="char-img" src="${data.character.image_url}"><br>${data.character.name}`
    : "Noch kein Charakter gewählt.";

  // TRAITS + ITEMS
  document.getElementById("traitsItemsCard").innerHTML = `
    <b>Eigenschaften:</b><br>
    ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
    <b>Items:</b><br>
    ${data.items.map(i => "• " + i).join("<br>")}
  `;

  // XP LOG
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div class="xp-log-entry">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source} <br>
        <span style="opacity:0.7;">${d}</span>
      </div>`;
  });

  // UPLOAD GRID
  const up = document.getElementById("uploadGrid");
  up.innerHTML = "";
  data.uploads.forEach(upl => {
    up.innerHTML += `
      <div class="upload-card">
        <img src="${upl.image_url}">
        <div style="font-size:12px;opacity:0.8;">${upl.mission_name || "—"}</div>
      </div>
    `;
  });
}

async function loadCharacters() {
  const r = await fetch("/api/character");
  const chars = await r.json();

  const grid = document.getElementById("characterSelect");
  grid.innerHTML = "";

  chars.forEach(c => {
    const div = document.createElement("div");
    div.className = "character-option";
    div.innerHTML = `
      <img src="${c.image_url}" style="width:100%;height:110px;border-radius:6px;object-fit:cover;">
      <div>${c.name}</div>
    `;
    div.addEventListener("click", () => selectCharacter(c.id));
    grid.appendChild(div);
  });
}

async function selectCharacter(id) {
  await fetch("/api/student/selectCharacter", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ characterId: id })
  });
  loadMe();
}

async function loadMissions() {
  const r = await fetch("/api/student/missions");
  const missions = await r.json();

  const list = document.getElementById("missionList");
  list.innerHTML = "";

  missions.forEach(m => {
    const div = document.createElement("div");
    div.className = "mission-card";
    div.innerHTML = `
      ${m.image_url ? `<img class="mission-img" src="${m.image_url}">` : ""}
      <h3>${m.name}</h3>
      <div><b>${m.xp} XP</b></div>
      ${m.require_upload ? `<div style="color:#fca5a5;">📎 Upload erforderlich</div>` : ""}
      <br>
      ${m.require_upload ? `
        <input type="file" id="upload_${m.id}">
        <button class="action" onclick="uploadMission(${m.id})">Upload senden</button>` : ""}
    `;
    list.appendChild(div);
  });
}

async function uploadMission(missionId) {
  const fileInput = document.getElementById(`upload_${missionId}`);
  const file = fileInput.files[0];
  if (!file) return alert("Bitte ein Bild auswählen!");

  const form = new FormData();
  form.append("image", file);
  form.append("missionId", missionId);

  const r = await fetch("/api/student/uploadForMission", {
    method: "POST",
    body: form
  });

  const data = await r.json();
  if (data.success) {
    alert("Upload erfolgreich!");
    loadMe();
  } else {
    alert("Upload fehlgeschlagen.");
  }
}

loadMe();
loadCharacters();
loadMissions();
</script>

</body>
</html>
