<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>

  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(168,85,247,0.3) 0, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,0.25) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(30,64,175,0.45) 0, transparent 60%),
        #020308;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 26px;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid #4c1d95;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }

    .logout-btn {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      border: none;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #3f2d7c;
      padding-bottom: 6px;
      color: #c4b5fd;
    }

    .card {
      background: radial-gradient(circle at top left, #1e1b4b 0, #020617 60%);
      border: 1px solid #312e81;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
    }

    /* GROSSES CHARAKTERBILD */
    #charBig {
      width: 200px;
      height: 350px;
      border-radius: 12px;
      border: 2px solid #6d28d9;
      object-fit: cover;
      margin-bottom: 12px;
    }

    /* MISSION-KARUSSELL */
    .mission-slide {
      min-width: 100%;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
    }

    .mission-slide img {
      width: 200px;
      height: 350px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #4c1d95;
      margin-bottom: 10px;
    }

    button.action {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      padding: 8px 14px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .xp-log-entry {
      padding: 8px;
      border-bottom: 1px solid #3c2d69;
      font-size: 14px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .upload-card {
      background: #111026;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2d2254;
    }

    .upload-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>

</head>
<body>

<header>
  <h1>TEMPLE OF LOGIC – Schülerbereich</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- CHARACTER & XP HEADER -->
  <h2>Dein Charakter & Status</h2>
  <div class="card" style="text-align:center;">
    <img id="charBig" src="">
    <div id="charName" style="font-size:20px;margin-bottom:12px;color:#ddd6fe;font-weight:bold;"></div>

    <div style="margin-top:10px;font-size:16px;">
      <div><b>XP:</b> <span id="xpValue"></span></div>
      <div><b>Level:</b> <span id="levelValue"></span></div>
    </div>
  </div>

  <!-- TRAITS & ITEMS -->
  <h2>Eigenschaften & Items</h2>
  <div class="card" id="traitsItemsCard"></div>

  <!-- MISSION CAROUSEL -->
  <h2>Missionen</h2>
  <div class="card" style="text-align:center;">
    <div id="carouselContainer" style="position:relative;overflow:hidden;">
      <div id="carousel" style="display:flex;transition:0.4s;"></div>

      <button id="prevBtn" class="action"
              style="position:absolute; left:10px; top:45%; z-index:5;">⟨</button>
      <button id="nextBtn" class="action"
              style="position:absolute; right:10px; top:45%; z-index:5;">⟩</button>
    </div>
  </div>

  <!-- XP LOG -->
  <h2>Deine XP-History</h2>
  <div id="xpLog"></div>

  <!-- UPLOAD GRID -->
  <h2>Deine Uploads</h2>
  <div class="upload-grid" id="uploadGrid"></div>

</div>

<script>

/* LOGOUT */
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

/* STUDENT DATEN LADEN */
async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();
  const u = data.user;

  // Charakterbild + Name + XP
  document.getElementById("charBig").src =
    data.character ? data.character.image_url : "";
  document.getElementById("charName").innerText =
    data.character ? data.character.name : "Noch kein Charakter gewählt";

  document.getElementById("xpValue").innerText = u.xp;
  document.getElementById("levelValue").innerText =
    `${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)`;

  // TRAITS & ITEMS
  document.getElementById("traitsItemsCard").innerHTML = `
    <b>Eigenschaften:</b><br>
    ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
    <b>Items:</b><br>
    ${data.items.map(i => "• " + i).join("<br>")}
  `;

  // XP LOG
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div class="xp-log-entry">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source} <br>
        <span style="opacity:0.7;">${d}</span>
      </div>`;
  });

  // Uploads
  const up = document.getElementById("uploadGrid");
  up.innerHTML = "";
  data.uploads.forEach(upl => {
    up.innerHTML += `
      <div class="upload-card">
        <img src="${upl.image_url}">
        <div style="font-size:12px;opacity:0.8;">${upl.mission_name || "—"}</div>
      </div>`;
  });
}

/* MISSIONS-KARUSELL */
let currentSlide = 0;
let missionsGlobal = [];

async function loadMissions() {
  const r = await fetch("/api/student/missions");
  const missions = await r.json();
  missionsGlobal = missions;

  const c = document.getElementById("carousel");
  c.innerHTML = "";

  missions.forEach(m => {
    const slide = document.createElement("div");
    slide.className = "mission-slide";

    slide.innerHTML = `
      ${m.image_url ? `<img src="${m.image_url}">` : ""}
      <h3>${m.name}</h3>
      <div><b>${m.xp} XP</b></div>
      ${m.require_upload ? `<div style="color:#fca5a5;">📎 Upload erforderlich</div>` : ""}
      <br>
      ${
        m.require_upload
          ? `
        <input type="file" id="upload_${m.id}">
        <button class="action" onclick="uploadMission(${m.id})">Upload senden</button>
        `
          : ""
      }
    `;

    c.appendChild(slide);
  });

  updateCarousel();
}

function updateCarousel() {
  const c = document.getElementById("carousel");
  c.style.transform = `translateX(-${currentSlide * 100}%)`;
}

document.getElementById("prevBtn").onclick = () => {
  if (currentSlide > 0) currentSlide--;
  updateCarousel();
};

document.getElementById("nextBtn").onclick = () => {
  if (currentSlide < missionsGlobal.length - 1) currentSlide++;
  updateCarousel();
};

// Swipe
let startX = 0;
let endX = 0;

document.getElementById("carouselContainer").addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.getElementById("carouselContainer").addEventListener("touchend", e => {
  endX = e.changedTouches[0].clientX;
  const diff = endX - startX;

  if (diff > 40 && currentSlide > 0) currentSlide--;
  if (diff < -40 && currentSlide < missionsGlobal.length - 1) currentSlide++;

  updateCarousel();
});

loadMe();
loadMissions();

</script>

</body>
</html>
