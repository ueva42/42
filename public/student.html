<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>

  <style>
    /* ============================================
       GLOBAL BACKGROUND - Arcane Fantasy Library
    ============================================ */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.80)),
        url("library-fantasy-bg.jpg") center/cover no-repeat fixed;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      overflow: hidden;
      transition: margin-left 0.3s ease;
    }

    a { color: inherit; text-decoration: none; }

    /* ============================================
       SIDEBAR (same style as Admin)
    ============================================ */
    .sidebar {
      width: 260px;
      background: rgba(11, 9, 30, 0.92);
      border-right: 1px solid rgba(120, 90, 200, 0.35);
      backdrop-filter: blur(10px);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 20;
    }

    /* Charakterbild statt Orb */
    .sidebar-character {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: rgba(0,0,0,0.6);
      object-fit: cover;
      border: 2px solid #6d28d9;
      box-shadow: 0 0 18px rgba(139,92,246,0.9);
    }

    .menu-item {
      padding: 14px 22px;
      cursor: pointer;
      font-size: 16px;
      border-bottom: 1px solid rgba(160, 160, 255, 0.10);
      transition: 0.2s;
    }

    .menu-item:hover,
    .menu-item.active {
      background: radial-gradient(circle at left, rgba(167,139,250,0.4), rgba(30,27,75,0.9));
    }

    .logout-btn {
      margin: auto 20px 20px 20px;
      padding: 10px 16px;
      font-size: 14px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .logout-btn:hover {
      background: linear-gradient(135deg, #1f2937, #4338ca);
    }

    /* ============================================
       MOBILE HEADER
    ============================================ */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      height: 56px;
      left: 0;
      right: 0;
      background: rgba(10, 10, 35, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(120, 90, 200, 0.35);
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 200;
    }

    .burger {
      width: 26px;
      height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .burger span { height: 3px; background: #e5e7eb; border-radius: 4px; }

    .mobile-title {
      font-size: 16px;
      letter-spacing: 0.12em;
      color: #e5e7eb;
    }

    /* ============================================
       MAIN CONTENT
    ============================================ */
    .main-area {
      flex: 1;
      padding: 30px 40px;
      margin-left: 260px;
      height: 100vh;
      overflow-y: auto;
    }

    h1 {
      margin: 0 0 25px 0;
      font-size: 28px;
      letter-spacing: 0.15em;
      color: #ddd6fe;
    }

    .card {
      background: rgba(10, 10, 35, 0.80);
      padding: 22px;
      border: 1px solid rgba(140, 110, 255, 0.35);
      border-radius: 16px;
      margin-bottom: 30px;
      backdrop-filter: blur(8px);
    }

    h2 {
      margin-top: 0;
      color: #c4b5fd;
      border-bottom: 1px solid #5841a9;
      padding-bottom: 6px;
    }

    /* ============================================
       CHARACTER
    ============================================ */
    .character-wrapper {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-top: 20px;
    }

    .char-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 0 24px rgba(129,140,248,0.8);
    }

    #traitsItemsCard {
      font-size: 16px;
      line-height: 1.55;
      color: #e5e7eb;
      max-width: 420px;
      padding: 4px 0;
    }

    .traits-block,
    .items-block {
      margin-bottom: 26px;
    }

    .traits-block b,
    .items-block b {
      font-size: 18px;
      color: #c4b5fd;
      margin-bottom: 8px;
      display: block;
    }

    /* ============================================
       LEVEL BAR
    ============================================ */
    .level-step-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .level-step {
      width: 60px;
      height: 10px;
      background: #111827;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #4c1d95;
    }
    .level-step-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      width: 0%;
      transition: width 0.4s ease;
    }
    .level-star { color: gold; font-size: 20px; }

    /* ============================================
       CAROUSELS
    ============================================ */
    .carousel-wrapper {
      position: relative;
      width: 300px;
      margin: 0 auto;
      text-align: center;
    }
    .carousel-item { display: none; }
    .carousel-item.active { display: block; }

    .mission-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      margin-bottom: 10px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(105,70,255,0.7);
    }

    .carousel-arrow {
      font-size: 30px;
      cursor: pointer;
      padding: 6px 12px;
      color: #e5e7eb;
      user-select: none;
      transition: 0.2s;
    }
    .carousel-arrow:hover {
      color: #a78bfa;
    }

    .dot-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4c1d95;
      cursor: pointer;
    }
    .dot.active {
      background: #a78bfa;
      box-shadow: 0 0 8px #a78bfa;
    }

    /* ============================================
       FILE UPLOAD
    ============================================ */
    .file-upload {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .file-input { display: none; }
    .file-label {
      padding: 8px 14px;
      border: 1px solid #6366f1;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      cursor: pointer;
      margin-bottom: 4px;
    }
    .file-name { font-size: 11px; opacity: 0.8; }

    .btn-primary {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #eee;
      cursor: pointer;
      margin-top: 4px;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 900px) {
      .sidebar { left: -260px; transition: left 0.3s; }
      body.menu-open .sidebar { left: 0; }

      .mobile-header { display: flex; }

      .main-area {
        margin-left: 0;
        padding: 70px 18px 20px 18px;
      }

      .character-wrapper { flex-direction: column; }
      h1 { display: none; }
    }
  </style>

</head>
<body>

  <!-- MOBILE HEADER -->
  <div class="mobile-header">
    <div class="burger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
    <div class="mobile-title">TEMPLE OF LOGIC</div>
    <button class="logout-btn" style="padding:6px 10px;font-size:12px;" onclick="logout()">Logout</button>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <img id="sidebarCharacter" class="sidebar-character" src="" alt="">
    <div class="menu-item active" onclick="showSection(event,'status')">Status</div>
    <div class="menu-item" onclick="showSection(event,'charakter')">Charakter</div>
    <div class="menu-item" onclick="showSection(event,'missionen')">Missionen</div>
    <div class="menu-item" onclick="showSection(event,'belohnungen')">Belohnungen</div>
    <div class="menu-item" onclick="showSection(event,'xp')">XP-Historie</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- MAIN AREA -->
  <div class="main-area">

    <h1>TEMPLE OF LOGIC</h1>

    <!-- STATUS -->
    <div id="status-section" class="card section">
      <h2>Status</h2>
      <div id="userCard"></div>
      <div id="levelBar" style="margin-top:14px;"></div>
    </div>

    <!-- CHARAKTER -->
    <div id="charakter-section" class="card section" style="display:none;">
      <h2>Charakter</h2>
      <div class="character-wrapper">

        <div id="characterInfo"></div>

        <div id="traitsItemsCard">
          <div class="traits-block">
            <b>Eigenschaften:</b>
            <div id="traitsList"></div>
          </div>

          <div class="items-block">
            <b>Items:</b>
            <div id="itemsList"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- MISSIONEN -->
    <div id="missionen-section" class="card section" style="display:none;">
      <h2>Missionen</h2>
      <div id="missionCarousel"></div>
    </div>

    <!-- BELOHNUNGEN -->
    <div id="belohnungen-section" class="card section" style="display:none;">
      <h2>Belohnungen</h2>
      <div id="rewardCarousel"></div>
    </div>

    <!-- XP LOG -->
    <div id="xp-section" class="card section" style="display:none;">
      <h2>XP-Historie</h2>
      <div id="xpLog"></div>
    </div>

  </div>

<script>
/* ============================================
   MENU HANDLING
============================================ */
function toggleMenu() {
  document.body.classList.toggle("menu-open");
}

function showSection(ev, name) {
  document.querySelectorAll(".section").forEach(s => s.style.display="none");
  document.getElementById(name + "-section").style.display = "block";

  document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
  if (ev) ev.target.classList.add("active");

  if (window.innerWidth < 900) {
    document.body.classList.remove("menu-open");
  }
}

/* ============================================
   LOGOUT
============================================ */
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

/* ============================================
   LOAD USER DATA
============================================ */
let xpPerMission = {};

async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();
  const u = data.user;

  /* Status */
  document.getElementById("userCard").innerHTML = `
    <b>Name:</b> ${u.name}<br>
    <b>XP:</b> ${u.xp}<br>
    <b>Level:</b> ${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)
  `;

  /* Sidebar Character Image */
  const sidebar = document.getElementById("sidebarCharacter");
  sidebar.src = data.character?.image_url || "";
  sidebar.style.display = data.character ? "block" : "none";

  /* Character section */
  const charBox = document.getElementById("characterInfo");

  if (data.character) {
    charBox.innerHTML = `
      <img class="char-img" src="${data.character.image_url}">
      <div style="margin-top:8px;font-size:18px;font-weight:bold;color:#ddd6fe;">
          ${data.character.name}
      </div>
    `;
  } else {
    charBox.innerHTML = `<div style="opacity:0.7;">Kein Charakter ausgewählt.</div>`;
  }

  document.getElementById("traitsList").innerHTML =
    data.traits.map(t => "• " + t).join("<br>");

  document.getElementById("itemsList").innerHTML =
    data.items.map(i => "• " + i).join("<br>");

  /* XP Log */
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div style="padding:8px;border-bottom:1px solid #5841a9;font-size:14px;">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source}<br>
        <span style="opacity:0.7;">${d}</span>
      </div>`;
  });

  /* XP per Mission */
  xpPerMission = data.xp_per_mission || {};

  /* Level Bar */
  renderLevelBar(data.levels, u.xp);
}

/* ============================================
   LEVEL BAR
============================================ */
function renderLevelBar(levels, xp) {
  if (!levels.length) return;

  let html = `<div class="level-step-container">`;

  for (let i=0; i<levels.length; i++) {
    if (i>0) html += `<div class="level-star">★</div>`;

    const min = levels[i].min_xp;
    const next = levels[i+1]?.min_xp ?? (min+1);

    let pct = 0;
    if (xp >= min) {
      pct = Math.min(100, (xp - min) / (next - min) * 100);
    }

    html += `
      <div class="level-step">
        <div class="level-step-fill" style="width:${pct}%;"></div>
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById("levelBar").innerHTML = html;
}

/* ============================================
   CAROUSELS (MISSIONS + REWARDS)
============================================ */
async function loadMissions() {
  const r = await fetch("/api/student/missions");
  const missions = await r.json();
  renderCarousel("missionCarousel", missions, "mission");
}

async function loadRewards() {
  const r = await fetch("/api/student/rewards");
  const rewards = await r.json();
  renderCarousel("rewardCarousel", rewards, "reward");
}

function renderCarousel(id, items, type) {
  const box = document.getElementById(id);
  if (!items.length) {
    box.innerHTML = "<i>Keine Einträge vorhanden.</i>";
    return;
  }

  let slides = "";
  items.forEach((item, idx) => {
    slides += `
      <div class="carousel-item ${idx === 0 ? "active" : ""}">
        ${item.image_url ? `<img class="mission-img" src="${item.image_url}">` : ""}
        <h3>${item.name}</h3>
        <div><b>${item.xp} XP</b></div>

        ${type === "mission" ? `
          <div style="margin-top:4px;">Bereits erhalten: <b>${xpPerMission[item.id] || 0} XP</b></div>
        ` : ""}

        ${type === "mission" && item.require_upload ? `
          <div class="file-upload">
            <input type="file" id="upload_${item.id}" class="file-input" onchange="updateFileLabel(${item.id})">
            <label class="file-label" for="upload_${item.id}">Datei auswählen</label>
            <span class="file-name" id="file-name-${item.id}">Keine Datei ausgewählt</span>
            <button class="btn-primary" onclick="uploadMission(${item.id})">Upload senden</button>
          </div>
        ` : ""}

        ${type === "reward" ? `
          <button class="btn-primary" onclick="redeemReward(${item.id})">Belohnung einlösen</button>
        ` : ""}
      </div>
    `;
  });

  let dots = "";
  items.forEach((_, idx) => {
    dots += `<div class="dot ${idx === 0 ? "active" : ""}" onclick="jumpSlide('${id}', ${idx})"></div>`;
  });

  box.innerHTML = `
    <div class="carousel-wrapper">
      <span class="carousel-arrow" onclick="prevSlide('${id}')">&#10094;</span>
      ${slides}
      <span class="carousel-arrow" onclick="nextSlide('${id}')">&#10095;</span>
    </div>
    <div class="dot-container">${dots}</div>
  `;
}

function nextSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let i = items.findIndex(a => a.classList.contains("active"));
  items[i].classList.remove("active");
  i = (i + 1) % items.length;
  items[i].classList.add("active");
  updateDots(id, i);
}

function prevSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let i = items.findIndex(a => a.classList.contains("active"));
  items[i].classList.remove("active");
  i = (i - 1 + items.length) % items.length;
  items[i].classList.add("active");
  updateDots(id, i);
}

function jumpSlide(id, idx) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  items.forEach(a => a.classList.remove("active"));
  items[idx].classList.add("active");
  updateDots(id, idx);
}

function updateDots(id, idx) {
  const dots = [...document.querySelectorAll(`#${id} .dot`)];
  dots.forEach(d => d.classList.remove("active"));
  dots[idx].classList.add("active");
}

/* ============================================
   FILE UPLOAD
============================================ */
function updateFileLabel(id) {
  const input = document.getElementById(`upload_${id}`);
  const span = document.getElementById(`file-name-${id}`);
  span.textContent = input.files.length ? input.files[0].name : "Keine Datei ausgewählt";
}

async function uploadMission(id) {
  const input = document.getElementById(`upload_${id}`);
  if (!input.files.length) { alert("Bitte eine Datei auswählen."); return; }

  const form = new FormData();
  form.append("image", input.files[0]);
  form.append("missionId", id);

  const r = await fetch("/api/student/uploadForMission", { method:"POST", body: form });
  const data = await r.json();

  if (data.success) { alert("Upload erfolgreich!"); loadMe(); }
  else alert("Fehler beim Upload.");
}

/* ============================================
   REDEEM REWARD
============================================ */
async function redeemReward(id) {
  const r = await fetch("/api/student/redeemReward", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ rewardId: id })
  });

  const data = await r.json();
  if (data.success) {
    alert("Belohnung eingelöst!");
    loadMe();
    loadRewards();
  } else {
    alert(data.message || "Fehler.");
  }
}

/* ============================================
   INIT
============================================ */
loadMe();
loadMissions();
loadRewards();
</script>
</body>
</html>
