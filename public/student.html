<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Temple of Logic – Schüler</title>

  <style>
    /* ============================================
       GLOBAL STYLES – Fantasy Dark Design
    ============================================ */
    body {
      margin: 0;
      background: 
        linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.60)),
        url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600&auto=format&fit=crop")
        center/cover no-repeat fixed;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ============================================
       SIDEBAR
    ============================================ */
    .sidebar {
      width: 250px;
      background: rgba(10, 8, 25, 0.65);
      border-right: 1px solid rgba(120, 90, 200, 0.35);
      backdrop-filter: blur(6px);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .sidebar .logo-orb {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: radial-gradient(circle at 30% 20%, #facc15, #f97316 25%, #4c1d95 70%, #020617 100%);
      box-shadow: 0 0 30px rgba(250,204,21,0.85);
    }

    .menu-item {
      padding: 14px 22px;
      cursor: pointer;
      font-size: 16px;
      border-bottom: 1px solid rgba(160, 160, 255, 0.08);
      transition: 0.2s;
    }

    .menu-item:hover, .menu-item.active {
      background: rgba(160, 120, 255, 0.20);
    }

    .logout-btn {
      margin: auto 20px 20px 20px;
      padding: 10px 16px;
      font-size: 14px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      color: white;
      cursor: pointer;
    }

    /* ============================================
       MAIN CONTENT
    ============================================ */
    .main-area {
      flex: 1;
      padding: 25px 40px;
      overflow-y: auto;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 0.1em;
      margin-bottom: 25px;
      color: #ddd6fe;
    }

    h2 {
      margin-top: 25px;
      color: #c4b5fd;
      border-bottom: 1px solid #5841a9;
      padding-bottom: 4px;
    }

    .card {
      background: rgba(10, 10, 35, 0.60);
      padding: 18px;
      border: 1px solid rgba(140, 110, 255, 0.3);
      border-radius: 12px;
      margin-bottom: 25px;
      backdrop-filter: blur(5px);
    }

    /* ============================================
       CHARACTER IMAGE
    ============================================ */
    .char-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      margin-bottom: 14px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(130,90,255,0.6);
    }

    /* ============================================
       LEVEL BAR – MULTISTEP
    ============================================ */
    .level-step-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .level-step {
      width: 60px;
      height: 10px;
      background: #1b1537;
      border-radius: 5px;
      border: 1px solid #4c1d95;
      overflow: hidden;
    }
    .level-step-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      width: 0%;
      transition: width 0.4s ease;
    }
    .level-step-star {
      font-size: 20px;
      color: gold;
    }

    /* ============================================
       CAROUSEL
    ============================================ */
    .carousel-wrapper {
      position: relative;
      width: 300px;
      margin: 0 auto;
    }

    .carousel-item {
      display: none;
      text-align: center;
    }

    .carousel-item.active {
      display: block;
    }

    .mission-img {
      width: 240px;
      height: 400px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 0 10px rgba(120,80,255,0.45);
    }

    .carousel-arrow {
      font-size: 30px;
      cursor: pointer;
      user-select: none;
      padding: 5px 12px;
      color: #ddd;
      transition: 0.2s;
    }
    .carousel-arrow:hover {
      color: #a78bfa;
    }

    /* Dots */
    .dot-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4c1d95;
      cursor: pointer;
    }
    .dot.active {
      background: #a78bfa;
      box-shadow: 0 0 6px #a78bfa;
    }

    /* ============================================
       UPLOAD CARD
    ============================================ */
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .upload-card {
      background: rgba(10, 10, 35, 0.50);
      border: 1px solid rgba(140,110,255,0.3);
      border-radius: 10px;
      padding: 8px;
      backdrop-filter: blur(5px);
    }
    .upload-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }

  </style>
</head>

<body>

  <!-- ====================== SIDEBAR ===================== -->
  <div class="sidebar">

    <div class="logo-orb"></div>

    <div class="menu-item active" onclick="showSection('status')">Status</div>
    <div class="menu-item" onclick="showSection('charakter')">Charakter</div>
    <div class="menu-item" onclick="showSection('missionen')">Missionen</div>
    <div class="menu-item" onclick="showSection('belohnungen')">Belohnungen</div>
    <div class="menu-item" onclick="showSection('xp')">XP-Historie</div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- ====================== MAIN AREA ===================== -->
  <div class="main-area">
    <h1>TEMPLE OF LOGIC</h1>

    <!-- STATUS -->
    <div id="status-section" class="card section">
      <h2>Status</h2>
      <div id="userCard"></div>
      <div id="levelBar"></div>
    </div>

    <!-- CHARACTER -->
    <div id="charakter-section" class="card section" style="display:none;">
      <h2>Charakter</h2>
      <div id="characterInfo"></div>
      <div id="traitsItemsCard"></div>
    </div>

    <!-- MISSIONEN -->
    <div id="missionen-section" class="card section" style="display:none;">
      <h2>Missionen</h2>
      <div id="missionCarousel"></div>
    </div>

    <!-- BELOHNUNGEN -->
    <div id="belohnungen-section" class="card section" style="display:none;">
      <h2>Belohnungen</h2>
      <div id="rewardCarousel"></div>
    </div>

    <!-- XP LOG -->
    <div id="xp-section" class="card section" style="display:none;">
      <h2>XP-Historie</h2>
      <div id="xpLog"></div>
    </div>

    <!-- UPLOADS OPTIONAL (kann wieder aktiviert werden) -->
  </div>


<script>
/* ============================================
   SECTION SWITCHING
============================================ */
function showSection(name) {
  document.querySelectorAll(".section").forEach(s => s.style.display = "none");
  document.querySelector(`#${name}-section`).style.display = "block";

  document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
  event.target.classList.add("active");
}

/* ============================================
   LOGOUT
============================================ */
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
}

/* ============================================
   LOAD STUDENT DATA
============================================ */
let xpPerMission = {};

async function loadMe() {
  const r = await fetch("/api/student/me");
  const data = await r.json();

  const u = data.user;

  // -----------------------------------
  // STATUSCARD
  // -----------------------------------
  document.getElementById("userCard").innerHTML = `
    <b>Name:</b> ${u.name}<br>
    <b>XP:</b> ${u.xp}<br>
    <b>Level:</b> ${u.level_name || "—"} (ab ${u.level_min_xp || 0} XP)
  `;

  // -----------------------------------
  // CHARACTER
  // -----------------------------------
  document.getElementById("characterInfo").innerHTML = data.character
    ? `<img class="char-img" src="${data.character.image_url}">
       <div><b>${data.character.name}</b></div>`
    : "Kein Charakter gewählt.";

  // -----------------------------------
  // TRAITS & ITEMS
  // -----------------------------------
  document.getElementById("traitsItemsCard").innerHTML = `
    <b>Eigenschaften:</b><br>
    ${data.traits.map(t => "• " + t).join("<br>")}<br><br>
    <b>Items:</b><br>
    ${data.items.map(i => "• " + i).join("<br>")}
  `;

  // -----------------------------------
  // XP PER MISSION
  // -----------------------------------
  xpPerMission = data.xp_per_mission || {};

  // -----------------------------------
  // XP LOG
  // -----------------------------------
  const xpDiv = document.getElementById("xpLog");
  xpDiv.innerHTML = "";
  data.xp_log.forEach(entry => {
    const d = new Date(entry.created_at).toLocaleString("de-DE");
    xpDiv.innerHTML += `
      <div style="padding:8px;border-bottom:1px solid #5841a9;font-size:14px;">
        <b>${entry.amount} XP</b> – ${entry.mission_name || entry.source} <br>
        <span style="opacity:0.7;">${d}</span>
      </div>
    `;
  });

  // -----------------------------------
  // LEVEL BAR
  // -----------------------------------
  const levels = data.levels;
  const currentLevel = u.level_id;
  const idx = levels.findIndex(l => l.id === currentLevel);

  let html = `<div class="level-step-container">`;

  for (let i = 0; i < levels.length; i++) {
    if (i > 0) html += `<div class="level-step-star">★</div>`;

    const min = levels[i].min_xp;
    const next = levels[i + 1]?.min_xp || min;
    let pct = 0;

    if (u.xp >= min) {
      pct = Math.min(100, ((u.xp - min) / (next - min)) * 100);
      if (!isFinite(pct)) pct = 100;
    }

    html += `
      <div class="level-step">
        <div class="level-step-fill" style="width:${pct}%"></div>
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById("levelBar").innerHTML = html;
}

loadMe();

/* ============================================
   LOAD MISSIONS & REWARDS
============================================ */
async function loadMissions() {
  const r = await fetch("/api/student/missions");
  const missions = await r.json();

  renderCarousel("missionCarousel", missions, "mission");
}
async function loadRewards() {
  const r = await fetch("/api/student/rewards");
  const cards = await r.json();

  renderCarousel("rewardCarousel", cards, "reward");
}

/* ============================================
   GENERIC CAROUSEL
============================================ */
function renderCarousel(id, items, type) {
  const container = document.getElementById(id);

  if (!items.length) {
    container.innerHTML = "<i>Keine Inhalte verfügbar.</i>";
    return;
  }

  let slides = "";
  items.forEach((item, idx) => {
    slides += `
      <div class="carousel-item ${idx === 0 ? "active" : ""}">
        ${item.image_url ? `<img class="mission-img" src="${item.image_url}">` : ""}
        <h3>${item.name}</h3>
        <div><b>${item.xp} XP</b></div>
        ${type === "mission" ? `
          <div style="margin-top:5px;">Bereits erhalten: <b>${xpPerMission[item.id] || 0} XP</b></div>
        ` : ""}
        ${type === "mission" && item.require_upload ? `
          <br>
          <input type="file" id="upload_${item.id}">
          <button onclick="uploadMission(${item.id})" style="margin-top:6px;">Upload senden</button>
        ` : ""}
        ${type === "reward" ? `
          <button onclick="redeemReward(${item.id})" style="margin-top:10px;">Einlösen</button>
        ` : ""}
      </div>
    `;
  });

  let dots = "";
  items.forEach((_, idx) => {
    dots += `<div class="dot ${idx === 0 ? "active" : ""}" onclick="jumpSlide('${id}', ${idx})"></div>`;
  });

  container.innerHTML = `
    <div class="carousel-wrapper">
      <span class="carousel-arrow" onclick="prevSlide('${id}')">&#10094;</span>
      ${slides}
      <span class="carousel-arrow" onclick="nextSlide('${id}')">&#10095;</span>
    </div>
    <div class="dot-container">${dots}</div>
  `;
}

/* ============================================
   CAROUSEL CONTROLS
============================================ */
function nextSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let index = items.findIndex(i => i.classList.contains("active"));
  items[index].classList.remove("active");

  index = (index + 1) % items.length;
  items[index].classList.add("active");

  updateDots(id, index);
}
function prevSlide(id) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  let index = items.findIndex(i => i.classList.contains("active"));
  items[index].classList.remove("active");

  index = (index - 1 + items.length) % items.length;
  items[index].classList.add("active");

  updateDots(id, index);
}
function jumpSlide(id, idx) {
  const items = [...document.querySelectorAll(`#${id} .carousel-item`)];
  items.forEach(i => i.classList.remove("active"));
  items[idx].classList.add("active");
  updateDots(id, idx);
}
function updateDots(id, idx) {
  const dots = [...document.querySelectorAll(`#${id} .dot`)];
  dots.forEach(d => d.classList.remove("active"));
  dots[idx].classList.add("active");
}

/* ============================================
   UPLOAD MISSION
============================================ */
async function uploadMission(missionId) {
  const file = document.getElementById(`upload_${missionId}`).files[0];
  if (!file) return alert("Bitte ein Bild auswählen!");

  const form = new FormData();
  form.append("image", file);
  form.append("missionId", missionId);

  const r = await fetch("/api/student/uploadForMission", {
    method: "POST",
    body: form
  });

  const data = await r.json();
  if (data.success) {
    alert("Upload erfolgreich!");
    loadMe();
  }
}

/* ============================================
   REWARD REDEEM
============================================ */
async function redeemReward(id) {
  const r = await fetch("/api/student/redeemReward", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ rewardId: id })
  });

  const data = await r.json();
  if (data.success) {
    alert("Belohnung eingelöst!");
    loadMe();
    loadRewards();
  } else {
    alert("Nicht genug XP!");
  }
}

/* ============================================
   INIT
============================================ */
loadMissions();
loadRewards();

</script>

</body>
</html>
