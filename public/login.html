<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Login – Streets of Logic</title>

  <!-- GTA-Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Roboto", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)),
        url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=1600&q=80")
        center/cover no-repeat fixed;
      color: #f9fafb;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 30px;
      border: 2px solid rgba(148,163,184,0.5);
      background: linear-gradient(
        145deg,
        rgba(15,23,42,0.93),
        rgba(15,23,42,0.96)
      );
      box-shadow:
        0 0 35px rgba(0,0,0,0.95),
        inset 0 0 50px rgba(0,0,0,0.35);
      animation: fadeIn 0.5s ease-out;
      position: relative;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 10%, rgba(249,115,22,0.18), transparent 60%);
    }

    .logo-orb {
      width: 85px;
      height: 85px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #facc15, #f97316 40%, #b91c1c 70%, #000);
      border: 3px solid #000;
      box-shadow:
        0 0 25px rgba(250,204,21,0.9),
        0 6px 14px rgba(0,0,0,0.9);
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-family: "Bangers", system-ui;
      font-size: 30px;
      letter-spacing: 0.25em;
      color: #fefce8;
      text-shadow:
        -3px -3px 0 #000,
         3px -3px 0 #000,
        -3px  3px 0 #000,
         3px  3px 0 #000,
         0 0 25px rgba(249,115,22,0.9);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 999px;
      border: 2px solid rgba(148,163,184,0.35);
      background: rgba(15,23,42,0.95);
      color: #f9fafb;
      font-size: 14px;
      letter-spacing: 0.04em;
      outline: none;
      box-shadow:
        inset 0 0 6px rgba(0,0,0,0.9),
        0 3px 10px rgba(0,0,0,0.4);
      transition: 0.15s ease;
    }

    input:focus {
      border-color: #f97316;
      box-shadow:
        inset 0 0 8px rgba(0,0,0,0.9),
        0 0 14px rgba(249,115,22,0.8);
    }

    input::placeholder {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      color: #9ca3af;
    }

    .error {
      display: none;
      background: rgba(239,68,68,0.12);
      color: #fecaca;
      border: 1px solid #b91c1c;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: 2px solid #000;
      background: linear-gradient(135deg, #facc15, #f97316);
      font-family: "Bangers";
      font-size: 20px;
      letter-spacing: 0.2em;
      cursor: pointer;
      color: #000;
      text-transform: uppercase;
      box-shadow:
        0 5px 0 #000,
        0 0 20px rgba(250,204,21,0.75);
      transition: 0.1s ease;
    }

    button:hover {
      filter: brightness(1.06);
      box-shadow:
        0 5px 0 #000,
        0 0 26px rgba(249,115,22,0.9);
    }

    button:active {
      transform: translateY(3px);
      box-shadow:
        0 2px 0 #000,
        0 0 10px rgba(0,0,0,0.8);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="logo-orb"></div>
    <h1>STREETS OF LOGIC</h1>

    <div id="error" class="error">Falsche Zugangsdaten</div>

    <input id="username" placeholder="Benutzername" />
    <input id="password" type="password" placeholder="Passwort" />

    <button onclick="login()">LOGIN</button>
  </div>

  <script>
    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const error = document.getElementById("error");

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });

      if (!res.ok) {
        error.style.display = "block";
        return;
      }

      const data = await res.json();
      if (data.role === "admin") location.href = "/admin";
      else location.href = "/student";
    }

    // 👉 ENTER-Taste aktiviert Login
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        login();
      }
    });
  </script>

</body>
</html>
