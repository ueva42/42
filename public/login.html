<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Streets of Logic – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1b1f3b, #0c0f1e);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Montserrat", sans-serif;
      color: #fff;
    }

    .login-box {
      width: 480px;
      background: rgba(8, 12, 26, 0.9);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 0 25px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .orb {
      width: 55px;
      height: 55px;
      background: radial-gradient(circle at 30% 30%, #ffb347, #cc5200);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,106,0,0.6);
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    label {
      display: block;
      margin-top: 20px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #070b1b;
      color: white;
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
    }

    .login-btn {
      margin-top: 30px;
      width: 100%;
      padding: 16px;
      background: #4ade80;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.15s;
    }

    .login-btn:hover {
      background: #36c46b;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(74,222,128,0.5);
    }

    .error {
      margin-top: 15px;
      font-size: 14px;
      color: #f87171;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">

    <div class="title-row">
      <div class="orb"></div>
      <div class="title">STREETS OF LOGIC</div>
    </div>

    <label>BENUTZERNAME</label>
    <input type="text" id="username" autocomplete="off">

    <label>PASSWORT</label>
    <input type="password" id="password">

    <button class="login-btn" onclick="doLogin()">LOGIN</button>

    <div class="error" id="errorMsg">Benutzername oder Passwort falsch.</div>
  </div>

  <script>
    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!username || !password) {
        errorMsg.textContent = "Bitte beide Felder ausfüllen.";
        errorMsg.style.display = "block";
        return;
      }

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (!data.success) {
        errorMsg.textContent = "Benutzername oder Passwort falsch.";
        errorMsg.style.display = "block";
        return;
      }

      // FIRST LOGIN?
      if (data.firstLogin) {
        window.location.href = "/first-login";
        return;
      }

      // SUPERADMIN → eigener Bereich
      if (data.role === "superadmin") {
        window.location.href = "/superadmin";
        return;
      }

      // ADMIN
      if (data.role === "admin") {
        window.location.href = "/admin";
        return;
      }

      // STUDENT
      if (data.role === "student") {
        window.location.href = "/student";
        return;
      }
    }
  </script>
</body>
</html>
