<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streets of Logic – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,184,108,0.18) 0, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(255,46,99,0.26) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(56,189,248,0.25) 0, transparent 60%),
        #050816;
      font-family: Arial, sans-serif;
      color: #f9fafb;
    }
    .card {
      width: 360px;
      max-width: 90vw;
      background: radial-gradient(circle at top left, #020617 0, #020617 55%, #030712 100%);
      border-radius: 20px;
      padding: 22px 22px 20px 22px;
      box-shadow:
        0 18px 50px rgba(0,0,0,0.95),
        0 0 22px rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.6);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top left, rgba(251,191,36,0.18), transparent 60%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.16), transparent 60%);
    }
    .card > * {
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 0 0 6px 0;
      font-family: "Bangers", system-ui;
      font-size: 26px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
      color: #fef9c3;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000,
        0 0 18px rgba(251,191,36,0.95);
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #f9fafb;
      font-size: 13px;
      outline: none;
      margin-bottom: 10px;
      box-sizing: border-box;
      transition: border 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 1px rgba(249,115,22,0.7);
    }
    button {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 9px 0;
      margin-top: 4px;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #a855f7);
      color: #0f172a;
      box-shadow:
        0 8px 22px rgba(8,47,73,0.95),
        0 0 16px rgba(168,85,247,0.8);
      transition: 0.16s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #4ade80, #f97316);
      transform: translateY(-1px);
      box-shadow:
        0 10px 26px rgba(8,47,73,1),
        0 0 20px rgba(249,115,22,0.9);
    }
    .error {
      margin-top: 10px;
      font-size: 12px;
      color: #fecaca;
      min-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>STREETS OF LOGIC</h1>
    <div class="subtitle">XP EDITION – LOGIN</div>

    <label for="username">Name</label>
    <input id="username" autocomplete="username">

    <label for="password">Passwort</label>
    <input id="password" type="password" autocomplete="current-password">

    <button onclick="doLogin()">Login</button>

    <div id="error" class="error"></div>
  </div>

  <script>
  async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorDiv = document.getElementById("error");
    errorDiv.textContent = "";

    if (!username || !password) {
      errorDiv.textContent = "Bitte Name und Passwort eingeben.";
      return;
    }

    const r = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ username, password })
    });

    const data = await r.json();
    if (!data.success) {
      errorDiv.textContent = "Login fehlgeschlagen. Name oder Passwort falsch.";
      return;
    }

    if (data.role === "admin") {
      location.href = "/admin";
    } else if (data.firstLogin) {
      // Erst-Login: auf Seite zur Passwort-Änderung
      location.href = "/first-login.html";
    } else {
      location.href = "/student";
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") doLogin();
  });
  </script>
</body>
</html>
