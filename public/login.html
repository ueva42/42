<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Streets of Logic – Login</title>

<style>
/* ===========================
   GLOBAL – Vice City Neon
=========================== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
    url("https://images.unsplash.com/photo-1520697830682-d71a7a6a67cf?auto=format&fit=crop&w=1600&q=80")
    center/cover no-repeat fixed;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ======================================================================
   LOGIN CARD – Neon Glow, Vice City Colors, Cartoon Outlines
====================================================================== */
.login-card {
  width: 380px;
  padding: 32px;
  border-radius: 20px;
  background: rgba(10, 10, 35, 0.85);
  border: 3px solid #ff2ec6;
  box-shadow:
    0 0 25px #ff2ec6,
    0 0 55px rgba(0,255,255,0.6),
    0 0 5px #000;
  text-align: center;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* GTA Title */
.title {
  font-family: Impact, sans-serif;
  font-size: 32px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #f4f0ff;
  text-shadow:
    0 0 10px #ff2ec6,
    0 0 15px #00eaff,
    3px 3px #000;
  margin-bottom: 20px;
}

/* Inputs */
input {
  width: 88%;
  padding: 12px;
  margin: 10px 0;
  font-size: 16px;
  border-radius: 12px;
  border: 2px solid #00eaff;
  outline: none;
  background: rgba(0,0,0,0.5);
  color: #fff;
  box-shadow: 0 0 10px rgba(0,255,255,0.4);
}

input:focus {
  border-color: #ff50ff;
  box-shadow: 0 0 18px #ff2ec6;
}

/* Login Button */
.login-btn {
  width: 95%;
  margin-top: 10px;
  padding: 14px;
  background: linear-gradient(135deg, #ff2ec6, #00eaff);
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  color: #1b0033;
  cursor: pointer;
  text-shadow: 0 0 4px #fff;
  box-shadow:
    0 0 12px #ff2ec6,
    0 0 22px #00eaff;
  transition: 0.2s;
}

.login-btn:hover {
  transform: scale(1.05);
  box-shadow:
    0 0 22px #ff2ec6,
    0 0 42px #00eaff;
}
</style>
</head>

<body>

<div class="login-card">
  <div class="title">Streets of Logic</div>

  <input id="username" placeholder="Benutzername" autocomplete="off">
  <input id="password" type="password" placeholder="Passwort">

  <button class="login-btn" onclick="login()">Login</button>

  <div id="error" style="margin-top:10px;color:#ff7aff;display:none;">
    Falscher Login
  </div>
</div>

<script>
async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  const r = await fetch("/api/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await r.json();

  if (!data.success) {
    document.getElementById("error").style.display = "block";
    return;
  }

  // weiterleiten:
  if (data.role === "admin") {
    location.href = "/admin.html";
  } else {
    location.href = "/student.html";
  }
}
</script>

</body>
</html>
