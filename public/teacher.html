<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Streets of Logic" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <title>Streets of Logic – Lehrkräfte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/client-cache-reset.js?v=2"></script>
  <script src="/js/auth-fetch.js?v=13"></script>
  <style>
    :root {
      --navy: #050816;
      --panel: #0b1428;
      --panel-2: #101b33;
      --cyan: #22d3ee;
      --violet: #8b5cf6;
      --orange: #f97316;
      --green: #34d399;
      --red: #fb7185;
      --amber: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-h: 64px;
      --touch: 44px;
      --radius-tile: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(34,211,238,.12), transparent 42%),
        radial-gradient(circle at 88% 8%, rgba(139,92,246,.14), transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(249,115,22,.08), transparent 45%),
        var(--navy);
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
    }
    button, select, input, textarea { font: inherit; }
    .teacher-top {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(5,8,22,.82);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px 10px;
    }
    .teacher-brand {
      font-family: Orbitron, system-ui;
      font-size: .78rem;
      letter-spacing: .14em;
      color: var(--cyan);
      margin: 0 0 2px;
    }
    .teacher-greeting {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .teacher-sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }
    .teacher-toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
    }
    .teacher-toolbar select, .teacher-toolbar input[type="date"] {
      min-height: var(--touch);
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      flex: 1 1 140px;
    }
    .teacher-main { padding: 14px 16px 24px; max-width: 920px; margin: 0 auto; }

    .section-title {
      font-family: Orbitron, system-ui;
      font-size: .72rem;
      letter-spacing: .12em;
      color: var(--muted);
      margin: 14px 0 10px;
      text-transform: uppercase;
    }

    /* ---- Tile grids ---- */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .tile-grid--stats { margin-bottom: 4px; }
    .tile-grid--tools { gap: 12px; }
    @media (min-width: 560px) {
      .tile-grid--students,
      .tile-grid--history,
      .tile-grid--insights { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tile-grid--tools { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 820px) {
      .tile-grid--stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .tile-grid--students,
      .tile-grid--history { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .tile-grid--insights { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tile-grid--tools { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: 96px;
      min-width: 0;
      padding: 14px;
      border-radius: var(--radius-tile);
      border: 1px solid var(--line);
      background:
        linear-gradient(165deg, rgba(16,27,51,.95), rgba(11,20,40,.98));
      color: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color .15s ease, transform .12s ease, background .15s ease;
    }
    button.tile { font: inherit; width: 100%; }
    a.tile { color: inherit; }
    .tile:active { transform: scale(.985); }
    .tile:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }
    .tile--stat {
      min-height: 88px;
      background:
        linear-gradient(160deg, rgba(34,211,238,.1), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile--stat.attn {
      background:
        linear-gradient(160deg, rgba(251,113,133,.16), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
      border-color: rgba(251,113,133,.35);
    }
    .tile--stat.positive {
      background:
        linear-gradient(160deg, rgba(52,211,153,.14), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
      border-color: rgba(52,211,153,.28);
    }
    .tile--stat.planned {
      background:
        linear-gradient(160deg, rgba(139,92,246,.14), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile .tile-label {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1.25;
    }
    .tile .tile-value {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .tile .tile-hint {
      color: var(--muted);
      font-size: .72rem;
      margin-top: auto;
    }

    .tile--insight {
      min-height: 128px;
      gap: 6px;
    }
    .tile--insight.priority-hoch { border-color: rgba(251,113,133,.45); }
    .tile--insight.priority-mittel { border-color: rgba(251,191,36,.35); }
    .tile--insight.priority-niedrig { border-color: rgba(52,211,153,.3); }
    .tile--insight .tile-title {
      margin: 0;
      font-size: .98rem;
      font-weight: 700;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile--insight .tile-obs {
      margin: 0;
      color: #cbd5e1;
      font-size: .82rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: .75rem;
      color: var(--muted);
    }
    .tile-meta .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: #e2e8f0;
    }
    .tile-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .tile-actions .btn {
      flex: 1;
      min-height: var(--touch);
      font-size: .82rem;
      padding: 0 8px;
    }

    .tile--student {
      min-height: 110px;
    }
    .tile--student.needs-attention {
      border-color: rgba(251,113,133,.4);
      background:
        linear-gradient(160deg, rgba(251,113,133,.1), transparent 50%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile--student.positive-signal {
      border-color: rgba(52,211,153,.28);
    }
    .tile--student .tile-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tile--student .tile-status {
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .status-dots {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: auto;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(148,163,184,.35);
    }
    .status-dot.on { background: var(--cyan); }
    .status-dot.reflect { background: var(--green); }
    .status-dot.attn { background: var(--red); }

    .tile--class {
      min-height: 100px;
    }
    .tile--class.active {
      border-color: rgba(34,211,238,.5);
      box-shadow: inset 0 0 0 1px rgba(34,211,238,.25);
    }
    .tile--class h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .tile--class .tile-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: .78rem;
      color: var(--muted);
    }
    .tile--class .metric strong {
      color: var(--text);
      font-weight: 700;
    }

    .tile--tool {
      min-height: 104px;
      background:
        linear-gradient(145deg, rgba(139,92,246,.1), transparent 48%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile--tool h3 {
      margin: 0;
      font-size: .98rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .tile--tool p {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile--danger {
      background:
        linear-gradient(145deg, rgba(251,113,133,.1), transparent 48%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }

    .tile--history {
      min-height: 118px;
    }
    .tile--history .day-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }
    .day-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      min-height: 22px;
      padding: 0 5px;
      border-radius: 8px;
      background: rgba(148,163,184,.12);
      font-size: .7rem;
      font-weight: 700;
    }
    .day-pill.on { background: rgba(34,211,238,.16); color: #a5f3fc; }
    .day-pill.reflect { background: rgba(52,211,153,.14); color: #a7f3d0; }

    .prio {
      display: inline-flex; align-items: center; min-height: 24px;
      padding: 0 8px; border-radius: 999px; font-weight: 600; font-size: .7rem;
      background: rgba(148,163,184,.12); flex-shrink: 0;
      text-transform: capitalize;
    }
    .prio.hoch { color: #fecdd3; background: rgba(251,113,133,.16); }
    .prio.mittel { color: #fde68a; background: rgba(251,191,36,.14); }
    .prio.niedrig { color: #a7f3d0; background: rgba(52,211,153,.14); }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: var(--touch); min-width: var(--touch);
      border: 0; border-radius: 12px; padding: 0 14px;
      font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), #38bdf8); color: #082f49; }
    .btn-ghost { background: rgba(148,163,184,.12); color: var(--text); border: 1px solid var(--line); }
    .btn-danger { background: rgba(251,113,133,.18); color: #fecdd3; }
    .empty {
      padding: 28px 16px; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: 16px;
    }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }

    /* Detail / sheet (unchanged behavior) */
    .insight-card, .student-row, .detail-block {
      background: rgba(11,20,40,.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }
    .insight-card.priority-hoch { border-color: rgba(251,113,133,.45); }
    .insight-card.priority-mittel { border-color: rgba(251,191,36,.35); }
    .insight-card.priority-niedrig { border-color: rgba(52,211,153,.3); }
    .insight-prompt {
      margin: 0 0 12px; padding: 10px 12px; border-radius: 12px;
      background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.18);
      font-size: .9rem;
    }
    .detail-stack { display: grid; gap: 10px; }
    .detail-block { margin-bottom: 0; }
    .detail-block h4 { margin: 0 0 8px; font-size: .95rem; }

    .teacher-bottomnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 2px; padding: 6px 6px calc(6px + var(--safe-bottom));
      background: rgba(5,8,22,.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .teacher-bottomnav button {
      min-height: 56px; border: 0; background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: .72rem; font-weight: 600; cursor: pointer;
    }
    .teacher-bottomnav button.active { color: var(--cyan); }
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(2,6,23,.62);
      z-index: 40; display: none;
    }
    .sheet-backdrop.open { display: block; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      max-height: min(88dvh, 720px); overflow: auto;
      background: linear-gradient(180deg, #111b33, #0a1224);
      border-radius: 22px 22px 0 0;
      border: 1px solid var(--line);
      border-bottom: 0;
      padding: 12px 16px calc(18px + var(--safe-bottom));
      transform: translateY(110%);
      transition: transform .22s ease;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 42px; height: 4px; border-radius: 999px; background: rgba(148,163,184,.35);
      margin: 4px auto 12px;
    }
    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
    .chip {
      min-height: var(--touch); border-radius: 999px; padding: 0 14px;
      border: 1px solid var(--line); background: rgba(148,163,184,.08);
      color: var(--text); cursor: pointer;
    }
    .chip.active { border-color: rgba(34,211,238,.55); background: rgba(34,211,238,.14); color: #a5f3fc; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
    .field textarea, .field input {
      width: 100%; min-height: var(--touch); border-radius: 12px;
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      padding: 10px 12px;
    }
    .field textarea { min-height: 96px; resize: vertical; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
    .tabs button {
      min-height: 40px; border-radius: 999px; border: 1px solid var(--line);
      background: transparent; color: var(--muted); padding: 0 14px; white-space: nowrap; cursor: pointer;
    }
    .tabs button.active { color: var(--text); background: rgba(34,211,238,.14); border-color: rgba(34,211,238,.35); }
    .check-row { display: flex; align-items: center; gap: 10px; min-height: var(--touch); }
    .check-row input { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <header class="teacher-top">
    <p class="teacher-brand">STREETS OF LOGIC</p>
    <h1 class="teacher-greeting" id="greeting">Lehrerbereich</h1>
    <p class="teacher-sub" id="subline">Wer braucht heute Unterstützung – und warum?</p>
    <div class="teacher-toolbar" id="toolbar">
      <select id="classSelect" aria-label="Klasse"></select>
      <input type="date" id="dateInput" aria-label="Datum" />
    </div>
  </header>

  <main class="teacher-main" id="app"></main>

  <nav class="teacher-bottomnav" aria-label="Lehrer-Navigation">
    <button type="button" data-tab="heute" class="active">Heute</button>
    <button type="button" data-tab="klassen">Klassen</button>
    <button type="button" data-tab="lernbegleitung">Lernbegleitung</button>
    <button type="button" data-tab="verlauf">Verlauf</button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </div>

  <script src="/js/teacher-app.js?v=2"></script>
</body>
</html>
