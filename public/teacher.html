<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Streets of Logic" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <title>Streets of Logic – Lehrkräfte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/client-cache-reset.js?v=2"></script>
  <script src="/js/auth-fetch.js?v=13"></script>
  <style>
    :root {
      --navy: #050816;
      --panel: #0b1428;
      --panel-2: #101b33;
      --cyan: #22d3ee;
      --violet: #8b5cf6;
      --orange: #f97316;
      --green: #34d399;
      --red: #fb7185;
      --amber: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-h: 68px;
      --touch: 44px;
      --radius-tile: 20px;
      --glow-cyan: 0 0 28px rgba(34, 211, 238, 0.12);
      --glow-violet: 0 0 28px rgba(139, 92, 246, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--text);
      background-color: var(--navy);
      background-image:
        linear-gradient(to bottom, rgba(5, 8, 22, 0.72), rgba(5, 8, 22, 0.88)),
        radial-gradient(circle at 12% 0%, rgba(34, 211, 238, 0.14), transparent 42%),
        radial-gradient(circle at 88% 8%, rgba(139, 92, 246, 0.16), transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(249, 115, 22, 0.08), transparent 45%),
        url("/assets/logic-bg.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 20%, black 20%, transparent 75%);
    }
    body > * { position: relative; z-index: 1; }
    button, select, input, textarea { font: inherit; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .teacher-top {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(18px) saturate(1.2);
      background: linear-gradient(180deg, rgba(5, 8, 22, 0.92), rgba(5, 8, 22, 0.78));
      border-bottom: 1px solid var(--line);
      padding: 14px 16px 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }
    .teacher-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .teacher-top-text { flex: 1; min-width: 0; }
    .teacher-brand {
      font-family: Orbitron, system-ui;
      font-size: .72rem;
      letter-spacing: .18em;
      color: var(--cyan);
      margin: 0 0 4px;
      text-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
    }
    .teacher-greeting {
      margin: 0;
      font-family: Orbitron, system-ui;
      font-size: clamp(1.05rem, 3.2vw, 1.35rem);
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1.25;
    }
    .teacher-sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.4;
      max-width: 42ch;
    }
    .teacher-admin-switch {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--touch);
      min-width: var(--touch);
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid rgba(139, 92, 246, 0.5);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.32), rgba(34, 211, 238, 0.12));
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: .82rem;
      letter-spacing: .02em;
      white-space: nowrap;
      box-shadow: var(--glow-violet);
      transition: border-color .15s ease, transform .12s ease, background .15s ease;
    }
    .teacher-admin-switch:hover,
    .teacher-admin-switch:focus-visible {
      border-color: rgba(167, 139, 250, 0.85);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.45), rgba(34, 211, 238, 0.22));
      outline: none;
    }
    .teacher-admin-switch:active { transform: scale(.98); }
    .teacher-admin-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.95);
      color: #0b1220;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tile--admin {
      border-color: rgba(139, 92, 246, 0.45);
      background:
        linear-gradient(160deg, rgba(139, 92, 246, 0.2), rgba(11, 20, 40, 0.92));
    }
    .tile--admin .tile-admin-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.95);
      color: #0b1220;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .teacher-toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;
    }
    .teacher-toolbar select, .teacher-toolbar input[type="date"] {
      min-height: var(--touch);
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(11, 20, 40, 0.88);
      color: var(--text);
      padding: 0 12px;
      flex: 1 1 140px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .teacher-toolbar select:focus-visible,
    .teacher-toolbar input[type="date"]:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }
    .teacher-main {
      padding: 16px 16px 28px;
      max-width: 960px;
      margin: 0 auto;
    }
    body.teacher-heute .teacher-top {
      padding: 10px 16px 8px;
    }
    body.teacher-heute .teacher-sub {
      margin-top: 2px;
      font-size: .82rem;
      max-width: none;
    }
    body.teacher-heute .teacher-toolbar {
      margin-top: 8px;
    }
    body.teacher-heute .teacher-main {
      max-width: none;
      width: 100%;
      padding: 10px 14px 20px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 0 12px;
    }
    .section-title {
      font-family: Orbitron, system-ui;
      font-size: .7rem;
      letter-spacing: .14em;
      color: #cbd5e1;
      margin: 0;
      text-transform: uppercase;
    }
    .section-count {
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .section-count.hot { color: #fecdd3; }

    /* ---- Attention banner ---- */
    .coach-banner {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 16px 16px 14px;
      border-radius: 20px;
      border: 1px solid rgba(251, 113, 133, 0.4);
      background:
        radial-gradient(circle at 0% 0%, rgba(251, 113, 133, 0.18), transparent 55%),
        linear-gradient(145deg, rgba(16, 27, 51, 0.96), rgba(11, 20, 40, 0.98));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28), 0 0 32px rgba(251, 113, 133, 0.08);
      margin-bottom: 14px;
      animation: bannerIn .45s ease both;
    }
    .coach-banner--calm {
      border-color: rgba(52, 211, 153, 0.35);
      background:
        radial-gradient(circle at 0% 0%, rgba(52, 211, 153, 0.14), transparent 55%),
        linear-gradient(145deg, rgba(16, 27, 51, 0.96), rgba(11, 20, 40, 0.98));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28), 0 0 28px rgba(52, 211, 153, 0.08);
    }
    .coach-banner--info {
      border-color: rgba(34, 211, 238, 0.3);
      background:
        radial-gradient(circle at 0% 0%, rgba(34, 211, 238, 0.12), transparent 55%),
        linear-gradient(145deg, rgba(16, 27, 51, 0.96), rgba(11, 20, 40, 0.98));
    }
    .coach-banner__mark {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(251, 113, 133, 0.16);
      color: #fecdd3;
      font-family: Orbitron, system-ui;
      font-weight: 800;
      font-size: .95rem;
    }
    .coach-banner--calm .coach-banner__mark {
      background: rgba(52, 211, 153, 0.14);
      color: #a7f3d0;
    }
    .coach-banner--info .coach-banner__mark {
      background: rgba(34, 211, 238, 0.14);
      color: #a5f3fc;
    }
    .coach-banner h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .coach-banner p {
      margin: 0;
      color: #cbd5e1;
      font-size: .88rem;
      line-height: 1.4;
    }

    /* ---- Tile grids ---- */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .tile-grid--stats { margin-bottom: 4px; }
    .tile-grid--tools { gap: 12px; }
    .tile-grid--insights { gap: 12px; }
    @media (min-width: 560px) {
      .tile-grid--students,
      .tile-grid--history,
      .tile-grid--insights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile-grid--tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile-grid--stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (min-width: 820px) {
      .tile-grid--students,
      .tile-grid--history { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tile-grid--insights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile-grid--tools { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: 96px;
      min-width: 0;
      padding: 14px 14px 13px;
      border-radius: var(--radius-tile);
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 40%),
        linear-gradient(165deg, rgba(16, 27, 51, 0.96), rgba(11, 20, 40, 0.98));
      color: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: border-color .18s ease, transform .14s ease, background .18s ease, box-shadow .18s ease;
      animation: tileIn .42s ease both;
    }
    .tile-grid > .tile:nth-child(1) { animation-delay: .02s; }
    .tile-grid > .tile:nth-child(2) { animation-delay: .06s; }
    .tile-grid > .tile:nth-child(3) { animation-delay: .1s; }
    .tile-grid > .tile:nth-child(4) { animation-delay: .14s; }
    .tile-grid > .tile:nth-child(5) { animation-delay: .18s; }
    .tile-grid > .tile:nth-child(6) { animation-delay: .22s; }
    .tile-grid > .tile:nth-child(n+7) { animation-delay: .26s; }
    button.tile { font: inherit; width: 100%; }
    a.tile { color: inherit; }
    .tile:hover {
      border-color: rgba(34, 211, 238, 0.28);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28), var(--glow-cyan);
    }
    .tile:active { transform: scale(.985); }
    .tile:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .tile--stat {
      min-height: 100px;
      cursor: default;
      background:
        linear-gradient(160deg, rgba(34, 211, 238, .12), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile--stat:hover { border-color: var(--line); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22); }
    .tile--stat.attn {
      background:
        linear-gradient(160deg, rgba(251, 113, 133, .18), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
      border-color: rgba(251, 113, 133, .4);
    }
    .tile--stat.positive {
      background:
        linear-gradient(160deg, rgba(52, 211, 153, .16), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
      border-color: rgba(52, 211, 153, .3);
    }
    .tile--stat.planned {
      background:
        linear-gradient(160deg, rgba(139, 92, 246, .16), transparent 55%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile .tile-label {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      line-height: 1.25;
    }
    .tile .tile-value {
      font-family: Orbitron, system-ui;
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    .tile .tile-hint {
      color: var(--muted);
      font-size: .72rem;
      margin-top: auto;
      line-height: 1.3;
    }
    .stat-bar {
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      margin-top: 2px;
    }
    .stat-bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), #38bdf8);
      width: 0;
      transition: width .55s ease;
    }
    .tile--stat.attn .stat-bar > span { background: linear-gradient(90deg, #fb7185, #f97316); }
    .tile--stat.positive .stat-bar > span { background: linear-gradient(90deg, #34d399, #22d3ee); }
    .tile--stat.planned .stat-bar > span { background: linear-gradient(90deg, #8b5cf6, #22d3ee); }

    .tile--insight {
      min-height: 148px;
      gap: 8px;
    }
    .tile--insight.priority-hoch {
      border-color: rgba(251, 113, 133, .5);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(251, 113, 133, 0.12);
      animation: tileIn .42s ease both, prioPulse 2.8s ease-in-out 0.6s infinite;
    }
    .tile--insight.priority-mittel { border-color: rgba(251, 191, 36, .4); }
    .tile--insight.priority-niedrig { border-color: rgba(52, 211, 153, .32); }
    .tile--insight .tile-title {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile--insight .tile-obs {
      margin: 0;
      color: #cbd5e1;
      font-size: .84rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile--insight .tile-prompt {
      margin: 0;
      font-size: .78rem;
      color: #a5f3fc;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.92;
    }
    .tile-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: .75rem;
      color: var(--muted);
    }
    .tile-meta .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: #e2e8f0;
    }
    .tile-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .tile-actions .btn {
      flex: 1;
      min-height: var(--touch);
      font-size: .84rem;
      padding: 0 10px;
    }

    .tile--student { min-height: 118px; }
    .tile--student.needs-attention {
      border-color: rgba(251, 113, 133, .45);
      background:
        linear-gradient(160deg, rgba(251, 113, 133, .12), transparent 50%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile--student.positive-signal {
      border-color: rgba(52, 211, 153, .3);
    }
    .tile--student .tile-name {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tile--student .tile-status {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .status-dots {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-top: auto;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(148, 163, 184, .35);
    }
    .status-dot.on { background: var(--cyan); box-shadow: 0 0 8px rgba(34, 211, 238, .45); }
    .status-dot.reflect { background: var(--green); box-shadow: 0 0 8px rgba(52, 211, 153, .4); }
    .status-dot.attn { background: var(--red); box-shadow: 0 0 8px rgba(251, 113, 133, .45); }

    .tile--class { min-height: 108px; }
    .tile--class.active {
      border-color: rgba(34, 211, 238, .55);
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, .28), var(--glow-cyan);
    }
    .tile--class h3 {
      margin: 0;
      font-family: Orbitron, system-ui;
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .tile--class .tile-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: .78rem;
      color: var(--muted);
    }
    .tile--class .metric strong {
      color: var(--text);
      font-weight: 700;
    }
    .tile--class .metric.hot strong { color: #fecdd3; }
    .class-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(251, 113, 133, 0.18);
      color: #fecdd3;
      font-size: .68rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
    }

    .tile--tool {
      min-height: 112px;
      padding-left: 16px;
      overflow: hidden;
    }
    .tile--tool::before {
      content: "";
      position: absolute;
      left: 0; top: 14px; bottom: 14px;
      width: 3px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--cyan), var(--violet));
    }
    .tile--tool.accent-orange::before { background: linear-gradient(180deg, var(--orange), #fbbf24); }
    .tile--tool.accent-green::before { background: linear-gradient(180deg, var(--green), var(--cyan)); }
    .tile--tool.accent-violet::before { background: linear-gradient(180deg, var(--violet), #a78bfa); }
    .tile--tool.accent-cyan::before { background: linear-gradient(180deg, var(--cyan), #38bdf8); }
    .tile--tool.accent-amber::before { background: linear-gradient(180deg, var(--amber), var(--orange)); }
    .tile--tool {
      background:
        linear-gradient(145deg, rgba(139, 92, 246, .1), transparent 48%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }
    .tile--tool .tile-kicker {
      font-family: Orbitron, system-ui;
      font-size: .62rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }
    .tile--tool h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .tile--tool p {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile--tool .tile-cta {
      margin-top: auto;
      font-size: .78rem;
      font-weight: 700;
      color: #a5f3fc;
    }
    .tile--danger {
      background:
        linear-gradient(145deg, rgba(251, 113, 133, .12), transparent 48%),
        linear-gradient(165deg, var(--panel), var(--panel-2));
    }

      border: 1px dashed rgba(148, 163, 184, 0.35);
      background: rgba(148, 163, 184, 0.06);
      font-size: .82rem;
    }
    .tc-past-stand p { margin: 4px 0 0; color: var(--muted); }
    .tc-detail-help {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(251, 113, 133, 0.4);
      background: rgba(251, 113, 133, 0.08);
      margin-bottom: 10px;
    }
    .tc-detail-help p { margin: 0 0 4px; }
    .tc-concern { color: #fecdd3; font-size: .85rem; }
    .tc-topic-people {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .tc-topic-person {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(5, 8, 22, 0.35);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font: inherit;
      font-size: .8rem;
    }
    .tc-topic-person strong { font-size: .9rem; margin-bottom: 2px; }
    .tc-topic-person:focus-visible { outline: 2px solid var(--cyan); }

    .hq-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: .74rem;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.12);
      color: #e2e8f0;
    }
    .hq-status-pill.st-help_open,
    .hq-status-pill.st-taken_over { background: rgba(251, 113, 133, 0.16); color: #fecdd3; }
    .hq-status-pill.st-goal_reached { background: rgba(52, 211, 153, 0.14); color: #a7f3d0; }
    .hq-status-pill.st-in_progress { background: rgba(34, 211, 238, 0.14); color: #a5f3fc; }
    .hq-dl {
      display: grid;
      gap: 8px;
      margin: 0 0 12px;
    }
    .hq-dl > div {
      display: grid;
      gap: 2px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .hq-dl dt {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
    }
    .hq-dl dd { margin: 0; font-size: .88rem; line-height: 1.35; word-break: break-word; }
    .hq-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .hq-footnote { margin: 10px 2px 0; font-size: .74rem; }
    .hq-toast {
      position: sticky;
      top: 8px;
      z-index: 5;
      margin-bottom: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(52, 211, 153, 0.4);
      background: rgba(6, 78, 59, 0.85);
      color: #a7f3d0;
      font-weight: 600;
      animation: bannerIn .25s ease both;
    }
    @keyframes bannerIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
