<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Temple of Logic</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2 {
      margin-bottom: 10px;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
    }
    button {
      background: #2b8a3e;
      color: white;
      border: none;
      cursor: pointer;
    }
    button.red {
      background: #b30000;
    }
    hr {
      margin: 20px 0;
      border: 1px solid #444;
    }
    .mission-img {
      height: 60px;
      border-radius: 4px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<h1>Admin-Bereich</h1>
<button onclick="logout()">Logout</button>

<hr>

<h2>Klassen</h2>
<input id="className" placeholder="Klassenname (z. B. 7a)">
<button onclick="createClass()">Klasse anlegen</button>

<h3>Klassenliste</h3>
<div id="classList"></div>

<hr>

<h2>Schüler:innen</h2>
<label>Aktive Klasse auswählen:</label>
<select id="activeClass" onchange="loadStudents()"></select>
<br>
<input id="studentName" placeholder="Name">
<input id="studentPass" placeholder="Passwort">
<button onclick="createStudent()">Schüler:in anlegen</button>

<h3>Schüler:innen dieser Klasse</h3>
<div id="studentList"></div>

<hr>

<h2>Missionen</h2>

<input id="missionName" placeholder="Missionsname">
<input id="missionXp" placeholder="XP" type="number" min="0">
<br>

<label>Bild (Pflicht):</label>
<input id="missionImg" type="file" accept="image/*">
<br>

<label>Upload erforderlich?</label>
<select id="missionRequired">
  <option value="false" selected>Nein</option>
  <option value="true">Ja</option>
</select>
<br>

<button onclick="createMission()">Mission anlegen</button>

<h3>Alle Missionen</h3>
<div id="missionList"></div>

<hr>

<script>
// =========================================================
// Helfer für JSON-API
// =========================================================
async function api(url, method = "GET", data = null) {
  const opt = { method, headers: {} };
  if (data) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(data);
  }
  const res = await fetch(url, opt);
  return await res.json().catch(() => ({}));
}

// =========================================================
// Logout
// =========================================================
async function logout() {
  await api("/api/logout", "POST");
  location.href = "/login.html";
}

// =========================================================
// Klassen
// =========================================================
async function loadClasses() {
  const data = await api("/api/class");
  const classList = document.getElementById("classList");
  const select = document.getElementById("activeClass");

  classList.innerHTML = "";
  select.innerHTML = "";

  data.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    select.appendChild(opt);

    const div = document.createElement("div");
    div.innerHTML = `
      ${c.name}
      <button class="red" onclick="deleteClass(${c.id})">Löschen</button>
    `;
    classList.appendChild(div);
  });

  // Nach dem Laden direkt Schüler:innen anzeigen
  if (data.length > 0) {
    await loadStudents();
  } else {
    document.getElementById("studentList").innerHTML = "";
  }
}

async function createClass() {
  const name = document.getElementById("className").value.trim();
  if (!name) return alert("Bitte Klassennamen eingeben.");

  const res = await api("/api/class", "POST", { name });
  if (!res.success) {
    alert(res.error || "Fehler beim Anlegen der Klasse.");
  }
  document.getElementById("className").value = "";
  await loadClasses();
}

async function deleteClass(id) {
  if (!confirm("Klasse wirklich löschen?")) return;
  await api(`/api/class/${id}`, "DELETE");
  await loadClasses();
}

// =========================================================
// Schüler:innen
// =========================================================
async function loadStudents() {
  const classId = document.getElementById("activeClass").value;
  if (!classId) {
    document.getElementById("studentList").innerHTML = "";
    return;
  }

  const data = await api(`/api/student?classId=${classId}`);
  const list = document.getElementById("studentList");
  list.innerHTML = "";

  data.forEach(s => {
    const div = document.createElement("div");
    div.innerHTML = `
      ${s.name}
      <button class="red" onclick="deleteStudent(${s.id})">Löschen</button>
    `;
    list.appendChild(div);
  });
}

async function createStudent() {
  const name = document.getElementById("studentName").value.trim();
  const password = document.getElementById("studentPass").value;
  const classId = document.getElementById("activeClass").value;

  if (!classId) return alert("Bitte zuerst eine Klasse auswählen.");
  if (!name || !password) return alert("Name und Passwort eingeben.");

  const res = await api("/api/student", "POST", { name, password, classId });
  if (!res.success) {
    alert(res.error || "Fehler beim Anlegen der Schüler:in.");
  }

  document.getElementById("studentName").value = "";
  document.getElementById("studentPass").value = "";

  await loadStudents();
}

async function deleteStudent(id) {
  if (!confirm("Schüler:in wirklich löschen?")) return;
  await api(`/api/student/${id}`, "DELETE");
  await loadStudents();
}

// =========================================================
// Missionen
// =========================================================
async function createMission() {
  const name = document.getElementById("missionName").value.trim();
  const xpRaw = document.getElementById("missionXp").value;
  const requireUpload = document.getElementById("missionRequired").value;
  const file = document.getElementById("missionImg").files[0];

  if (!name) return alert("Bitte Missionsnamen eingeben.");
  if (!xpRaw) return alert("Bitte XP-Wert eingeben.");
  const xp = parseInt(xpRaw, 10);
  if (isNaN(xp)) return alert("XP muss eine Zahl sein.");
  if (!file) return alert("Ein Bild ist Pflicht für diese Mission.");

  // 1. Upload zu R2
  const form = new FormData();
  form.append("image", file);

  const uploadRes = await fetch("/api/missions/upload", {
    method: "POST",
    body: form,
  }).then(r => r.json());

  if (!uploadRes.success) {
    alert(uploadRes.error || "Upload fehlgeschlagen.");
    return;
  }

  const imageUrl = uploadRes.url;

  // 2. Mission speichern
  const saveRes = await api("/api/missions", "POST", {
    name,
    xp,
    imageUrl,
    requireUpload,
  });

  if (!saveRes.success) {
    alert(saveRes.error || "Fehler beim Speichern der Mission.");
    return;
  }

  // Felder zurücksetzen
  document.getElementById("missionName").value = "";
  document.getElementById("missionXp").value = "";
  document.getElementById("missionImg").value = "";
  document.getElementById("missionRequired").value = "false";

  await loadMissions();
}

async function loadMissions() {
  const data = await api("/api/missions");
  const list = document.getElementById("missionList");
  list.innerHTML = "";

  data.forEach(m => {
    const div = document.createElement("div");
    div.innerHTML = `
      <strong>${m.name}</strong> – ${m.xp} XP<br>
      Upload erforderlich: ${m.require_upload ? "Ja" : "Nein"}<br>
      ${m.image_url ? `<img class="mission-img" src="${m.image_url}" alt="Mission">` : ""}
      <br>
      <button class="red" onclick="deleteMission(${m.id})">Löschen</button>
      <hr>
    `;
    list.appendChild(div);
  });
}

async function deleteMission(id) {
  if (!confirm("Mission wirklich löschen?")) return;
  await api(`/api/missions/${id}`, "DELETE");
  await loadMissions();
}

// =========================================================
// INIT
// =========================================================
(async function init() {
  await loadClasses();
  await loadMissions();
})();
</script>

</body>
</html>
