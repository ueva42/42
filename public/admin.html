<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Admin-Bereich</title>
  <style>
    body { background:#111; color:#fff; font-family:Arial; padding:20px; }
    h1, h2, h3 { margin-top:30px; }
    input, select { padding:5px; margin:5px; }
    button { padding:6px 12px; background:#116611; color:#fff; border:none; cursor:pointer; }
    button.red { background:#661111; }
    .box { border:1px solid #444; padding:15px; margin-top:20px; }
    .row { margin:8px 0; }
    img.upload-thumb { width:80px; height:80px; object-fit:cover; border:1px solid #555; margin-right:10px; }
  </style>
</head>
<body>

<h1>Admin-Bereich</h1>
<button onclick="logout()">Logout</button>


<!-- ========================================================= -->
<!--  XP VERGABE (OBEN)                                        -->
<!-- ========================================================= -->

<div class="box">
  <h2>XP-Vergabe</h2>

  <div>
    <label>Klasse wählen:</label>
    <select id="xpClassSelect" onchange="loadXPStudents(); loadUploads(); loadMissions();"></select>
  </div>

  <div id="xpStudentList"></div>

  <div style="margin-top:15px;">
    <label>XP direkt vergeben:</label>
    <input id="xpDelta" type="number" value="5" />
    <button onclick="grantDirectXP()">XP vergeben</button>
  </div>

  <div style="margin-top:15px;">
    <label>Mission auswählen:</label>
    <select id="missionSelect"></select>
    <button onclick="grantMissionXP()">Mission-XP vergeben</button>
  </div>

  <h3 style="margin-top:20px;">Uploads dieser Klasse</h3>
  <div id="uploadList"></div>
</div>



<!-- ========================================================= -->
<!--  KLASSEN                                                  -->
<!-- ========================================================= -->

<div class="box">
  <h2>Klassen</h2>

  <input id="className" placeholder="Klassenname (z. B. 7a)">
  <button onclick="addClass()">Klasse anlegen</button>

  <h3>Klassenliste</h3>
  <div id="classList"></div>
</div>



<!-- ========================================================= -->
<!--  SCHÜLER:INNEN                                            -->
<!-- ========================================================= -->

<div class="box">
  <h2>Schüler:innen</h2>

  <label>Aktive Klasse:</label>
  <select id="studentClassSelect" onchange="loadStudents()"></select>

  <div class="row">
    <input id="studentName" placeholder="Name">
    <input id="studentPass" placeholder="Passwort">
    <button onclick="addStudent()">Schüler:in anlegen</button>
  </div>

  <h3>Schüler:innen dieser Klasse</h3>
  <div id="studentList"></div>
</div>



<!-- ========================================================= -->
<!--  MISSIONEN                                                -->
<!-- ========================================================= -->

<div class="box">
  <h2>Missionen</h2>

  <input id="missionName" placeholder="Missionsname">
  <input id="missionXP" type="number" placeholder="XP">
  
  <div class="row">
    <label>Bild (Pflicht):</label>
    <input type="file" id="missionImage">
    <button onclick="uploadMissionImage()">Bild hochladen</button>
  </div>

  <div class="row">
    <label>Upload erforderlich?</label>
    <select id="missionUploadRequired">
      <option value="false">Nein</option>
      <option value="true">Ja</option>
    </select>
  </div>

  <input type="hidden" id="missionImageUrl">

  <button onclick="addMission()">Mission anlegen</button>

  <h3>Alle Missionen</h3>
  <div id="missionList"></div>
</div>


<script>
// =========================================================
// Hilfsfunktionen
// =========================================================

async function api(url, method="GET", data=null) {
  let opt = { method, headers:{} };
  if (data) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(data);
  }
  const res = await fetch(url, opt);
  return res.json();
}

function $(id){ return document.getElementById(id); }


// =========================================================
// LOGIN / LOGOUT
// =========================================================

async function logout(){
  await api("/api/logout", "POST");
  window.location.href = "/login.html";
}


// =========================================================
// KLASSEN
// =========================================================

async function loadClasses(){
  const list = await api("/api/class");
  const classSel1 = $("xpClassSelect");
  const classSel2 = $("studentClassSelect");
  const classList = $("classList");

  classSel1.innerHTML = "";
  classSel2.innerHTML = "";
  classList.innerHTML = "";

  list.forEach(c => {
    const o1 = document.createElement("option");
    const o2 = document.createElement("option");
    o1.value = o2.value = c.id;
    o1.textContent = o2.textContent = c.name;
    classSel1.appendChild(o1);
    classSel2.appendChild(o2);

    classList.innerHTML += `
      <div>
        ${c.name}
        <button class="red" onclick="deleteClass(${c.id})">Löschen</button>
      </div>
    `;
  });

  loadStudents();
  loadXPStudents();
}

async function addClass(){
  const name = $("className").value;
  if(!name.trim()) return alert("Name fehlt");
  await api("/api/class", "POST", { name });
  $("className").value = "";
  loadClasses();
}

async function deleteClass(id){
  if(!confirm("Klasse löschen?")) return;
  await api("/api/class/"+id, "DELETE");
  loadClasses();
}



// =========================================================
// SCHÜLER:INNEN
// =========================================================

async function loadStudents(){
  const classId = $("studentClassSelect").value;
  if(!classId) return;

  const list = await api("/api/student?classId="+classId);
  const box = $("studentList");
  box.innerHTML = "";

  list.forEach(s => {
    box.innerHTML += `
      <div>
        ${s.name}
        <button class="red" onclick="deleteStudent(${s.id})">Löschen</button>
      </div>
    `;
  });
}

async function addStudent(){
  const classId = $("studentClassSelect").value;
  const name = $("studentName").value;
  const pass = $("studentPass").value;

  await api("/api/student", "POST", { name, password:pass, classId });
  $("studentName").value = "";
  $("studentPass").value = "";
  
  loadStudents();
  loadXPStudents();
}

async function deleteStudent(id){
  if(!confirm("Schüler:in löschen?")) return;
  await api("/api/student/"+id, "DELETE");
  loadStudents();
  loadXPStudents();
}



// =========================================================
// XP VERGABE
// =========================================================

async function loadXPStudents(){
  const classId = $("xpClassSelect").value;
  if(!classId) return;

  const students = await api("/api/student?classId="+classId);
  const box = $("xpStudentList");
  box.innerHTML = "";

  students.forEach(s=>{
    box.innerHTML += `
      <div>
        <input type="checkbox" class="xpCheck" value="${s.id}">
        ${s.name} – XP: ${s.xp}
      </div>
    `;
  });
}

function selectedStudentIds(){
  return [...document.querySelectorAll(".xpCheck:checked")].map(c => c.value);
}

async function grantDirectXP(){
  const classId = $("xpClassSelect").value;
  const ids = selectedStudentIds();
  const xp = $("xpDelta").value;

  if(ids.length === 0){
    if(!confirm("An ALLE Schüler XP vergeben?")) return;
    await api("/api/xp/grant","POST",{ classId, applyToAll:true, xpDelta:xp });
  } else {
    await api("/api/xp/grant","POST",{ studentIds:ids, xpDelta:xp });
  }

  loadXPStudents();
}

async function loadMissions(){
  const list = await api("/api/missions");
  const sel = $("missionSelect");
  const box = $("missionList");
  sel.innerHTML = "";
  box.innerHTML = "";

  list.forEach(m=>{
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.name + " ("+m.xp+" XP)";
    sel.appendChild(opt);

    box.innerHTML += `
      <div>
        <img src="${m.image_url}" class="upload-thumb">
        ${m.name} – ${m.xp} XP – Upload: ${m.require_upload ? "Ja" : "Nein"}
        <button class="red" onclick="deleteMission(${m.id})">Löschen</button>
      </div>
    `;
  });
}

async function grantMissionXP(){
  const missionId = $("missionSelect").value;
  const ids = selectedStudentIds();
  const classId = $("xpClassSelect").value;

  if(ids.length === 0){
    if(!confirm("Mission-XP an ALLE Schüler:innen geben?")) return;
    await api("/api/xp/grant","POST",{ classId, applyToAll:true, missionId });
  } else {
    await api("/api/xp/grant","POST",{ studentIds:ids, missionId });
  }

  loadXPStudents();
}



// =========================================================
// MISSIONEN
// =========================================================

async function uploadMissionImage(){
  const file = $("missionImage").files[0];
  if(!file) return alert("Kein Bild ausgewählt");

  const fd = new FormData();
  fd.append("image", file);

  const res = await fetch("/api/missions/upload", { method:"POST", body:fd });
  const json = await res.json();

  if(!json.success) return alert("Upload fehlgeschlagen");
  $("missionImageUrl").value = json.url;
  alert("Bild erfolgreich hochgeladen");
}

async function addMission(){
  const name = $("missionName").value;
  const xp = $("missionXP").value;
  const imageUrl = $("missionImageUrl").value;
  const requireUpload = $("missionUploadRequired").value;

  if(!imageUrl) return alert("Bitte zuerst ein Bild hochladen!");

  await api("/api/missions","POST",{ name, xp, imageUrl, requireUpload });
  $("missionName").value = "";
  $("missionXP").value = "";
  $("missionImageUrl").value = "";
  $("missionImage").value = "";

  loadMissions();
}

async function deleteMission(id){
  if(!confirm("Mission löschen?")) return;
  await api("/api/missions/"+id,"DELETE");
  loadMissions();
}



// =========================================================
// UPLOADS DER SCHÜLER:INNEN (ADMIN)
// =========================================================

async function loadUploads(){
  const classId = $("xpClassSelect").value;
  if(!classId) return;

  const list = await api("/api/uploads?classId="+classId);
  const box = $("uploadList");
  box.innerHTML = "";

  list.forEach(u=>{
    box.innerHTML += `
      <div>
        <img src="${u.image_url}" class="upload-thumb">
        <b>${u.student_name}</b> – ${u.mission_name}
        <button class="red" onclick="deleteUpload(${u.id})">Löschen</button>
      </div>
    `;
  });
}

async function deleteUpload(id){
  if(!confirm("Upload löschen?")) return;
  await api("/api/uploads/"+id,"DELETE");
  loadUploads();
}



// =========================================================
// INIT
// =========================================================

loadClasses();
loadMissions();
</script>

</body>
</html>
