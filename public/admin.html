<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Temple of Logic</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2 {
      margin-bottom: 10px;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
    }
    button {
      background: #2b8a3e;
      color: white;
      border: none;
      cursor: pointer;
    }
    button.red {
      background: #b30000;
    }
    hr {
      margin: 20px 0;
      border: 1px solid #444;
    }
    .mission-img {
      height: 60px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<h1>Admin-Bereich</h1>
<button onclick="logout()">Logout</button>

<hr>

<!-- ========================================== -->
<!-- KLASSEN + SCHÜLER:INNEN -->
<!-- ========================================== -->

<h2>Klassen</h2>

<input id="className" placeholder="Klassenname (z. B. 7a)">
<button onclick="createClass()">Klasse anlegen</button>

<h3>Klassenliste</h3>
<div id="classList"></div>

<hr>

<h2>Schüler:innen</h2>

<label>Aktive Klasse auswählen:</label>
<select id="activeClass" onchange="loadStudents()"></select>

<br>

<input id="studentName" placeholder="Name">
<input id="studentPass" placeholder="Passwort">
<button onclick="createStudent()">Schüler:in anlegen</button>

<h3>Schüler:innen dieser Klasse</h3>
<div id="studentList"></div>

<hr>

<!-- ========================================== -->
<!-- MISSIONEN -->
<!-- ========================================== -->

<h2>Missionen</h2>

<input id="missionName" placeholder="Missionsname">
<input id="missionXP" placeholder="XP" type="number">

<br>

<label>Bild (optional):</label>
<input id="missionImg" type="file">

<br>

<label>Upload erforderlich?</label>
<select id="missionRequired">
  <option value="false">Nein</option>
  <option value="true">Ja</option>
</select>

<br>

<button onclick="createMission()">Mission anlegen</button>

<h3>Alle Missionen</h3>
<div id="missionList"></div>

<hr>

<script>
// =========================================================
// API HELPER
// =========================================================
async function api(url, method="GET", data=null) {
  const opt = { method, headers: {} };
  if (data) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(data);
  }
  const res = await fetch(url, opt);
  return await res.json().catch(() => ({}));
}

// =========================================================
// LOGOUT
// =========================================================
async function logout() {
  await api("/api/logout", "POST");
  location.href = "/login.html";
}

// =========================================================
// KLASSEN
// =========================================================

async function loadClasses() {
  const data = await api("/api/class");

  const classList = document.getElementById("classList");
  classList.innerHTML = "";

  const select = document.getElementById("activeClass");
  select.innerHTML = "";

  data.forEach(c => {
    // Dropdown
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    select.appendChild(opt);

    // Liste
    const div = document.createElement("div");
    div.innerHTML = `
      ${c.name}
      <button class="red" onclick="deleteClass(${c.id})">Löschen</button>
    `;
    classList.appendChild(div);
  });
}

async function createClass() {
  const name = document.getElementById("className").value;
  if (!name) return alert("Name angeben");

  await api("/api/class", "POST", { name });
  await loadClasses();
}

async function deleteClass(id) {
  await api(`/api/class/${id}`, "DELETE");
  await loadClasses();
}

// =========================================================
// SCHÜLER:INNEN
// =========================================================

async function loadStudents() {
  const classId = document.getElementById("activeClass").value;

  const data = await api(`/api/student?classId=${classId}`);

  const list = document.getElementById("studentList");
  list.innerHTML = "";

  data.forEach(s => {
    const div = document.createElement("div");
    div.innerHTML = `
      ${s.name}
      <button class="red" onclick="deleteStudent(${s.id})">Löschen</button>
    `;
    list.appendChild(div);
  });
}

async function createStudent() {
  const name = document.getElementById("studentName").value;
  const password = document.getElementById("studentPass").value;
  const classId = document.getElementById("activeClass").value;

  if (!name || !password || !classId) return alert("Bitte alles ausfüllen.");

  await api("/api/student", "POST", { name, password, classId });
  await loadStudents();
}

async function deleteStudent(id) {
  await api(`/api/student/${id}`, "DELETE");
  await loadStudents();
}

// =========================================================
// MISSIONEN
// =========================================================

async function createMission() {
  const name = document.getElementById("missionName").value;
  const xp = document.getElementById("missionXP").value;
  const requireUpload = document.getElementById("missionRequired").value === "true";
  const file = document.getElementById("missionImg").files[0];

  let imageUrl = "";

  // 1) File upload falls vorhanden
  if (file) {
    const form = new FormData();
    form.append("image", file);

    const res = await fetch("/api/missions/upload", {
      method: "POST",
      body: form
    }).then(r => r.json());

    if (!res.success) return alert("Upload fehlgeschlagen");

    imageUrl = res.url;
  }

  // 2) Mission speichern
  await api("/api/missions", "POST", {
    name,
    xp,
    imageUrl,
    requireUpload
  });

  await loadMissions();
}

// Missionen laden
async function loadMissions() {
  const data = await api("/api/missions");

  const list = document.getElementById("missionList");
  list.innerHTML = "";

  data.forEach(m => {
    const div = document.createElement("div");
    div.innerHTML = `
      <strong>${m.name}</strong> – ${m.xp} XP 
      ${m.image_url ? `<br><img class="mission-img" src="${m.image_url}">` : ""}
      <br>Upload erforderlich: ${m.require_upload ? "Ja" : "Nein"}
      <br>
      <button class="red" onclick="deleteMission(${m.id})">Löschen</button>
      <hr>
    `;
    list.appendChild(div);
  });
}

async function deleteMission(id) {
  await api(`/api/missions/${id}`, "DELETE");
  await loadMissions();
}

// =========================================================
// INIT
// =========================================================
(async function init() {
  await loadClasses();
  await loadStudents();
  await loadMissions();
})();
</script>

</body>
</html>
