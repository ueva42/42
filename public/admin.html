<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Temple of Logic</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #000;
      padding: 20px;
      height: 100vh;
      border-right: 2px solid #222;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      background: #222;
      border: 1px solid #555;
      color: white;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #333;
    }

    /* Content */
    .content {
      flex-grow: 1;
      padding: 20px;
    }

    .hidden {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table td, table th {
      border: 1px solid #444;
      padding: 8px;
    }

    input, select {
      padding: 6px;
      margin: 4px;
    }

    button.action {
      background: #009933;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      color: white;
      margin-left: 3px;
    }

    button.action:hover {
      background: #00bb44;
    }

    .thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Admin</h2>
    <button onclick="showTab('xpTab')">XP-Verwaltung</button>
    <button onclick="showTab('classTab')">Klassen & Schüler:innen</button>
    <button onclick="showTab('missionTab')">Missionen</button>
    <button onclick="showTab('bonusTab')">Bonuskarten</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- =============================================== -->
    <!-- XP VERWALTUNG (Startseite) -->
    <!-- =============================================== -->
    <div id="xpTab" class="tab">
      <h1>XP-Verwaltung</h1>

      <label>Aktive Klasse wählen:</label>
      <select id="xpClassSelect" onchange="loadXPStudents()"></select>

      <h3>Schüler:innen dieser Klasse</h3>
      <table id="xpStudentTable">
        <thead>
          <tr>
            <th>Auswahl</th>
            <th>Name</th>
            <th>XP</th>
            <th>Uploads</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>XP vergeben</h3>
      <input type="number" id="xpValue" placeholder="XP" />
      <button class="action" onclick="addXP()">XP an ausgewählte</button>
      <button class="action" onclick="addXPToAll()">XP an alle</button>

      <h3>Mission XP</h3>
      <select id="xpMissionSelect"></select>
      <button class="action" onclick="missionXP()">Mission an ausgewählte</button>
      <button class="action" onclick="missionXPAll()">Mission an alle</button>
    </div>

    <!-- =============================================== -->
    <!-- KLASSEN & SCHÜLER -->
    <!-- =============================================== -->
    <div id="classTab" class="tab hidden">
      <h1>Klassen & Schüler:innen</h1>

      <h3>Neue Klasse anlegen</h3>
      <input id="newClassName" placeholder="Klassenname (7a)" />
      <button class="action" onclick="addClass()">Klasse anlegen</button>

      <h3>Klassenliste</h3>
      <table id="classList"></table>

      <h3>Schüler:in anlegen</h3>
      <select id="studentClassSelect"></select>
      <input id="studentName" placeholder="Name" />
      <input id="studentPw" placeholder="Passwort" />
      <button class="action" onclick="addStudent()">Schüler:in anlegen</button>

      <h3>Schülerliste</h3>
      <table id="studentList"></table>
    </div>

    <!-- =============================================== -->
    <!-- MISSIONEN -->
    <!-- =============================================== -->
    <div id="missionTab" class="tab hidden">
      <h1>Missionen</h1>

      <h3>Neue Mission</h3>
      <input id="missionName" placeholder="Name" />
      <input id="missionXP" type="number" placeholder="XP" />
      <input id="missionImage" type="file" />
      <label>Upload erforderlich?</label>
      <select id="missionReq">
        <option value="false">Nein</option>
        <option value="true">Ja</option>
      </select>
      <button class="action" onclick="createMission()">Mission anlegen</button>

      <h3>Alle Missionen</h3>
      <table id="missionList"></table>
    </div>

    <!-- =============================================== -->
    <!-- BONUSKARTEN -->
    <!-- =============================================== -->
    <div id="bonusTab" class="tab hidden">
      <h1>Bonuskarten</h1>

      <h3>Neue Bonuskarte</h3>
      <input id="bonusName" placeholder="Name" />
      <input id="bonusCost" type="number" placeholder="XP Kosten" />
      <input id="bonusImage" type="file" />
      <button class="action" onclick="createBonus()">Bonuskarte anlegen</button>

      <h3>Alle Bonuskarten</h3>
      <table id="bonusList"></table>
    </div>

  </div> <!-- content -->

  <script>
    const API = "";

    // ==============================
    // Sidebar Tabs
    // ==============================
    function showTab(id) {
      document.querySelectorAll(".tab").forEach(t => t.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }

    // ==============================
    // Logout
    // ==============================
    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      window.location = "/login.html";
    }

    // ============================================================
    // XP VERWALTUNG
    // ============================================================

    async function loadXPClasses() {
      const r = await fetch("/api/class");
      const list = await r.json();
      const sel = document.getElementById("xpClassSelect");
      sel.innerHTML = "";
      list.forEach(c => {
        const o = document.createElement("option");
        o.value = c.id;
        o.textContent = c.name;
        sel.appendChild(o);
      });
      loadXPStudents();
    }

    async function loadXPStudents() {
      const classId = document.getElementById("xpClassSelect").value;
      if (!classId) return;

      const r = await fetch("/api/student?classId=" + classId);
      const students = await r.json();

      const tbl = document.querySelector("#xpStudentTable tbody");
      tbl.innerHTML = "";

      for (const s of students) {
        const uploads = await fetch("/api/admin/uploads/" + s.id).then(r => r.json());

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="checkbox" value="${s.id}"></td>
          <td>${s.name}</td>
          <td>${s.xp}</td>
          <td>
            ${uploads
              .map(
                u =>
                  `<img src="${u.image_url}" class="thumb">
                   <button onclick="deleteUpload(${u.id})">Löschen</button>`
              )
              .join("<br>")}
          </td>
        `;
        tbl.appendChild(tr);
      }
    }

    function getXPSelected() {
      return [...document.querySelectorAll("#xpStudentTable input[type=checkbox]:checked")].map(
        c => Number(c.value)
      );
    }

    async function addXP() {
      const ids = getXPSelected();
      const xp = Number(document.getElementById("xpValue").value);
      if (!ids.length) return alert("Keine Schüler ausgewählt");

      await fetch("/api/xp/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentIds: ids, xp }),
      });
      loadXPStudents();
    }

    async function addXPToAll() {
      const xp = Number(document.getElementById("xpValue").value);
      const ids = [...document.querySelectorAll("#xpStudentTable input[type=checkbox]")]
        .map(c => Number(c.value));
      await fetch("/api/xp/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentIds: ids, xp }),
      });
      loadXPStudents();
    }

    async function loadMissionsForXP() {
      const r = await fetch("/api/missions");
      const missions = await r.json();
      const sel = document.getElementById("xpMissionSelect");
      sel.innerHTML = "";
      missions.forEach(m => {
        const o = document.createElement("option");
        o.value = m.id;
        o.textContent = `${m.name} (+${m.xp} XP)`;
        sel.appendChild(o);
      });
    }

    async function missionXP() {
      const ids = getXPSelected();
      const missionId = document.getElementById("xpMissionSelect").value;
      if (!ids.length) return alert("Keine Schüler ausgewählt");

      await fetch("/api/xp/mission", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentIds: ids, missionId }),
      });
      loadXPStudents();
    }

    async function missionXPAll() {
      const missionId = document.getElementById("xpMissionSelect").value;
      const ids = [...document.querySelectorAll("#xpStudentTable input[type=checkbox]")]
        .map(c => Number(c.value));

      await fetch("/api/xp/mission", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentIds: ids, missionId }),
      });
      loadXPStudents();
    }

    async function deleteUpload(id) {
      await fetch("/api/upload/" + id, { method: "DELETE" });
      loadXPStudents();
    }

    // ============================================================
    // KLASSEN / SCHÜLER
    // ============================================================

    async function loadClasses() {
      const r = await fetch("/api/class");
      const list = await r.json();

      const ctbl = document.getElementById("classList");
      ctbl.innerHTML = "<tr><th>Name</th><th>Aktionen</th></tr>";

      const sel = document.getElementById("studentClassSelect");
      sel.innerHTML = "";

      list.forEach(c => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${c.name}</td>
          <td><button onclick="deleteClass(${c.id})">Löschen</button></td>
        `;
        ctbl.appendChild(tr);

        const o = document.createElement("option");
        o.value = c.id;
        o.textContent = c.name;
        sel.appendChild(o);
      });

      loadStudents();
    }

    async function addClass() {
      const name = document.getElementById("newClassName").value;
      await fetch("/api/class", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      loadClasses();
    }

    async function deleteClass(id) {
      await fetch("/api/class/" + id, { method: "DELETE" });
      loadClasses();
    }

    async function loadStudents() {
      const classId = document.getElementById("studentClassSelect").value;
      const r = await fetch("/api/student?classId=" + classId);
      const list = await r.json();

      const tbl = document.getElementById("studentList");
      tbl.innerHTML = "<tr><th>Name</th><th>Passwort</th><th>Aktionen</th></tr>";

      list.forEach(s => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${s.name}</td>
          <td>${s.password}</td>
          <td><button onclick="deleteStudent(${s.id})">Löschen</button></td>
        `;
        tbl.appendChild(tr);
      });
    }

    async function addStudent() {
      const name = document.getElementById("studentName").value;
      const password = document.getElementById("studentPw").value;
      const classId = document.getElementById("studentClassSelect").value;

      await fetch("/api/student", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, password, classId }),
      });
      loadStudents();
    }

    async function deleteStudent(id) {
      await fetch("/api/student/" + id, { method: "DELETE" });
      loadStudents();
    }

    // ============================================================
    // MISSIONEN
    // ============================================================

    async function loadMissions() {
      const r = await fetch("/api/missions");
      const list = await r.json();

      const tbl = document.getElementById("missionList");
      tbl.innerHTML = "<tr><th>Name</th><th>XP</th><th>Bild</th><th>Upload?</th><th>Aktionen</th></tr>";

      list.forEach(m => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.name}</td>
          <td>${m.xp}</td>
          <td>${m.image_url ? `<img src="${m.image_url}" class="thumb">` : "-"}</td>
          <td>${m.require_upload ? "Ja" : "Nein"}</td>
          <td><button onclick="deleteMission(${m.id})">Löschen</button></td>
        `;
        tbl.appendChild(tr);
      });
    }

    async function createMission() {
      const name = document.getElementById("missionName").value;
      const xp = Number(document.getElementById("missionXP").value);
      const file = document.getElementById("missionImage").files[0];
      const requireUpload = document.getElementById("missionReq").value;

      let imageUrl = "";

      if (file) {
        const fd = new FormData();
        fd.append("image", file);
        const r = await fetch("/api/missions/upload", {
          method: "POST",
          body: fd,
        });
        const j = await r.json();
        if (!j.success) return alert("Upload fehlgeschlagen");
        imageUrl = j.url;
      }

      await fetch("/api/missions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, xp, imageUrl, requireUpload }),
      });

      loadMissions();
      loadMissionsForXP();
    }

    async function deleteMission(id) {
      await fetch("/api/missions/" + id, { method: "DELETE" });
      loadMissions();
      loadMissionsForXP();
    }

    // ============================================================
    // BONUSKARTEN
    // ============================================================

    async function loadBonuscards() {
      const r = await fetch("/api/bonuscards");
      const list = await r.json();

      const tbl = document.getElementById("bonusList");
      tbl.innerHTML = "<tr><th>Name</th><th>Kosten</th><th>Bild</th><th>Aktionen</th></tr>";

      list.forEach(b => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${b.name}</td>
          <td>${b.xp_cost}</td>
          <td>${b.image_url ? `<img src="${b.image_url}" class="thumb">` : "-"}</td>
          <td><button onclick="deleteBonus(${b.id})">Löschen</button></td>
        `;
        tbl.appendChild(tr);
      });
    }

    async function createBonus() {
      const name = document.getElementById("bonusName").value;
      const xp_cost = Number(document.getElementById("bonusCost").value);
      const file = document.getElementById("bonusImage").files[0];

      let url = "";

      if (file) {
        const fd = new FormData();
        fd.append("image", file);
        const r = await fetch("/api/bonuscards/upload", {
          method: "POST",
          body: fd,
        });
        const j = await r.json();
        if (!j.success) return alert("Upload fehlgeschlagen");
        url = j.url;
      }

      await fetch("/api/bonuscards", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, xp_cost, imageUrl: url }),
      });

      loadBonuscards();
    }

    async function deleteBonus(id) {
      await fetch("/api/bonuscards/" + id, { method: "DELETE" });
      loadBonuscards();
    }

    // ============================================================
    // INIT
    // ============================================================

    async function init() {
      showTab("xpTab");
      await loadXPClasses();
      await loadMissionsForXP();
      await loadClasses();
      await loadBonuscards();
      await loadMissions();
    }

    init();
  </script>
</body>
</html>
