<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin – Temple of Logic</title>
<style>
  body {
    margin:0;
    background:#0d0d0d;
    color:#fff;
    font-family:Arial, sans-serif;
    display:flex;
  }

  /* SIDEBAR */
  #sidebar {
    width:70px;
    background:#000;
    border-right:1px solid #222;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding-top:20px;
    align-items:center;
    gap:25px;
    position:fixed;
    left:0;
    top:0;
  }

  .icon-btn {
    width:50px;
    height:50px;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.15s;
  }
  .icon-btn:hover {
    background:#222;
  }

  .icon-btn svg {
    width:26px;
    height:26px;
    fill:#fff;
  }

  /* CONTENT WRAPPER */
  #content {
    margin-left:90px;
    padding:25px;
    width:calc(100% - 90px);
  }

  h1, h2, h3 { margin-top:20px; }

  .box {
    border:1px solid #333;
    background:#111;
    padding:15px;
    margin-top:25px;
    border-radius:10px;
  }

  button {
    padding:6px 12px;
    border:none;
    cursor:pointer;
    background:#116611;
    color:white;
    margin:4px;
    border-radius:6px;
  }
  button.red { background:#661111; }

  select, input {
    padding:6px;
    margin:4px;
    border-radius:6px;
    border:1px solid #222;
    background:#222;
    color:#fff;
  }

  .student-row {
    border-bottom:1px solid #333;
    padding:8px 0;
  }

  img.thumb {
    width:70px;
    height:70px;
    border:1px solid #444;
    border-radius:6px;
    object-fit:cover;
  }

  .upload-line {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:4px;
  }
</style>
</head>
<body>

<!-- ========================================================= -->
<!-- SIDEBAR                                                   -->
<!-- ========================================================= -->
<div id="sidebar">

  <!-- XP Verwaltung -->
  <div class="icon-btn" onclick="showPage('xpPage')" title="XP-Verwaltung">
    <svg viewBox="0 0 24 24"><path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8L12 2Z"/></svg>
  </div>

  <!-- Klassen & Schüler -->
  <div class="icon-btn" onclick="showPage('classPage')" title="Klassen & Schüler:innen">
    <svg viewBox="0 0 24 24"><path d="M12 2C10.34 2 9 3.34 9 5S10.34 8 12 8 15 6.66 15 5 13.66 2 12 2M6 8C4.34 8 3 9.34 3 11S4.34 14 6 14 9 12.66 9 11 7.66 8 6 8M18 8C16.34 8 15 9.34 15 11S16.34 14 18 14 21 12.66 21 11 19.66 8 18 8M6 16C3.33 16 0 17.34 0 20V22H12V20C12 17.34 8.67 16 6 16M18 16C16.07 16 13.27 16.84 12.23 18.65C12.54 18.94 12.83 19.27 13.08 19.65C13.81 20.85 14 22 14 22H24V20C24 17.34 20.67 16 18 16Z"/></svg>
  </div>

  <!-- Missionen -->
  <div class="icon-btn" onclick="showPage('missionPage')" title="Missionen">
    <svg viewBox="0 0 24 24"><path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z"/></svg>
  </div>

  <!-- Bonuskarten -->
  <div class="icon-btn" onclick="alert('Kommt später')" title="Bonuskarten">
    <svg viewBox="0 0 24 24"><path d="M20,2H4A2,2 0 0,0 2,4V20A2,2 0 0,0 4,22H20A2,2 0 0,0 22,20V4A2,2 0 0,0 20,2M11,17H6V15H11V17M18,13H6V11H18V13M18,9H6V7H18V9Z"/></svg>
  </div>

  <!-- Charakter & Level -->
  <div class="icon-btn" onclick="alert('Kommt später')" title="Charakter & Level">
    <svg viewBox="0 0 24 24"><path d="M12 12C14.67 12 17 9.67 17 7S14.67 2 12 2 7 4.33 7 7 9.33 12 12 12M12 14C9.33 14 4 15.33 4 18V20H20V18C20 15.33 14.67 14 12 14Z"/></svg>
  </div>

  <!-- Logout -->
  <div class="icon-btn" onclick="logout()" title="Logout">
    <svg viewBox="0 0 24 24"><path d="M10,17V14H3V10H10V7L15,12L10,17M19,3H11V5H19V19H11V21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z"/></svg>
  </div>

</div>

<!-- ========================================================= -->
<!-- CONTENT                                                   -->
<!-- ========================================================= -->
<div id="content">

  <!-- XP VERWALTUNG (Startseite) -->
  <div id="xpPage">
    <h1>XP-Verwaltung</h1>

    <select id="xpClassSelect" onchange="loadXPStudents()"></select>

    <div id="xpStudentList"></div>

    <h3>XP vergeben</h3>
    <input type="number" id="xpDelta" value="5">
    <button onclick="grantXPSelected()">An ausgewählte</button>
    <button onclick="grantXPAll()">An ALLE</button>

    <h3>Mission-XP</h3>
    <select id="missionSelect"></select><br>
    <button onclick="grantMissionXPSelected()">An ausgewählte</button>
    <button onclick="grantMissionXPAll()">An ALLE</button>
  </div>

  <!-- KLASSEN & SCHÜLER -->
  <div id="classPage" style="display:none;">
    <h1>Klassen & Schüler:innen</h1>

    <h3>Klasse anlegen</h3>
    <input id="className" placeholder="Neue Klasse">
    <button onclick="addClass()">Anlegen</button>

    <h3>Alle Klassen</h3>
    <div id="classList"></div>

    <h3>Schüler:innen verwalten</h3>
    <select id="studentClassSelect" onchange="loadStudents()"></select><br>

    <input id="studentName" placeholder="Name">
    <input id="studentPass" placeholder="Passwort">
    <button onclick="addStudent()">Anlegen</button>

    <div id="studentList"></div>
  </div>

  <!-- MISSIONEN -->
  <div id="missionPage" style="display:none;">
    <h1>Missionen</h1>

    <input id="missionName" placeholder="Name">
    <input id="missionXP" type="number" placeholder="XP"><br>

    <label>Bild:</label>
    <input type="file" id="missionImage">
    <button onclick="uploadMissionImage()">Upload</button><br>

    <label>Upload erforderlich?</label>
    <select id="missionUploadRequired">
      <option value="false">Nein</option>
      <option value="true">Ja</option>
    </select>

    <input type="hidden" id="missionImageUrl"><br>

    <button onclick="addMission()">Mission anlegen</button>

    <h3>Alle Missionen</h3>
    <div id="missionList"></div>
  </div>

</div>

<script>
// =========================================================
// Navigation
// =========================================================
function showPage(id){
  document.querySelectorAll("#content > div")
    .forEach(div => div.style.display = "none");
  $(id).style.display = "block";
}

// =========================================================
// Helper
// =========================================================
function $(id){ return document.getElementById(id); }

async function api(url, method="GET", data=null){
  const opt = { method, headers:{} };
  if(data){
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(data);
  }
  const res = await fetch(url,opt);
  return res.json();
}

async function logout(){
  await api("/api/logout","POST");
  window.location.href="/login.html";
}

// =========================================================
// Laden: Klassen / Schüler / XP
// =========================================================
async function loadClasses(){
  const classes = await api("/api/class");
  const xpSel = $("xpClassSelect");
  const stuSel = $("studentClassSelect");
  const list = $("classList");

  xpSel.innerHTML = "";
  stuSel.innerHTML = "";
  list.innerHTML = "";

  classes.forEach(c=>{
    xpSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    stuSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;

    list.innerHTML += `
      <div>
        ${c.name}
        <button class="red" onclick="deleteClass(${c.id})">Löschen</button>
      </div>
    `;
  });

  if(classes.length>0){
    loadXPStudents();
    loadStudents();
  }
}

async function addClass(){
  const n = $("className").value.trim();
  if(!n) return alert("Name fehlt");
  await api("/api/class","POST",{name:n});
  $("className").value="";
  loadClasses();
}

async function deleteClass(id){
  if(!confirm("Löschen?")) return;
  await api("/api/class/"+id,"DELETE");
  loadClasses();
}

async function loadStudents(){
  const cid = $("studentClassSelect").value;
  const list = $("studentList");
  if(!cid){ list.innerHTML=""; return; }

  const stu = await api(`/api/student?classId=${cid}`);
  list.innerHTML="";

  stu.forEach(s=>{
    list.innerHTML += `
      <div class="student-row">
        ${s.name} (XP: ${s.xp})
        <button class="red" onclick="deleteStudent(${s.id})">Löschen</button>
      </div>
    `;
  });
}

async function addStudent(){
  const cid = $("studentClassSelect").value;
  const name = $("studentName").value;
  const pass = $("studentPass").value;

  await api("/api/student","POST",{name,password:pass,classId:cid});
  $("studentName").value="";
  $("studentPass").value="";
  loadStudents();
  loadXPStudents();
}

async function deleteStudent(id){
  if(!confirm("Löschen?")) return;
  await api("/api/student/"+id,"DELETE");
  loadStudents();
  loadXPStudents();
}

// =========================================================
// XP-Verwaltung
// =========================================================
async function loadXPStudents(){
  const cid = $("xpClassSelect").value;
  if(!cid) return;

  const [students, uploads] = await Promise.all([
    api(`/api/student?classId=${cid}`),
    api(`/api/admin/uploads?classId=${cid}`)
  ]);

  const box = $("xpStudentList");
  box.innerHTML="";

  students.forEach(s=>{
    const myUploads = uploads.filter(u=>u.student_name===s.name);

    let uploadHTML = "";
    if(myUploads.length>0){
      uploadHTML = myUploads.map(u=>`
        <div class="upload-line">
          <img src="${u.image_url}" class="thumb">
          <span>${u.mission_name}</span>
          <button class="red" onclick="deleteUpload(${u.upload_id})">Löschen</button>
        </div>
      `).join("");
    } else {
      uploadHTML = `<div style='color:#777;font-size:0.9em;'>Keine Uploads</div>`;
    }

    box.innerHTML += `
      <div class="student-row">
        <input type="checkbox" class="xpCheck" value="${s.id}">
        <b>${s.name}</b> – XP: ${s.xp}
        <div style="margin-left:25px;margin-top:5px;">${uploadHTML}</div>
      </div>
    `;
  });
}

function selectedStudentIds(){
  return [...document.querySelectorAll(".xpCheck:checked")].map(cb=>cb.value);
}

async function grantXPSelected(){
  const ids = selectedStudentIds();
  const xp = parseInt($("xpDelta").value);

  await api("/api/xp/give","POST",{studentIds:ids,xp});
  loadXPStudents();
  loadStudents();
}

async function grantXPAll(){
  const cid = $("xpClassSelect").value;
  const xp = parseInt($("xpDelta").value);

  await api("/api/xp/give/all","POST",{classId:cid,xp});
  loadXPStudents();
  loadStudents();
}

async function grantMissionXPSelected(){
  const ids = selectedStudentIds();
  const mid = $("missionSelect").value;

  await api("/api/xp/mission/give","POST",{studentIds:ids,missionId:mid});
  loadXPStudents();
  loadStudents();
}

async function grantMissionXPAll(){
  const cid = $("xpClassSelect").value;
  const mid = $("missionSelect").value;

  await api("/api/xp/mission/give/all","POST",{classId:cid,missionId:mid});
  loadXPStudents();
  loadStudents();
}

async function deleteUpload(id){
  await api("/api/admin/upload/"+id,"DELETE");
  loadXPStudents();
}

// =========================================================
// Missionen
// =========================================================
async function loadMissions(){
  const list = await api("/api/missions");
  const sel = $("missionSelect");
  const box = $("missionList");

  sel.innerHTML="";
  box.innerHTML="";

  list.forEach(m=>{
    sel.innerHTML += `<option value="${m.id}">${m.name} (${m.xp} XP)</option>`;

    box.innerHTML += `
      <div class="student-row">
        <img src="${m.image_url}" class="thumb">
        <b>${m.name}</b> – ${m.xp} XP – Upload: ${m.require_upload?"Ja":"Nein"}
        <button class="red" onclick="deleteMission(${m.id})">Löschen</button>
      </div>
    `;
  });
}

async function uploadMissionImage(){
  const file = $("missionImage").files[0];
  const fd = new FormData();
  fd.append("image",file);

  const res = await fetch("/api/missions/upload",{method:"POST",body:fd});
  const json = await res.json();
  $("missionImageUrl").value = json.url;
}

async function addMission(){
  const name = $("missionName").value;
  const xp = $("missionXP").value;
  const url = $("missionImageUrl").value;
  const req = $("missionUploadRequired").value;

  await api("/api/missions","POST",{name,xp,imageUrl:url,requireUpload:req});
  $("missionName").value="";
  $("missionXP").value="";
  $("missionImageUrl").value="";
  $("missionImage").value="";
  loadMissions();
}

async function deleteMission(id){
  await api("/api/missions/"+id,"DELETE");
  loadMissions();
}

// =========================================================
// INIT
// =========================================================
loadClasses();
loadMissions();
showPage("xpPage"); // Startseite: XP Verwaltung
</script>
</body>
</html>
