<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Temple of Logic – Admin</title>
  <style>
    body { background:black; color:white; font-family:Arial; margin:0; padding:0; display:flex; height:100vh; }
    #menu { width:220px; background:#111; padding:20px; }
    #menu button { width:100%; margin-bottom:10px; padding:10px; background:#333; color:white; border:none; cursor:pointer; }
    #menu button:hover { background:#555; }
    #content { flex:1; padding:20px; overflow:auto; }
    .delete-btn { background:#900; color:white; padding:5px 10px; border:none; cursor:pointer; }
  </style>
</head>
<body>

  <!-- ==================== Menü ==================== -->
  <div id="menu">
    <button onclick="showSection('section-klassen')">Klassen</button>
    <button onclick="showSection('section-schueler')">Schüler:innen</button>
    <button onclick="showSection('section-missionen')">Missionen</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- ==================== Inhalt ==================== -->
  <div id="content">

    <!-- ==================== KLASSEN ==================== -->
    <div id="section-klassen" style="display:none;">
      <h2>Klassenverwaltung</h2>

      <input id="newClassName" placeholder="Klassenname (z. B. 7a)">
      <button onclick="addClass()">Klasse anlegen</button>

      <h3>Klassenliste</h3>
      <div id="classList"></div>
    </div>

    <!-- ==================== SCHÜLER ==================== -->
    <div id="section-schueler" style="display:none;">
      <h2>Schüler:innen</h2>

      <select id="classSelectForStudents" onchange="loadStudents()"></select>

      <h3>Neue Schüler:in anlegen</h3>
      <input id="studentName" placeholder="Name">
      <input id="studentPassword" placeholder="Passwort">
      <button onclick="addStudent()">Anlegen</button>

      <h3>Schüler:innen der Klasse</h3>
      <div id="studentList"></div>
    </div>

    <!-- ==================== MISSIONEN ==================== -->
    <div id="section-missionen" style="display:none;">
      <h2>Mission anlegen</h2>

      <input id="missionName" placeholder="Missionsname" style="margin-bottom:10px;"><br>
      <input id="missionXP" type="number" placeholder="XP" style="margin-bottom:10px;"><br>

      <label>
        <input type="checkbox" id="missionRequireUpload">
        Bild ist Pflicht
      </label>
      <br><br>

      <input type="file" id="missionImage"><br><br>

      <button onclick="createMission()" style="background:green; padding:8px 14px; border:none; cursor:pointer;">
        Mission speichern
      </button>

      <h3 style="margin-top:30px;">Alle Missionen</h3>
      <div id="missionsList"></div>
    </div>

  </div>

<script>
/* ============================================================
   HELFER
============================================================ */

function showSection(id) {
  document.querySelectorAll('#content > div').forEach(div => div.style.display = 'none');
  document.getElementById(id).style.display = 'block';

  if (id === "section-klassen") loadClasses();
  if (id === "section-schueler") loadClassesForStudents();
  if (id === "section-missionen") loadMissions();
}

async function logout() {
  await fetch("/api/logout", { method:"POST", credentials:"include" });
  window.location.href = "/login.html";
}

/* ============================================================
   KLASSEN
============================================================ */

async function loadClasses() {
  const res = await fetch("/api/class", { credentials:"include" });
  const data = await res.json();
  const box = document.getElementById("classList");

  box.innerHTML = "";
  data.forEach(c => {
    box.innerHTML += `
      <div style="margin-bottom:8px;">
        ${c.name}
        <button class="delete-btn" onclick="deleteClass(${c.id})">Löschen</button>
      </div>
    `;
  });
}

async function addClass() {
  const name = document.getElementById("newClassName").value.trim();
  if (!name) return alert("Name fehlt");

  await fetch("/api/class", {
    method:"POST",
    credentials:"include",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ name })
  });

  document.getElementById("newClassName").value = "";
  loadClasses();
}

async function deleteClass(id) {
  await fetch("/api/class/" + id, {
    method:"DELETE",
    credentials:"include"
  });
  loadClasses();
}

/* ============================================================
   SCHÜLER:INNEN
============================================================ */

async function loadClassesForStudents() {
  const res = await fetch("/api/class", { credentials:"include" });
  const classes = await res.json();

  const sel = document.getElementById("classSelectForStudents");
  sel.innerHTML = "";

  classes.forEach(c => {
    sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });

  loadStudents();
}

async function loadStudents() {
  const classId = document.getElementById("classSelectForStudents").value;
  const res = await fetch(`/api/student?classId=${classId}`, { credentials:"include" });
  const data = await res.json();

  const box = document.getElementById("studentList");
  box.innerHTML = "";

  data.forEach(s => {
    box.innerHTML += `
      <div style="margin-bottom:8px;">
        ${s.name} – ${s.xp} XP
        <button class="delete-btn" onclick="deleteStudent(${s.id})">Löschen</button>
      </div>
    `;
  });
}

async function addStudent() {
  const name = document.getElementById("studentName").value.trim();
  const password = document.getElementById("studentPassword").value.trim();
  const classId = document.getElementById("classSelectForStudents").value;

  if (!name || !password) return alert("Name + Passwort nötig");

  await fetch("/api/student", {
    method:"POST",
    credentials:"include",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ name, password, classId })
  });

  document.getElementById("studentName").value = "";
  document.getElementById("studentPassword").value = "";

  loadStudents();
}

async function deleteStudent(id) {
  await fetch("/api/student/" + id, {
    method:"DELETE",
    credentials:"include"
  });
  loadStudents();
}

/* ============================================================
   MISSIONEN
============================================================ */

async function loadMissions() {
  const res = await fetch("/api/missions", { credentials:"include" });
  const data = await res.json();

  const box = document.getElementById("missionsList");
  box.innerHTML = "";

  data.forEach(m => {
    box.innerHTML += `
      <div style="margin-bottom:15px;">
        <b>${m.name}</b> – ${m.xp} XP
        ${m.image_url ? `<br><img src="${m.image_url}" height="80">` : ""}
        <br>
        ${m.require_upload ? "<i>Bildpflicht</i><br>" : ""}
        <button class="delete-btn" onclick="deleteMission(${m.id})">Löschen</button>
      </div>
    `;
  });
}

async function createMission() {
  const name = document.getElementById("missionName").value.trim();
  const xp = parseInt(document.getElementById("missionXP").value);
  const requireUpload = document.getElementById("missionRequireUpload").checked;
  const imageFile = document.getElementById("missionImage").files[0];

  if (!name || !xp) return alert("Name + XP nötig");

  let imageUrl = null;

  if (imageFile) {
    const form = new FormData();
    form.append("image", imageFile);

    const uploadRes = await fetch("/api/missions/upload", {
      method:"POST",
      credentials:"include",
      body: form
    });

    const uploadData = await uploadRes.json();

    if (uploadData.success) {
      imageUrl = uploadData.url;
    }
  }

  await fetch("/api/missions", {
    method:"POST",
    credentials:"include",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ name, xp, imageUrl, requireUpload })
  });

  document.getElementById("missionName").value = "";
  document.getElementById("missionXP").value = "";
  document.getElementById("missionRequireUpload").checked = false;
  document.getElementById("missionImage").value = "";

  loadMissions();
}

async function deleteMission(id) {
  await fetch("/api/missions/" + id, {
    method:"DELETE",
    credentials:"include"
  });
  loadMissions();
}

</script>
</body>
</html>
