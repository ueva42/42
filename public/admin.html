<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Temple of Logic</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2, h3 {
      margin-bottom: 10px;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
    }
    button {
      background: #2b8a3e;
      color: white;
      border: none;
      cursor: pointer;
    }
    button.red {
      background: #b30000;
    }
    hr {
      margin: 20px 0;
      border: 1px solid #444;
    }
    .mission-img {
      height: 60px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .xp-row {
      margin: 3px 0;
    }
  </style>
</head>
<body>

<h1>Admin-Bereich</h1>
<button onclick="logout()">Logout</button>

<hr>

<h2>Klassen</h2>
<input id="className" placeholder="Klassenname (z. B. 7a)">
<button onclick="createClass()">Klasse anlegen</button>

<h3>Klassenliste</h3>
<div id="classList"></div>

<hr>

<h2>Schüler:innen</h2>
<label>Aktive Klasse auswählen:</label>
<select id="activeClass" onchange="onActiveClassChange()"></select>
<br>
<input id="studentName" placeholder="Name">
<input id="studentPass" placeholder="Passwort">
<button onclick="createStudent()">Schüler:in anlegen</button>

<h3>Schüler:innen dieser Klasse</h3>
<div id="studentList"></div>

<hr>

<h2>Missionen</h2>

<input id="missionName" placeholder="Missionsname">
<input id="missionXp" placeholder="XP" type="number" min="0">
<br>

<label>Bild (Pflicht):</label>
<input id="missionImg" type="file" accept="image/*">
<br>

<label>Upload erforderlich?</label>
<select id="missionRequired">
  <option value="false" selected>Nein</option>
  <option value="true">Ja</option>
</select>
<br>

<button onclick="createMission()">Mission anlegen</button>

<h3>Alle Missionen</h3>
<div id="missionList"></div>

<hr>

<h2>XP-Verwaltung</h2>

<h3>Schüler:innen der aktiven Klasse</h3>
<div id="xpStudentList"></div>

<input id="xpValue" type="number" placeholder="XP (+/-)">
<button onclick="grantXpSelected()">XP an ausgewählte</button>
<button onclick="grantXpAll()">XP an alle</button>
<br>

<label>Mission auswählen:</label>
<select id="xpMissionSelect"></select>
<button onclick="grantMissionXpSelected()">Mission-XP an ausgewählte</button>
<button onclick="grantMissionXpAll()">Mission-XP an alle</button>

<hr>

<h3>Uploads dieser Klasse</h3>
<div id="uploadList"></div>

<hr>

<script>
// =========================================================
// Helfer für JSON-API
// =========================================================
async function api(url, method = "GET", data = null) {
  const opt = { method, headers: {} };
  if (data) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(data);
  }
  const res = await fetch(url, opt);
  return await res.json().catch(() => ({}));
}

// =========================================================
// Logout
// =========================================================
async function logout() {
  await api("/api/logout", "POST");
  location.href = "/login.html";
}

// =========================================================
// Klassen
// =========================================================
async function loadClasses() {
  const data = await api("/api/class");
  const classList = document.getElementById("classList");
  const select = document.getElementById("activeClass");

  classList.innerHTML = "";
  select.innerHTML = "";

  data.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    select.appendChild(opt);

    const div = document.createElement("div");
    div.innerHTML = `
      ${c.name}
      <button class="red" onclick="deleteClass(${c.id})">Löschen</button>
    `;
    classList.appendChild(div);
  });

  if (data.length > 0) {
    await loadStudents();
    await loadXpStudents();
    await loadUploads();
  } else {
    document.getElementById("studentList").innerHTML = "";
    document.getElementById("xpStudentList").innerHTML = "";
    document.getElementById("uploadList").innerHTML = "";
  }
}

async function createClass() {
  const name = document.getElementById("className").value.trim();
  if (!name) return alert("Bitte Klassennamen eingeben.");

  const res = await api("/api/class", "POST", { name });
  if (!res.success) {
    alert(res.error || "Fehler beim Anlegen der Klasse.");
  }
  document.getElementById("className").value = "";
  await loadClasses();
}

async function deleteClass(id) {
  if (!confirm("Klasse wirklich löschen?")) return;
  await api(`/api/class/${id}`, "DELETE");
  await loadClasses();
}

// =========================================================
// Schüler:innen
// =========================================================
async function loadStudents() {
  const classId = document.getElementById("activeClass").value;
  if (!classId) {
    document.getElementById("studentList").innerHTML = "";
    return;
  }

  const data = await api(`/api/student?classId=${classId}`);
  const list = document.getElementById("studentList");
  list.innerHTML = "";

  data.forEach(s => {
    const div = document.createElement("div");
    div.innerHTML = `
      ${s.name} (XP: ${s.xp})
      <button class="red" onclick="deleteStudent(${s.id})">Löschen</button>
    `;
    list.appendChild(div);
  });

  await loadXpStudents();
}

async function createStudent() {
  const name = document.getElementById("studentName").value.trim();
  const password = document.getElementById("studentPass").value;
  const classId = document.getElementById("activeClass").value;

  if (!classId) return alert("Bitte zuerst eine Klasse auswählen.");
  if (!name || !password) return alert("Name und Passwort eingeben.");

  const res = await api("/api/student", "POST", { name, password, classId });
  if (!res.success) {
    alert(res.error || "Fehler beim Anlegen der Schüler:in.");
  }

  document.getElementById("studentName").value = "";
  document.getElementById("studentPass").value = "";

  await loadStudents();
}

async function deleteStudent(id) {
  if (!confirm("Schüler:in wirklich löschen?")) return;
  await api(`/api/student/${id}`, "DELETE");
  await loadStudents();
}

// Wird von Select onchange genutzt
async function onActiveClassChange() {
  await loadStudents();
  await loadXpStudents();
  await loadUploads();
}

// =========================================================
// Missionen
// =========================================================
async function createMission() {
  const name = document.getElementById("missionName").value.trim();
  const xpRaw = document.getElementById("missionXp").value;
  const requireUpload = document.getElementById("missionRequired").value;
  const file = document.getElementById("missionImg").files[0];

  if (!name) return alert("Bitte Missionsnamen eingeben.");
  if (!xpRaw) return alert("Bitte XP-Wert eingeben.");
  const xp = parseInt(xpRaw, 10);
  if (isNaN(xp)) return alert("XP muss eine Zahl sein.");
  if (!file) return alert("Ein Bild ist Pflicht für diese Mission.");

  // 1. Upload zu R2
  const form = new FormData();
  form.append("image", file);

  const uploadRes = await fetch("/api/missions/upload", {
    method: "POST",
    body: form,
  }).then(r => r.json());

  if (!uploadRes.success) {
    alert(uploadRes.error || "Upload fehlgeschlagen.");
    return;
  }

  const imageUrl = uploadRes.url;

  // 2. Mission speichern
  const saveRes = await api("/api/missions", "POST", {
    name,
    xp,
    imageUrl,
    requireUpload,
  });

  if (!saveRes.success) {
    alert(saveRes.error || "Fehler beim Speichern der Mission.");
    return;
  }

  document.getElementById("missionName").value = "";
  document.getElementById("missionXp").value = "";
  document.getElementById("missionImg").value = "";
  document.getElementById("missionRequired").value = "false";

  await loadMissions();
}

async function loadMissions() {
  const data = await api("/api/missions");
  const list = document.getElementById("missionList");
  list.innerHTML = "";

  data.forEach(m => {
    const div = document.createElement("div");
    div.innerHTML = `
      <strong>${m.name}</strong> – ${m.xp} XP<br>
      Upload erforderlich: ${m.require_upload ? "Ja" : "Nein"}<br>
      <img class="mission-img" src="${m.image_url}" alt="Mission"><br>
      <hr>
    `;
    list.appendChild(div);
  });

  // Missionsliste für XP-Bereich
  const xpSelect = document.getElementById("xpMissionSelect");
  xpSelect.innerHTML = "";
  data.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = `${m.name} (${m.xp} XP)`;
    xpSelect.appendChild(opt);
  });
}

// =========================================================
// XP-Verwaltung
// =========================================================
async function loadXpStudents() {
  const classId = document.getElementById("activeClass").value;
  const list = document.getElementById("xpStudentList");
  list.innerHTML = "";

  if (!classId) return;

  const data = await api(`/api/student?classId=${classId}`);

  data.forEach(s => {
    const div = document.createElement("div");
    div.className = "xp-row";
    div.innerHTML = `
      <label>
        <input type="checkbox" class="xp-student" value="${s.id}">
        ${s.name} (XP: ${s.xp})
      </label>
    `;
    list.appendChild(div);
  });
}

function getSelectedXpStudents() {
  return Array.from(document.querySelectorAll(".xp-student:checked"))
    .map(cb => parseInt(cb.value, 10))
    .filter(n => !isNaN(n));
}

async function grantXpSelected() {
  const classId = document.getElementById("activeClass").value;
  if (!classId) return alert("Bitte zuerst eine Klasse auswählen.");

  const xpRaw = document.getElementById("xpValue").value;
  const xp = parseInt(xpRaw, 10);
  if (isNaN(xp)) return alert("XP-Wert eingeben.");

  const ids = getSelectedXpStudents();
  if (ids.length === 0) return alert("Bitte Schüler:innen auswählen.");

  const res = await api("/api/xp/grant", "POST", {
    classId,
    studentIds: ids,
    applyToAll: false,
    xpDelta: xp
  });

  if (!res.success) {
    alert(res.error || "Fehler bei der XP-Vergabe.");
    return;
  }

  await loadStudents();
  await loadXpStudents();
}

async function grantXpAll() {
  const classId = document.getElementById("activeClass").value;
  if (!classId) return alert("Bitte zuerst eine Klasse auswählen.");

  const xpRaw = document.getElementById("xpValue").value;
  const xp = parseInt(xpRaw, 10);
  if (isNaN(xp)) return alert("XP-Wert eingeben.");

  const res = await api("/api/xp/grant", "POST", {
    classId,
    applyToAll: true,
    xpDelta: xp
  });

  if (!res.success) {
    alert(res.error || "Fehler bei der XP-Vergabe.");
    return;
  }

  await loadStudents();
  await loadXpStudents();
}

async function grantMissionXpSelected() {
  const classId = document.getElementById("activeClass").value;
  if (!classId) return alert("Bitte zuerst eine Klasse auswählen.");

  const missionId = document.getElementById("xpMissionSelect").value;
  if (!missionId) return alert("Bitte Mission auswählen.");

  const ids = getSelectedXpStudents();
  if (ids.length === 0) return alert("Bitte Schüler:innen auswählen.");

  const res = await api("/api/xp/grant", "POST", {
    classId,
    studentIds: ids,
    applyToAll: false,
    missionId
  });

  if (!res.success) {
    alert(res.error || "Fehler bei der Mission-XP-Vergabe.");
    return;
  }

  await loadStudents();
  await loadXpStudents();
}

async function grantMissionXpAll() {
  const classId = document.getElementById("activeClass").value;
  if (!classId) return alert("Bitte zuerst eine Klasse auswählen.");

  const missionId = document.getElementById("xpMissionSelect").value;
  if (!missionId) return alert("Bitte Mission auswählen.");

  const res = await api("/api/xp/grant", "POST", {
    classId,
    applyToAll: true,
    missionId
  });

  if (!res.success) {
    alert(res.error || "Fehler bei der Mission-XP-Vergabe.");
    return;
  }

  await loadStudents();
  await loadXpStudents();
}

// =========================================================
// Uploads (Admin-Ansicht)
// =========================================================
async function loadUploads() {
  const classId = document.getElementById("activeClass").value;
  const list = document.getElementById("uploadList");
  list.innerHTML = "";

  if (!classId) return;

  const data = await api(`/api/uploads?classId=${classId}`);

  data.forEach(u => {
    const div = document.createElement("div");
    const dateStr = new Date(u.created_at).toLocaleString();
    div.innerHTML = `
      <strong>${u.student_name}</strong> – Mission: ${u.mission_name}<br>
      <img class="mission-img" src="${u.image_url}" alt="Upload"><br>
      <small>${dateStr}</small><br>
      <button class="red" onclick="deleteUpload(${u.id})">Löschen</button>
      <hr>
    `;
    list.appendChild(div);
  });
}

async function deleteUpload(id) {
  if (!confirm("Upload wirklich löschen?")) return;
  await api(`/api/uploads/${id}`, "DELETE");
  await loadUploads();
}

// =========================================================
// INIT
// =========================================================
(async function init() {
  await loadClasses();
  await loadMissions();
})();
</script>

</body>
</html>
