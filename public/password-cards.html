<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streets of Logic – Passwörter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      margin: 0;
      padding: 20px;
      color: #f8fafc;
    }

    h1 {
      text-align: center;
      font-family: "Bangers";
      color: #fef9c3;
      letter-spacing: 0.2em;
      text-shadow: 0 0 8px rgba(255,255,255,0.2);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 14px;
      border: 1px solid #334155;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      page-break-inside: avoid;
    }

    .name {
      font-size: 18px;
      margin-bottom: 4px;
      color: #f1f5f9;
      font-weight: bold;
    }

    .pw {
      font-size: 16px;
      margin-bottom: 10px;
      color: #38bdf8;
      font-weight: bold;
    }

    .qr {
      width: 110px;
      height: 110px;
      margin: auto;
    }

    @media print {
      body {
        padding: 0;
      }
      .card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <h1>Passwortkarten – Streets of Logic</h1>

  <div id="grid" class="grid"></div>

  <script>
    /* -----------------------------
       URL-Parameter auslesen
    ------------------------------ */
    const params = new URLSearchParams(window.location.search);
    const classId = params.get("classId");
    if (!classId) {
      document.body.innerHTML = "<h2 style='color:white;text-align:center'>Fehler: classId fehlt</h2>";
      throw new Error("classId fehlt");
    }

    /* -----------------------------
       SERVER-DATEN LADEN
    ------------------------------ */
    async function loadCards() {
      const r = await fetch(`/api/exportPasswords?classId=${classId}`);
      const data = await r.json();

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      // **QR-Link zu deiner Login-Seite**
      const LOGIN_URL = "https://42-production-44e7.up.railway.app/login";

      data.forEach(student => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="name">${student.name}</div>
          <div class="pw">Passwort: ${student.password}</div>
          <div class="qr" id="qr_${student.id}"></div>
        `;

        grid.appendChild(card);

        // QR-Code erzeugen
        new QRCode(document.getElementById(`qr_${student.id}`), {
          text: LOGIN_URL,
          width: 110,
          height: 110,
          colorDark: "#ffffff",
          colorLight: "#1e293b"
        });
      });
    }

    loadCards();
  </script>
</body>
</html>
