<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Passwortkarten – Streets of Logic</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: white;
    color: #000;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .note {
    max-width: 210mm;
    margin: 0 auto 16px;
    font-size: 13px;
    line-height: 1.45;
    color: #333;
  }

  .page {
    width: 210mm;
    min-height: 297mm;
    display: flex;
    flex-wrap: wrap;
    gap: 10mm;
    page-break-after: always;
  }

  .card {
    width: 90mm;
    height: 55mm;
    border: 2px solid #000;
    border-radius: 6px;
    padding: 8px 10px;
    color: #000;
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .left {
    width: 55%;
  }

  .title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .name {
    font-size: 13px;
    margin-bottom: 6px;
  }

  .password {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .qr {
    width: 42mm;
    height: 42mm;
    background: white;
    padding: 4px;
    border: 1px solid #000;
  }

  @media print {
    .page { page-break-after: always; }
    body { background: white; }
    .card { box-shadow: none; }
    .note { display: none; }
  }
</style>
</head>
<body>

<h1>Streets of Logic – Passwortkarten</h1>
<p class="note" id="note">
  Diese Karten zeigen nur frisch ausgestellte Einmalpasswörter. Gespeicherte Passwörter werden aus Datenschutzgründen nicht mehr ausgelesen.
</p>

<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>

<script>
function loadFromSession() {
  const urlParams = new URLSearchParams(window.location.search);
  const classId = urlParams.get("classId");
  const raw = sessionStorage.getItem("solPasswordCards");
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    if (classId && Number(data.classId) !== Number(classId)) return null;
    if (!Array.isArray(data.students) || !data.students.length) return null;
    // Einmal nutzen – danach nicht erneut aus dem Speicher holen
    sessionStorage.removeItem("solPasswordCards");
    return data.students;
  } catch (_err) {
    return null;
  }
}

function renderStudents(students) {
  const container = document.getElementById("container");
  if (!students.length) {
    container.innerHTML = "<h2>Keine Schüler:innen gefunden.</h2>";
    return;
  }

  let page = document.createElement("div");
  page.classList.add("page");
  container.appendChild(page);

  let count = 0;

  for (const s of students) {
    if (count === 8) {
      page = document.createElement("div");
      page.classList.add("page");
      container.appendChild(page);
      count = 0;
    }

    const card = document.createElement("div");
    card.classList.add("card");

    const left = document.createElement("div");
    left.classList.add("left");

    left.innerHTML = `
      <div class="title">Streets of Logic</div>
      <div class="name">${String(s.name || "").replace(/</g, "&lt;")}</div>
      <div class="password">${String(s.password || "").replace(/</g, "&lt;")}</div>
    `;

    const qr = document.createElement("canvas");
    qr.classList.add("qr");

    new QRious({
      element: qr,
      size: 180,
      value: window.location.origin + "/login"
    });

    card.appendChild(left);
    card.appendChild(qr);
    page.appendChild(card);

    count++;
  }
}

function load() {
  const students = loadFromSession();
  if (!students) {
    document.getElementById("note").textContent =
      "Keine frisch ausgestellten Passwörter gefunden. Bitte unter „Klassen & Schüler“ auf „Passwörter neu setzen & Karten“ klicken.";
    document.getElementById("container").innerHTML =
      "<h2>Bitte zuerst Passwörter neu setzen.</h2>";
    return;
  }
  renderStudents(students);
}

load();
</script>

</body>
</html>
