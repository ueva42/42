<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streets of Logic – Passwortkarten</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --border-color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #020617;
      color: #0f172a;
    }

    .wrapper {
      max-width: 210mm;
      margin: 0 auto;
      padding: 10mm;
      background: #020617;
    }

    h1 {
      font-family: "Bangers", cursive;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 20px;
      color: #fef9c3;
      text-align: center;
      margin: 0 0 4mm 0;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 0 10px rgba(250,204,21,0.9);
    }

    .meta {
      text-align: center;
      font-size: 11px;
      color: #e5e7eb;
      margin-bottom: 6mm;
    }

    .page {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4mm;
      page-break-after: always;
    }

    .card {
      border-radius: 6px;
      border: 0.5pt solid var(--border-color);
      padding: 3mm 3mm 2.5mm 3mm;
      background: #f9fafb;
      position: relative;
      font-size: 9pt;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 35mm;
    }

    .card-title {
      font-family: "Bangers", cursive;
      font-size: 9pt;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 1mm;
      color: #111827;
    }

    .card-sub {
      font-size: 7.5pt;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #4b5563;
      margin-bottom: 1.5mm;
    }

    .row {
      margin-bottom: 1mm;
    }

    .label {
      font-size: 7pt;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
      margin-bottom: 0.5mm;
    }

    .value {
      font-size: 9pt;
      font-weight: 600;
      color: #111827;
    }

    .hint {
      margin-top: 1.5mm;
      font-size: 6.5pt;
      color: #6b7280;
    }

    .class-pill {
      position: absolute;
      top: 2mm;
      right: 2mm;
      font-size: 6.5pt;
      padding: 1px 4px;
      border-radius: 999px;
      border: 0.4pt solid #9ca3af;
      color: #374151;
      background: #e5e7eb;
    }

    .footer {
      text-align: center;
      margin-top: 2mm;
      font-size: 7pt;
      color: #9ca3af;
    }

    /* Druckeinstellungen */
    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    @media print {
      body {
        background: #ffffff;
      }
      .wrapper {
        max-width: none;
        padding: 0;
      }
      h1, .meta, .footer {
        color: #111827;
        text-shadow: none;
      }
    }

    /* Fehlermeldung */
    #error {
      color: #fecaca;
      background: #7f1d1d;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
    }

    #info-loading {
      color: #e5e7eb;
      font-size: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>STREETS OF LOGIC</h1>
    <div class="meta" id="metaText">XP EDITION – PASSWORTKARTEN</div>
    <div id="error"></div>
    <div id="info-loading">Lade Klassendaten …</div>

    <div id="pagesContainer"></div>

    <div class="footer">
      Tipp: Nach dem Druck in Streifen schneiden und Karten an die Schüler:innen ausgeben.
    </div>
  </div>

  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    async function loadClassName(classId) {
      const r = await fetch("/api/class");
      const classes = await r.json();
      const c = classes.find(cl => String(cl.id) === String(classId));
      return c ? c.name : null;
    }

    function chunkArray(arr, size) {
      const out = [];
      for (let i = 0; i < arr.length; i += size) {
        out.push(arr.slice(i, i + size));
      }
      return out;
    }

    async function init() {
      const errorDiv = document.getElementById("error");
      const loadingDiv = document.getElementById("info-loading");
      const metaText = document.getElementById("metaText");
      const pagesContainer = document.getElementById("pagesContainer");

      const classId = getQueryParam("classId");
      if (!classId) {
        errorDiv.textContent = "Fehler: Keine Klassen-ID übergeben.";
        errorDiv.style.display = "block";
        loadingDiv.style.display = "none";
        return;
      }

      try {
        const className = await loadClassName(classId);
        if (className) {
          metaText.textContent = "XP EDITION – PASSWORTKARTEN FÜR KLASSE " + className;
        }

        const r = await fetch(`/api/student?classId=${classId}`);
        const students = await r.json();

        loadingDiv.style.display = "none";

        if (!students.length) {
          errorDiv.textContent = "Für diese Klasse sind noch keine Schüler:innen angelegt.";
          errorDiv.style.display = "block";
          return;
        }

        // Schüler nach Name sortieren
        students.sort((a, b) => a.name.localeCompare(b.name, "de"));

        // In 8er-Gruppen aufteilen
        const groups = chunkArray(students, 8);

        groups.forEach(group => {
          const pageDiv = document.createElement("div");
          pageDiv.className = "page";

          group.forEach(s => {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
              <div class="card-title">STREETS OF LOGIC</div>
              <div class="card-sub">Login & XP – Zugang</div>
              <div class="class-pill">${className || "Klasse"}</div>

              <div class="row">
                <div class="label">Name</div>
                <div class="value">${s.name}</div>
              </div>

              <div class="row">
                <div class="label">Benutzername</div>
                <div class="value">${s.name}</div>
              </div>

              <div class="row">
                <div class="label">Passwort (Einmal)</div>
                <div class="value">${s.password}</div>
              </div>

              <div class="hint">
                Beim ersten Login muss ein eigenes Passwort gesetzt werden.
                Gib diese Karte gut aufbewahrt an ${s.name} weiter.
              </div>
            `;

            pageDiv.appendChild(card);
          });

          pagesContainer.appendChild(pageDiv);
        });

        // Nach dem Rendern automatisch Druckdialog öffnen (optional)
        // window.print();

      } catch (err) {
        console.error(err);
        loadingDiv.style.display = "none";
        errorDiv.textContent = "Fehler beim Laden der Daten.";
        errorDiv.style.display = "block";
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
