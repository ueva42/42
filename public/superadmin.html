<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Superadmin – Streets of Logic</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Roboto", sans-serif;
      height: 100vh;
      display: flex;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,184,108,0.18) 0, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(255,46,99,0.25) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(56,189,248,0.22) 0, transparent 60%),
        #050816;
      color: #f3f4f6;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: rgba(15,23,42,0.95);
      border-right: 2px solid rgba(148,163,184,0.15);
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .orb {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffe066 0, #ff9800 25%, #f97316 40%, #7c2d12 70%, #020617 100%);
      box-shadow: 0 0 14px rgba(255,224,102,1), 0 0 26px rgba(249,115,22,0.9);
      border: 2px solid #111827;
    }

    .logo-title h1 {
      font-family: "Bangers";
      font-size: 22px;
      letter-spacing: 0.18em;
      margin: 0;
      color: #fff8e1;
      text-shadow: 0 0 6px black, 0 0 18px rgba(255,212,128,0.9);
    }

    .logo-sub {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-top: 2px;
    }

    .nav-btn {
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #e5e7eb;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }

    .logout-btn {
      margin-top: auto;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      box-shadow: 0 4px 14px rgba(0,0,0,0.8);
    }

    /* MAIN PANEL */
    .main {
      flex: 1;
      padding: 40px;
    }

    h2 {
      font-family: "Bangers";
      letter-spacing: 0.14em;
      font-size: 28px;
      color: #fff6d4;
      text-shadow: 0 0 12px rgba(255,212,128,0.6);
      margin-top: 0;
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      color: #e5e7eb;
      letter-spacing: 0.12em;
      margin-top: 16px;
      display: block;
    }

    input, select {
      width: 360px;
      padding: 10px 12px;
      background: #020617;
      border: 1px solid #4b5563;
      border-radius: 12px;
      color: #e5e7eb;
      font-size: 14px;
      margin-top: 4px;
      outline: none;
      transition: 0.15s;
    }

    input:focus, select:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 1px rgba(249,115,22,0.9);
    }

    .btn-green {
      margin-top: 18px;
      padding: 10px 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #020617;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 0.12em;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(34,197,94,0.7);
    }

    .list-box {
      margin-top: 30px;
      padding: 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo-wrap">
    <div class="orb"></div>
    <div class="logo-title">
      <h1>STREETS OF LOGIC</h1>
      <div class="logo-sub">SUPERADMIN</div>
    </div>
  </div>

  <button class="nav-btn" onclick="showPanel('schools')">Schulen</button>
  <button class="nav-btn" onclick="showPanel('admins')">Admins</button>
  <button class="nav-btn" onclick="showPanel('system')">Systemstatus</button>
  <button class="nav-btn" onclick="showPanel('install')">Installation / Reset</button>

  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="main" id="panelArea">

  <div id="panel_admins" style="display:block;">
    <h2>Admins verwalten</h2>

    <label>Benutzername</label>
    <input id="adminName">

    <label>Schule</label>
    <select id="schoolSelect"></select>

    <button class="btn-green" onclick="createAdmin()">Admin erstellen</button>

    <div class="list-box">
      <h3>Bestehende Admins</h3>
      <div id="adminList"></div>
    </div>
  </div>

</div>

<script>
function showPanel(id) {
  document.querySelectorAll("#panelArea > div").forEach(div => div.style.display = "none");
  document.getElementById("panel_" + id).style.display = "block";
}

async function logout() {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login";
}

async function loadSchools() {
  const r = await fetch("/api/superadmin/schools");
  const data = await r.json();

  const sel = document.getElementById("schoolSelect");
  sel.innerHTML = "";

  data.forEach(s => {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.name;
    sel.appendChild(o);
  });
}

async function createAdmin() {
  const name = document.getElementById("adminName").value.trim();
  const school = document.getElementById("schoolSelect").value;

  if (!name || !school) return alert("Bitte alles ausfüllen.");

  const r = await fetch("/api/superadmin/admins", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, schoolId: school })
  });

  const data = await r.json();
  if (data.success) {
    alert("Admin angelegt (Einmalpasswort wird automatisch gesetzt).");
    loadAdmins();
  }
}

async function loadAdmins() {
  const r = await fetch("/api/superadmin/admins");
  const data = await r.json();

  const box = document.getElementById("adminList");
  box.innerHTML = "";

  data.forEach(a => {
    const div = document.createElement("div");
    div.style.padding = "6px 0";
    div.textContent = a.name + " (" + a.school_name + ")";
    box.appendChild(div);
  });
}

loadSchools();
loadAdmins();
</script>

</body>
</html>
